<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>

html,body{margin:0;background:var(--fundo);color:var(--tinta);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0}
a{color:var(--verde2)}

.pb-dash{position:sticky;top:0;z-index:20;padding-left:max(20px,calc((100% - 1320px)/2 + 20px));padding-right:max(20px,calc((100% - 1320px)/2 + 20px))}

main{max-width:1320px;margin:0 auto;padding:16px 20px 60px}
#login{max-width:380px;margin:60px auto;background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:26px}
#login label{display:block;font-size:12px;font-weight:600;color:var(--tinta-suave);margin:10px 0 4px}
#login input{width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:8px;font:inherit}

.filtros .lbl{font-size:12px;color:var(--tinta-suave);font-weight:600}

.pill.on{background:var(--verde2);border-color:var(--verde2);color:#fff}
.nav{position:sticky;top:52px;z-index:15;background:var(--fundo);display:flex;gap:4px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--linha);margin-bottom:14px}
.nav a{font-size:13px;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:8px;color:var(--tinta-suave)}

.nav a b{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--verm);color:#fff;font-size:11px;text-align:center;margin-left:4px}
section{margin-bottom:26px;scroll-margin-top:110px}
section>h2{font-size:18px;font-weight:700;color:var(--verde2);margin-bottom:4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section>h2 .acoes{margin-left:auto;display:flex;gap:6px}
section>.sub{font-size:12.5px;color:var(--tinta-suave);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;border-left:4px solid var(--linha)}
.kpi .n{font-family:Archivo;font-size:26px;font-weight:800;line-height:1.1;color:var(--verde2)}
.kpi .n small{font-size:13px;font-weight:600;color:var(--tinta-suave);margin-left:3px}
.kpi .l{font-size:12px;color:var(--tinta-suave);margin-top:3px}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--tinta-suave)}
.kpi.ok{border-left-color:var(--verde)}
.kpi.atencao{border-left-color:var(--amarelo)}
.kpi.alerta{border-left-color:var(--verm)}.kpi.alerta .n{color:var(--verm)}
.kpi.roxo{border-left-color:var(--roxo)}
.painel{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.painel h3{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.painel h3 .acoes{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--tinta-suave);padding:6px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--claro);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
td .t{font-weight:600}
td .s{font-size:11.5px;color:var(--tinta-suave)}
tr.lk{cursor:pointer}tr.lk:hover td{background:#f3f8f5}
.st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--claro);color:var(--tinta-suave);white-space:nowrap}
.st.q1,.st.ok{background:#d9f1e3;color:#0b6b3a}
.st.q2{background:#e6f3ea;color:#2a6b45}
.st.q3,.st.lar{background:#ffe9d6;color:#a34608}
.st.q4,.st.verm{background:#fbe0dc;color:#9a2b1f}
.st.roxo{background:#e9e3f7;color:#4d3a8a}
.st.cinza{background:var(--claro);color:var(--tinta-suave)}
.score{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:7px;font-weight:800;font-family:Archivo}
.score.q1{background:#d9f1e3;color:#0b6b3a}.score.q2{background:#e6f3ea;color:#2a6b45}.score.q3{background:#ffe9d6;color:#a34608}.score.q4{background:#fbe0dc;color:#9a2b1f}.score.sn{background:var(--claro);color:var(--tinta-suave);font-weight:600;font-size:11px}
.mini:not(.btn){display:inline-block;width:70px;height:8px;background:var(--claro);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--verde);border-radius:4px}
.mini.r i{background:var(--verm)}.mini.m i{background:var(--amarelo)}
.vazio{padding:16px;border:1px dashed var(--linha);border-radius:10px;color:var(--tinta-suave);font-size:13px;background:#fbfdfc}
.aviso{font-size:12px;color:var(--tinta-suave);margin:8px 0 0;padding:8px 10px;background:#fbfdfc;border-left:3px solid var(--amarelo);border-radius:6px}

.lin{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--claro);font-size:13px}
.lin:last-child{border-bottom:0}
.lin b{white-space:nowrap}
svg.g{width:100%;height:auto;display:block;font-family:Inter,sans-serif}
svg.g text{font-size:10px;fill:var(--tinta-suave)}
svg.g .eixo{stroke:var(--linha);stroke-width:1}
svg.g .grade{stroke:var(--claro);stroke-width:1}
.alerta-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--claro)}
.alerta-item:last-child{border-bottom:0}
.alerta-item .pri{width:10px;height:10px;border-radius:50%;margin-top:6px}
.pri.p1{background:var(--verm)}.pri.p2{background:var(--amarelo)}.pri.p3{background:#9db8aa}
.alerta-item .m{font-size:13px}
.alerta-item .m b{font-weight:700}
.alerta-item .m .s{font-size:11.5px;color:var(--tinta-suave)}
.alerta-item .dias{font-size:11.5px;color:var(--tinta-suave);white-space:nowrap}
.sug{padding:10px 0;border-bottom:1px solid var(--claro)}
.sug:last-child{border-bottom:0}
.sug .cab{font-size:12px;color:var(--tinta-suave);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sug .tx{margin-top:4px;font-size:13px;white-space:pre-wrap}
.sug .rs{margin-top:4px;font-size:12.5px;color:var(--verde2);white-space:pre-wrap}
.sug .rs::before{content:"↳ resposta: ";font-weight:600}
.estrelas{color:var(--amarelo);letter-spacing:1px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--verde2);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
.negado{max-width:560px;margin:60px auto;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:26px}
.mBg{position:fixed;inset:0;background:rgba(0,40,25,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:50}
.mBg.on{display:flex}
.mBox{background:var(--papel);border-radius:14px;padding:18px 20px;max-width:1100px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mBox input,.mBox select,.mBox textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:inherit}
.mBox input.edT,.mBox input.plT{width:100%;min-width:220px}
.edNova{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.edNova input:first-child{flex:1;min-width:240px}
h2 .acoes{margin-left:8px}
@media print{.mBg{display:none!important}}
@media print{header,.nav,.filtros,.acoes,.btn{display:none!important}main{max-width:none;padding:0}section{break-inside:avoid}.painel{break-inside:avoid;border:0;padding:6px 0}body{background:#fff}}
</style>

<style id="pb-css">

  display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pb-bg);border-bottom:1px solid var(--pb-line);position:relative;flex-wrap:wrap;

@media(max-width:640px){

}
@media print{.pb{display:none!important}}
</style>

  function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function iniciais(n){var p=String(n||'').replace(/[—–-].*$/,'').trim().split(/\s+/).filter(function(w){return w.length>2||/^[A-Z0-9]+$/.test(w);});return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
  function escura(hex){var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));if(!m)return true;var n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)<150;}
  function urlOk(u){try{var x=new URL(u,location.href);return x.protocol==='https:'?x:null;}catch(e){return null;}}

  function montar(o){
    O=o||{};var raiz=typeof O.el==='string'?document.getElementById(O.el):O.el;if(!raiz)return;
    var extras=[];while(raiz.firstChild){extras.push(raiz.firstChild);raiz.removeChild(raiz.firstChild);}
    raiz.className='pb'+(O.classe?' '+O.classe:'');raiz.setAttribute('role','banner');
    var marca=h('a','pb-marca');marca.href=O.logoHref||O.central||'./';marca.title='Ir para a Central POP';
    var img=h('img','pb-logo');img.src=O.logo||'logo-pop.png';img.alt='Rede POP Pet Center';img.onerror=function(){img.style.display='none';};marca.appendChild(img);
    var tr=h('div','pb-trilha');
    (O.trilha||[]).forEach(function(t){var a=h('a','pb-pai',t.nome);a.href=t.href;tr.appendChild(a);tr.appendChild(h('span','pb-sep','/'));});
    var tit=h('span');tit.innerHTML=O.titulo||'';if(O.sub){tit.appendChild(h('small',null,O.sub));}tr.appendChild(tit);
    marca.appendChild(tr);raiz.appendChild(marca);
    raiz.appendChild(h('span','pb-esp'));
    extras.forEach(function(n){raiz.appendChild(n);});
    el.quem=h('div','pb-quem');el.quemN=h('b');el.quemS=h('span');el.quem.appendChild(el.quemN);el.quem.appendChild(el.quemS);el.quem.style.display='none';raiz.appendChild(el.quem);
    el.btn=h('button','pb-ico');el.btn.type='button';el.btn.title='Sistemas';el.btn.setAttribute('aria-label','Sistemas');el.btn.setAttribute('aria-expanded','false');el.btn.innerHTML=GRID;el.btn.style.display='none';raiz.appendChild(el.btn);
    if(O.sair){el.sair=h('button','pb-sair','Sair');el.sair.type='button';el.sair.id=O.sairId||'pbSair';el.sair.onclick=function(){O.sair();};if(O.sairOculto)el.sair.style.display='none';raiz.appendChild(el.sair);}
    el.veu=h('div','pb-veu');el.pop=h('div','pb-pop');el.pop.setAttribute('role','dialog');el.pop.setAttribute('aria-label','Sistemas');
    raiz.appendChild(el.veu);raiz.appendChild(el.pop);
    el.btn.onclick=function(){alternar();};el.veu.onclick=fechar;
    document.addEventListener('keydown',function(e){if(e.key==='Escape')fechar();});
    document.addEventListener('click',function(e){if(el.pop.classList.contains('on')&&!el.pop.contains(e.target)&&!el.btn.contains(e.target))fechar();});
    if(O.quem)quem(O.quem.nome,O.quem.sub);
    if(O.auto!==false)sessao();
  }
  function alternar(){el.pop.classList.contains('on')?fechar():abrir();}
  function abrir(){el.pop.classList.add('on');el.veu.classList.add('on');el.btn.classList.add('on');el.btn.setAttribute('aria-expanded','true');}
  function fechar(){if(!el.pop)return;el.pop.classList.remove('on');el.veu.classList.remove('on');el.btn.classList.remove('on');el.btn.setAttribute('aria-expanded','false');}
  function quem(nome,sub){if(!el.quem)return;el.quemN.textContent=nome||'';el.quemS.textContent=sub||'';el.quem.style.display=nome?'':'none';}
  function sairVisivel(v){if(el.sair)el.sair.style.display=v?'':'none';}

  /* Carrega o menu: catálogo completo para quem está em hub_acesso; senão só os atalhos do papel (O.links). */
  function sessao(){
    if(!O||!el.pop)return Promise.resolve();
    var get=O.token||tokenPadrao;
    return Promise.resolve().then(function(){return get();}).then(function(tok){
      if(!tok)return desenhar(null,null);
      return rpc('barra_sistemas',tok,{}).then(function(r){desenhar(r&&r.ok?r:null,tok);});
    }).catch(function(){desenhar(null,null);});
  }
  function desenhar(r,tok){
    el.pop.innerHTML='';carregou=true;
    var itens=r?(r.paineis||[]):[];
    var links=(O.links||[]).filter(function(l){return urlOk(l.url);});
    var paineis=itens.filter(function(p){return p.grupo==='painel';});
    var bastidor=itens.filter(function(p){return p.grupo!=='painel';});
    if(!paineis.length&&!links.length){el.btn.style.display='none';return;}
    var cab=h('div','pb-cab');cab.appendChild(h('b',null,'Sistemas'));
    cab.appendChild(h('span',null,r?'catálogo do Painel Master':'atalhos do seu perfil'));
    var x=h('button','pb-x','×');x.type='button';x.setAttribute('aria-label','Fechar');x.onclick=fechar;
    if(r){var hub=h('a',null,'Abrir Painel Master →');hub.href=HUB_URL;hub.target='_blank';hub.rel='noopener';cab.appendChild(hub);}
    cab.appendChild(x);el.pop.appendChild(cab);
    el.pop.appendChild(h('div','pb-grupo','Painéis'));
    var g=h('div','pb-grade');
    (paineis.length?paineis:links).forEach(function(p){
      var u=urlOk(p.url);if(!u)return;
      var atual=(p.chave&&p.chave===O.sistema);
      var a=h(atual?'span':'a','pb-item'+(atual?' atual':''));
      if(!atual){a.href=u.href;if(u.origin!==location.origin){a.target='_blank';a.rel='noopener';a.classList.add('ext');}
        a.onclick=function(){if(tok&&p.chave)rpc('hub_registrar',tok,{p_acao:'abriu',p_alvo:p.chave},true);fechar();};}
      var q=h('span','pb-q',iniciais(p.nome));var cor=/^#[0-9a-f]{6}$/i.test(p.cor||'')?p.cor:'#00573F';q.style.background=cor;q.style.color=escura(cor)?'#fff':'#14332A';
      var t=h('span','pb-t',p.nome);var sub=atual?'você está aqui':(p.descricao||p.sub||'');if(sub)t.appendChild(h('small',null,sub));
      if(p.aviso)a.title=p.aviso;
      a.appendChild(q);a.appendChild(t);g.appendChild(a);
    });
    el.pop.appendChild(g);
    if(bastidor.length){
      el.pop.appendChild(h('div','pb-grupo','Bastidor'));var c=h('div','pb-chips');
      bastidor.forEach(function(p){var u=urlOk(p.url);if(!u)return;var a=h('a',null,p.nome+' ↗');a.href=u.href;a.target='_blank';a.rel='noopener';if(p.aviso)a.title=p.aviso;
        a.onclick=function(){if(tok&&p.chave)rpc('hub_registrar',tok,{p_acao:'abriu',p_alvo:p.chave},true);fechar();};c.appendChild(a);});
      el.pop.appendChild(c);
    }
    if(r)el.pop.appendChild(h('div','pb-aviso','Quem vê este botão é definido em Central POP → Admin → Equipe → "Botão Sistemas". Endereços e cards: pelo Painel Master.'));
    el.btn.style.display='';
  }
  return {montar:montar,sessao:sessao,quem:quem,sairVisivel:sairVisivel,fechar:fechar,rpc:rpc,token:tokenPadrao};
})();
</script>
