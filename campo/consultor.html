 main.innerHTML=`<section class="fr-hero"><div><div class="eyebrow">${esc(store.code?'FR '+store.code:'')} ${esc(store.city?'· '+store.city+'/'+store.uf:'')}</div><h1>${esc(store.name)}</h1><p>Olá, ${esc(d.me.name)}. ${todo.length?`Você tem <b>${todo.length}</b> tarefa(s) para fazer${late?`, <b class="overdue">${late} atrasada(s)</b>`:''}.`:'Nenhuma tarefa pendente agora. 👏'}</p></div>${d.stores.length>1?`<label class="field">Loja<select id="fr-store">${d.stores.map(s=>`<option value="${s.id}" ${s.id===frStore?'selected':''}>${esc((s.code?'FR '+s.code+' · ':'')+s.name)}</option>`).join('')}</select></label>`:''}</section><div class="cards">${stat('Para fazer',todo.length,'Inclui as devolvidas para refazer','clock')}${stat('Aguardando verificação',wait.length,'Você marcou como feita','check')}${stat('Concluídas',done.length,'Verificadas pela franqueadora','home')}${stat('Atrasadas',late,'Prazo já passou','pin')}</div>${blocks.filter(b=>b.status==='approved'&&b.note).map(b=>`<p class="notice purple"><b>${esc(b.title)}:</b> ${esc(b.note)}</p>`).join('')}<section class="panel" style="margin-bottom:22px"><div class="panelhead"><h2>Para fazer</h2><span class="badge">${todo.length}</span></div>${todo.length?todo.map(frTaskCard).join(''):'<p class="hint">Tudo em dia.</p>'}</section>${wait.length?`<section class="panel" style="margin-bottom:22px"><div class="panelhead"><h2>Aguardando verificação</h2><span class="badge">${wait.length}</span></div>${wait.map(frTaskCard).join('')}</section>`:''}<details class="panel fr-fold" style="margin-bottom:22px"><summary><h2>Concluídas <span class="badge good">${done.length}</span></h2></summary>${done.length?done.map(frTaskCard).join(''):'<p class="hint">Ainda nenhuma.</p>'}</details><details class="panel fr-fold"><summary><h2>Histórico da loja <span class="badge">${hist.length}</span></h2></summary>${hist.length?`<ol class="timeline">${hist.map(h=>`<li><span class="tl-dot">${histIcon(h.action)}</span><div><strong>${esc(h.action)}</strong><p>${esc(h.detail)}</p><small>${esc(h.actor)} · ${new Date(h.created_at).toLocaleString('pt-BR')}</small></div></li>`).join('')}</ol>`:'<p class="hint">Sem registros.</p>'}</details><p class="footnote">Rede POP Pet Center · Portal do franqueado · Você vê apenas as tarefas liberadas para sua loja.</p>`;}
function frDoneModal(id){const t=frState.blocks.flatMap(b=>b.tasks).find(x=>x.id===id);modal('Concluir tarefa',`<form id="fr-done-form" data-id="${t.id}"><div class="modalbody"><h3>${esc(t.title)}</h3><p class="hint">${esc(t.detail)}</p><label class="field">O que foi feito? *<textarea name="note" required maxlength="2000" placeholder="Ex.: telhado consertado pela empresa X em 01/10"></textarea></label><label class="btn ck-photo-btn">📷 Tirar ou anexar foto do resultado<input type="file" accept="image/*" capture="environment" id="fr-photo" hidden></label>${t.severity==='grave'?'<p class="hint">Problema grave: envie ao menos uma foto do resultado.</p>':''}<div id="fr-proofs">${photoThumbs(t.proof_photos)}</div><div id="fr-error" role="alert"></div></div><div class="modalfoot"><button type="button" class="btn" data-action="dismiss">Voltar</button><button class="btn primary">Enviar para a franqueadora</button></div></form>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||MODE!=='franqueado')return;if(b.dataset.frDone)frDoneModal(b.dataset.frDone);if(b.hasAttribute('data-fr-reload'))frLoad();});
document.addEventListener('change',async e=>{if(MODE!=='franqueado')return;if(e.target.id==='fr-store'){frStore=e.target.value;frRender();}if(e.target.id==='fr-photo'&&e.target.files?.length){const f=$('#fr-done-form'),file=e.target.files[0];e.target.value='';try{toast('Enviando foto…');const image=await compressPhoto(file);await frPost({action:'fr-photo-upload',task:f.dataset.id,image});const t=frState.blocks.flatMap(b=>b.tasks).find(x=>x.id===f.dataset.id);$('#fr-proofs').innerHTML=photoThumbs(t.proof_photos);toast('Foto enviada.');}catch(error){err('#fr-error',error);}}});
document.addEventListener('submit',async e=>{if(e.target.id!=='fr-done-form')return;e.preventDefault();const f=e.target,btn=f.querySelector('button.primary');btn.disabled=true;try{const t=frState.blocks.flatMap(b=>b.tasks).find(x=>x.id===f.dataset.id);await frPost({action:'fr-task-done',task:t.id,version:t.version,note:f.note.value});$('#modal').close();frRender();toast('Enviado. A franqueadora vai verificar.');}catch(error){err('#fr-error',error);btn.disabled=false;}});
function frMain(){document.body.innerHTML=`<div id="barraPop"></div><nav class="fr-abas" aria-label="Seções"><span class="fr-aba ativa" aria-current="page">Tarefas da loja</span><a class="fr-aba" href="../raiox/">Raio-X da loja</a></nav><main id="fr-main" class="fr-main"><div class="loading">Carregando suas tarefas…</div></main><dialog id="modal"></dialog>`;montarBarra();frLoad();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#modal').open&&!offline)frLoad();});}

// ===== Dados para os painéis (ponte) · gestor lê; só admin corrige =====
// Central (franquias): gravado pela função campo-api. Cadastro de lojas do potencial (rede-pop-compras):
// o navegador do admin grava com a sessão dele no Painel IC (lojas_cadastro_salvar) e depois registra aqui o antes/depois.
let pt={fra:null,data:null,cp:null,cpErro:null,carregando:null,depois:null};
const ptStatus={aplicado:'Gravado',igual:'Já igual',conflito:'Conflito',aguardando:'Aguardando envio',ignorado:'Mantido o atual',revertido:'Revertido',erro:'Erro'};
const ptTipo={conferencia:'Conferência validada',correcao:'Correção do admin',reversao:'Reversão'};
const ptBanco={central:'Central POP',compras:'Cadastro de lojas (Painel IC)'};
function ponteAviso(p){if(!p)return '';if(p.erro)return p.erro;if(p.semFra)return 'Conferência validada. A loja não tem FRA, então nada foi enviado aos painéis.';const partes=[p.aplicados&&p.aplicados+' gravado(s) na Central',p.aguardando&&p.aguardando+' aguardando envio ao cadastro de lojas',p.conflitos&&p.conflitos+' em conflito',p.erros&&p.erros+' com erro'].filter(Boolean);return 'Conferência validada.'+(partes.length?' Dados para os painéis: '+partes.join(' · ')+'.':'');}
function ptLojaNome(fra){const r=state?.records.find(x=>x.kind==='stores'&&Number(x.data.code)===Number(fra));return r?r.data.name:'Loja';}
function ptV(v,cls=''){if(v==null||v==='')return '<span class="pt-val vazio">vazio</span>';const t=String(v);if(/^https:\/\//.test(t))return `<a class="pt-val ${cls}" href="${esc(t)}" target="_blank" rel="noopener" title="${esc(t)}">abrir link ↗</a>`;return `<span class="pt-val ${cls}">${esc(t)}</span>`;}
function ptSt(s){return `<span class="badge st-${esc(s)}">${esc(ptStatus[s]||s)}</span>`;}
function ptData(v){return v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';}
function cpNorm(chave,v){if(v==null||v==='')return null;if(chave==='delivery_proprio')return v===true||v==='true'?'SIM':v===false||v==='false'?'NÃO':String(v);return String(v);}
function ptIguais(a,b){if(a==null||b==null)return a==b;const na=Number(String(a).replace(',','.')),nb=Number(String(b).replace(',','.'));if(String(a).trim()!==''&&String(b).trim()!==''&&Number.isFinite(na)&&Number.isFinite(nb))return Math.abs(na-nb)<1e-6;return String(a).trim().toLowerCase()===String(b).trim().toLowerCase();}
async function cpCarregar(forcar){if(!cpToken()){pt.cp=null;return;}if(pt.cp&&!forcar)return;try{const l=await cpRpc('lojas_cadastro_listar');pt.cp=new Map((l||[]).map(x=>[Number(x.fra),x]));pt.cpErro=null;}catch(e){pt.cp=null;pt.cpErro=e.message;}}
function cpAtual(fra,chave){if(!pt.cp)return undefined;const x=pt.cp.get(Number(fra));return x?cpNorm(chave,x[chave]):undefined;}
function ptCat(chave){return pt.data?.ponte.catalogo.find(c=>c.chave===chave);}
function ptAtual(fra,c,L){return c.banco==='central'?(L&&L.fra===Number(fra)?L.central[c.chave]??null:undefined):cpAtual(fra,c.chave);}

function pontePage(){setTimeout(()=>ptCarregar(pt.fra),0);return heading('Dados para os painéis','O que o consultor conferiu e o gestor validou alimenta a Central (endereço, CNPJ, localização, serviços) e o cadastro de lojas do potencial e dos clusters (m², formato, equipe). Toda mudança guarda o valor anterior.')+'<div id="pt-body"><div class="loading">Carregando os dados das lojas…</div></div>';}
async function ptCarregar(fra){if(pt.carregando){pt.depois={fra};return pt.carregando;}pt.carregando=(async()=>{try{const r=await fetch('/api/data?consultant=eduardo&month='+month+'&ponte='+(fra||''),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar.');pt.data=d;pt.fra=fra||null;if(d.admin)await cpCarregar();ptDesenhar();}catch(e){const b=$('#pt-body');if(b)b.innerHTML=`<p class="notice error">${esc(e.message)}</p>`;}})();try{await pt.carregando;}finally{pt.carregando=null;}if(pt.depois){const x=pt.depois;pt.depois=null;return ptCarregar(x.fra);}}
async function ptPost(body){const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consultant:'eduardo',month,...body})}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível salvar.');pt.data={admin:pt.data.admin,...d};return d;}

function ptDesenhar(){const b=$('#pt-body');if(!b||!pt.data)return;const P=pt.data.ponte,adm=pt.data.admin,L=P.loja,temCompras=P.abertos.some(m=>ptCat(m.chave)?.banco==='compras');
 const resumo=Object.fromEntries((P.resumo||[]).map(x=>[x.status,Number(x.n)]));
 let h=`<div class="pt-resumo">${['conflito','aguardando','erro','aplicado','igual','ignorado','revertido'].filter(s=>resumo[s]).map(s=>`<span class="chip">${ptStatus[s]} <b>${resumo[s]}</b></span>`).join('')||'<span class="hint">Nenhum dado enviado ainda. Os dados saem daqui quando o gestor valida a conferência de uma loja.</span>'}</div>`;
 h+=adm?`<p class="notice purple">Você é admin: pode aplicar o valor do campo, manter o atual, corrigir e reverter. Toda ação pede motivo e entra no histórico da loja.</p>`:`<p class="notice">Somente leitura. Correções são feitas por um administrador.</p>`;
 if(adm&&!cpToken())h+=`<section class="panel" style="margin-bottom:18px"><h2>Cadastro de lojas (Painel IC)</h2><p class="sub">M², formato, estacionamento, frente, equipe, delivery, serviços, fachada e inauguração ficam no banco do Painel IC. Para enviar ou corrigir esses campos, entre com o seu login de admin de lá. A senha não fica salva; a sessão vale só enquanto esta página estiver aberta.</p><form id="cp-login" class="pt-sel"><label class="field">E-mail<input name="email" type="email" autocomplete="username" required></label><label class="field">Senha<input name="senha" type="password" autocomplete="current-password" required></label><button class="btn primary">Entrar no Painel IC</button></form><div id="cp-erro" role="alert"></div></section>`;
 else if(adm&&pt.cpErro)h+=`<p class="notice error">Cadastro de lojas: ${esc(pt.cpErro)}</p>`;
 // pendências
 h+=`<section class="panel" style="margin-bottom:18px"><h2>Pendências <span class="badge">${P.abertos.length}</span></h2>`;
 if(!P.abertos.length)h+='<p class="hint">Nada pendente.</p>';
 else h+=`<div class="tbl-wrap"><table class="pt-tab"><thead><tr><th>Loja</th><th>Dado</th><th>Valor da conferência</th><th>Valor atual</th><th>Situação</th>${adm?'<th>Ação</th>':''}</tr></thead><tbody>${P.abertos.map(m=>{const c=ptCat(m.chave)||{rotulo:m.chave,banco:'central'},at=c.banco==='compras'?cpAtual(m.fra,m.chave):m.valor_antes,semCp=c.banco==='compras'&&!cpToken();
   return `<tr><td><button class="pt-link" data-pt-loja="${esc(m.fra)}"><b>FRA ${esc(m.fra)}</b><br>${esc(ptLojaNome(m.fra))}</button></td><td>${esc(c.rotulo)}<div class="pt-dest">${esc(ptBanco[c.banco])}</div></td><td>${ptV(m.valor,'dif')}</td><td>${at===undefined?'<span class="hint">entre no Painel IC para ver</span>':ptV(at)}</td><td>${ptSt(m.status)}${m.erro?`<div class="pt-dest">${esc(m.erro)}</div>`:''}</td>${adm?`<td><div class="pt-acoes"><button class="btn small primary" data-pt-aplicar="${m.id}" ${semCp?'disabled title="Entre no Painel IC acima"':''}>Aplicar o do campo</button><button class="btn small" data-pt-ignorar="${m.id}">Manter o atual</button></div></td>`:''}</tr>`;}).join('')}</tbody></table></div>`;
 h+='</section>';
 // loja
 const lojas=(state.records||[]).filter(r=>r.kind==='stores'&&Number(r.data.code)>0).sort((a,b)=>Number(a.data.code)-Number(b.data.code));
 h+=`<section class="panel"><h2>Dados de uma loja</h2><div class="pt-sel"><label class="field">Loja<select id="pt-loja-sel"><option value="">Escolher a loja</option>${lojas.map(r=>`<option value="${esc(r.data.code)}" ${Number(r.data.code)===pt.fra?'selected':''}>FRA ${esc(r.data.code)} · ${esc(r.data.name)}</option>`).join('')}</select></label></div>`;
 if(L){const movs=L.movs||[],ultAplic={};for(const m of movs)if(m.status==='aplicado'&&!(m.chave in ultAplic))ultAplic[m.chave]=m.id;const abertoDe=ch=>P.abertos.some(m=>m.fra===L.fra&&m.chave===ch);
  h+=`<p class="sub">${L.registro?`${esc(L.registro.name||'')} · ${esc(L.registro.city||'')}${L.registro.uf?'/'+esc(L.registro.uf):''} · conferência ${esc(names[L.registro.status]||L.registro.status)}${L.registro.verifiedAt?' em '+esc(date(L.registro.verifiedAt)):''}`:'Loja sem ficha de conferência no painel.'}${L.central?.existe===false?' · <b>FRA não existe na Central</b>':''}</p>`;
  h+=`<div class="tbl-wrap"><table class="pt-tab"><thead><tr><th>Dado</th><th>Vai para</th><th>Valor atual</th><th>Conferência</th><th>Última mudança</th>${adm?'<th>Ação</th>':''}</tr></thead><tbody>${P.catalogo.map(c=>{const at=ptAtual(L.fra,c,L),cv=L.campo?.[c.chave]??null,um=movs.find(m=>m.chave===c.chave),dif=cv!=null&&at!==undefined&&!ptIguais(cv,at),semCp=c.banco==='compras'&&!cpToken();
    return `<tr><td><b>${esc(c.rotulo)}</b></td><td class="pt-dest">${esc(ptBanco[c.banco])}<br>${esc(c.painel)}</td><td>${at===undefined?'<span class="hint">entre no Painel IC para ver</span>':ptV(at)}</td><td>${ptV(cv,dif?'dif':'')}</td><td>${um?`${ptSt(um.status)}<div class="pt-dest">${esc(ptTipo[um.tipo]||um.tipo)} · ${esc(ptData(um.criado_em))}</div>`:'<span class="hint">—</span>'}</td>${adm?`<td><div class="pt-acoes"><button class="btn small" data-pt-corrigir="${esc(c.chave)}" ${semCp?'disabled title="Entre no Painel IC acima"':''}>Corrigir</button>${dif&&!abertoDe(c.chave)&&!semCp?`<button class="btn small primary" data-pt-usar="${esc(c.chave)}">Usar o da conferência</button>`:''}</div></td>`:''}</tr>`;}).join('')}</tbody></table></div>`;
  h+=`<h3 style="margin-top:22px">Histórico de mudanças desta loja</h3>${movs.length?`<div class="tbl-wrap"><table class="pt-tab"><thead><tr><th>Quando</th><th>Dado</th><th>O quê</th><th>De → para</th><th>Motivo</th><th>Quem</th>${adm?'<th></th>':''}</tr></thead><tbody>${movs.map(m=>{const c=ptCat(m.chave)||{rotulo:m.chave,banco:'central'},podeRev=adm&&m.status==='aplicado'&&String(ultAplic[m.chave])===String(m.id)&&!(c.banco==='compras'&&!cpToken());
    return `<tr><td>${esc(ptData(m.criado_em))}</td><td>${esc(c.rotulo)}</td><td>${esc(ptTipo[m.tipo]||m.tipo)}<br>${ptSt(m.status)}</td><td>${ptV(m.valor_antes)} → ${ptV(m.valor)}</td><td>${m.motivo?esc(m.motivo):'<span class="hint">—</span>'}${m.erro?`<div class="pt-dest">${esc(m.erro)}</div>`:''}</td><td class="pt-dest">${esc(m.resolvido_por||m.criado_por||'')}</td>${adm?`<td>${podeRev?`<button class="btn small danger" data-pt-reverter="${m.id}">Reverter</button>`:''}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`:'<p class="hint">Nenhuma mudança registrada para esta loja.</p>'}`;}
 else h+='<p class="hint">Escolha uma loja para ver o valor atual de cada dado, o que a conferência trouxe e o histórico.</p>';
 h+='</section>';b.innerHTML=h;}

// campo do formulário de correção conforme o tipo do dado
function ptCampoValor(c,v){const val=v??'';if(c.tipo==='opcao')return `<label class="field">Novo valor<select name="valor"><option value="">(vazio)</option>${(c.opcoes||[]).map(o=>`<option ${ptIguais(o,val)?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
 if(c.tipo==='data')return input('valor','Novo valor','date',val);if(c.tipo==='numero'||c.tipo==='inteiro')return input('valor','Novo valor','number',val,c.tipo==='inteiro'?'step="1" min="0"':'step="0.01" min="0"');
 if(c.tipo==='geo')return input('valor','Novo valor (latitude,longitude)','text',val,'placeholder="-16.686900,-49.264800" pattern="-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?"');return input('valor','Novo valor','text',val,'maxlength="500"');}
function ptModal(op,dados,titulo,corpo,precisaMotivo=true){modal(titulo,`<form id="pt-form" data-op="${op}" data-dados="${esc(JSON.stringify(dados))}"><div class="modalbody">${corpo}<label class="field">Motivo${precisaMotivo?' *':''}<textarea name="motivo" maxlength="1000" ${precisaMotivo?'required':''} placeholder="Ex.: conferido na visita de 23/09 com o franqueado"></textarea></label><div id="pt-erro" role="alert"></div></div><div class="modalfoot"><button type="button" class="btn" data-action="dismiss">Voltar</button><button class="btn primary">Confirmar</button></div></form>`);}
async function cpGravar(fra,chave,valor){await cpCarregar(true);const x=pt.cp?.get(Number(fra));if(!x)throw Error('FRA '+fra+' não localizada no cadastro de lojas.');const antes=cpNorm(chave,x[chave]);await cpRpc('lojas_cadastro_salvar',{p_fra:String(x.fra),p_campos:{[chave]:valor==null||valor===''?null:valor}});await cpCarregar(true);return antes;}
async function ptExecutar(op,d,motivo,valor){const c=ptCat(d.chave),base={fra:d.fra,chave:d.chave,motivo};
 if(op==='aplicar'){if(c.banco==='central')return ptPost({action:'ponte-aplicar',id:d.id,...base});let antes;try{antes=await cpGravar(d.fra,d.chave,d.valor);}catch(e){await ptPost({action:'ponte-aplicar',id:d.id,...base,erro:e.message});throw e;}return ptPost({action:'ponte-aplicar',id:d.id,...base,antes});}
 if(op==='ignorar')return ptPost({action:'ponte-ignorar',id:d.id,...base});
 if(op==='corrigir'){if(c.banco==='central')return ptPost({action:'ponte-corrigir',...base,valor});const antes=await cpGravar(d.fra,d.chave,valor);return ptPost({action:'ponte-corrigir',...base,valor,antes});}
 if(op==='reverter'){if(c.banco==='compras'){try{await cpGravar(d.fra,d.chave,d.valor_antes);}catch(e){return ptPost({action:'ponte-reverter',id:d.id,...base,erro:e.message});}}return ptPost({action:'ponte-reverter',id:d.id,...base});}}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!pt.data)return;const P=pt.data.ponte,L=P.loja;
 if(b.dataset.ptLoja){ptCarregar(Number(b.dataset.ptLoja));setTimeout(()=>$('#pt-loja-sel')?.scrollIntoView({behavior:'smooth',block:'start'}),300);return;}
 const mov=id=>P.abertos.find(m=>String(m.id)===String(id))||L?.movs.find(m=>String(m.id)===String(id));
 if(b.dataset.ptAplicar){const m=mov(b.dataset.ptAplicar),c=ptCat(m.chave);ptModal('aplicar',{id:m.id,fra:m.fra,chave:m.chave,valor:m.valor},'Aplicar o valor da conferência',`<p><b>FRA ${esc(m.fra)} · ${esc(c.rotulo)}</b></p><p>Vai para ${esc(ptBanco[c.banco])}: ${ptV(m.valor,'dif')}${m.status==='conflito'?` no lugar de ${ptV(m.valor_antes)}`:''}.</p>`,m.status==='conflito');return;}
 if(b.dataset.ptIgnorar){const m=mov(b.dataset.ptIgnorar),c=ptCat(m.chave);ptModal('ignorar',{id:m.id,fra:m.fra,chave:m.chave},'Manter o valor atual',`<p><b>FRA ${esc(m.fra)} · ${esc(c.rotulo)}</b></p><p>O valor da conferência (${ptV(m.valor)}) não será gravado. Fica registrado que o atual foi mantido.</p>`);return;}

function guide(){return heading('Seu papel na Rede POP','Escopo de atuação do Eduardo · Prestação de serviços PJ · Avaliação inicial de 90 dias')+`<section class="guidehero"><div><div class="eyebrow" style="color:#FDAE25">Presença na loja. Evolução da operação.</div><h2>Acompanhar as lojas e transformar oportunidades em ações.</h2><p>Identificar oportunidades, orientar a operação, desenvolver compras diretas saudáveis e apoiar eventos que aumentem o faturamento.</p>${btn('Registrar uma visita '+icon('arrow'),'new-visit',false)}</div><div class="guidebig"><div><strong>4</strong><span>visitas por dia de campo</span></div><div><strong>24h</strong><span>para completar o registro</span></div><div><strong>7 dias</strong><span>para revisar o plano*</span></div><div><strong>90 dias</strong><span>de avaliação inicial</span></div></div></section><div class="grid equal"><section class="panel"><h2>Como organizar o trabalho</h2>${[['01','Primeiras duas semanas','Levantar quatro lojas diferentes por dia. Em dez dias de campo, a referência é de 40 lojas. Entregar ficha, fontes e pendências com prazo. Consolidar o diagnóstico ao final da segunda semana.'],['02','A partir da terceira semana','Consultar OnePet, BI e SULTS. Observar atendimento, exposição, preços, rupturas, vencimentos, canais digitais e uso dos sistemas. Definir uma melhoria e até três ações com responsável, prazo e evidência.'],['03','Acompanhar e comprovar','Revisar os planos em até sete dias ou na data pactuada. Documentar retornos e escalar impedimentos. Encaminhar problemas técnicos ao suporte e comunicar riscos críticos no mesmo dia.']].map(([n,t,d])=>`<div class="step"><span class="stepnum">${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}<p class="hint">*Ou na data pactuada. As duas primeiras semanas contam a partir do início da atuação, mesmo que atravessem dois meses.</p></section><section class="panel"><h2>Entregas e prazos</h2>${[['Dia anterior','Confirmar quatro lojas próximas e consultar dados e pendências.'],['Manhã e tarde','Duas visitas pela manhã e duas à tarde. A mesma loja no mesmo dia conta uma única vez.'],['Até 24 horas','Registrar atendimento, diagnóstico, orientação, próximos passos e evidências. Na fase inicial, preencher a ficha de levantamento.'],['Toda sexta-feira','Resumo das visitas, pendências, oportunidades e agenda seguinte.'],['Até 2 dias úteis após o evento','Entregar execução, faturamento, comparação e evidências.'],['Até o 3º dia útil do mês seguinte','Entregar relatório mensal e números consolidados.']].map(([t,d])=>`<div class="listrow"><div><strong style="font-size:14px">${t}</strong><p>${d}</p></div></div>`).join('')}</section></div><section class="panel" style="margin-bottom:22px"><h2>O que levantar nas lojas</h2><div class="grid equal" style="margin:0"><div><ul class="plainlist"><li>Identificação, área total e responsável da unidade.</li><li>Equipe por função, quantidade, salário bruto e benefícios por pessoa. Sem nomes pessoais; separar remunerações diferentes.</li><li>Aluguel, água, luz, IPTU mensal (anual ÷ 12) e internet, com competência e fonte.</li></ul></div><div><ul class="plainlist"><li>Estrutura e atividade do banho e tosa e do consultório. Registrar os motivos de inatividade.</li><li>Dados ausentes permanecem pendentes. Zero apenas quando confirmado.</li><li>A soma dos cinco custos não é o custo total da operação. Equipe e demais despesas ficam separadas.</li></ul></div></div></section><section class="panel"><h2>Remuneração mensal</h2><p class="sub">R$ 3.000 de honorários + R$ 1.000 de ajuda de custo + até R$ 3.000 de variável + até R$ 600 de bônus.</p><div class="bands">${[['Abaixo de 70 pontos','R$ 0'],['70 a menos de 80','R$ 1.500'],['80 a menos de 90','R$ 2.250'],['90 a 100 pontos','R$ 3.000']].map(([t,v])=>`<div class="band">${t}<strong>${v}</strong></div>`).join('')}</div><div class="grid equal"><div><h3>Compras e eventos</h3><p class="sub">Compras exigem fornecedor homologado, giro, estoque e capacidade financeira compatíveis e autorização do franqueado. Só contam valores líquidos confirmados, faturados e pagos, com participação comprovada do Eduardo, sem duplicidade, cancelamento, devolução ou inadimplência.</p><p class="sub" style="margin-top:14px">Cada dia de evento precisa faturar pelo menos o dobro da média de quatro dias anteriores equivalentes, com plano aprovado e relatório no prazo. Bases inválidas exigem alternativa validada antes do evento.</p></div><div><h3>Regras da apuração</h3><p class="sub">Meta comercial proporcional aos dias após o levantamento. Sem meta exigível, 25 pontos são divididos entre Visitas e Qualidade e não há bônus. Sem eventos, 15 pontos são divididos entre essas duas métricas; sem retornos previstos, 5 pontos vão para Qualidade.</p><p class="sub" style="margin-top:14px">Satisfação tem meta 4,5; abaixo de 4,0 zera somente esse item. Sem respostas, a apuração fica pendente. Com 100 pontos, bônus proporcional ao excedente comercial, limitado a 20% da variável alvo.</p></div></div><p class="notice">A liberação exige nota fiscal, relatório mensal, evidências regulares e pelo menos 90% dos registros completos em até 24h. Honorários e ajuda de custo são fixos. Períodos parciais devem ser pactuados antes do início.</p><p class="hint">O consultor não opera caixa, movimenta valores, concede condições não autorizadas nem assume compromissos em nome da Rede POP. Avaliações nos marcos de 30, 60 e 90 dias. Referência: proposta R00 e painel de ganhos fornecidos.</p></section>`;}
function listView(){const review=tab==='review',proposal=tab==='proposals',k=proposal?'proposals':kind;let rows=state.records.filter(r=>review?r.status==='submitted':r.kind===k);if(filter)rows=rows.filter(r=>r.status===filter);if(search)rows=rows.filter(r=>(label(r)+' '+storeName(r.data.store)+' '+(r.data.code||'')).toLowerCase().includes(search.toLowerCase()));
 const title=review?'Validações pendentes':proposal?'Proposições':'Registros de campo';
 const subtitle=review?'Confira as evidências e devolva o que precisar de ajustes.':proposal?'Oportunidades de melhoria, compras diretas e eventos, do envio à aprovação.':'Visitas, diagnóstico das lojas e resultados documentados em um só lugar.';
 return heading(title,subtitle,review?'':btn(icon('plus')+' '+(proposal?'Nova proposição':'Adicionar registro'),'new',true))+(!review&&!proposal?`<div class="tabs" aria-label="Tipos de registro">${Object.entries(kinds).filter(([id])=>id!=='proposals').map(([id,x])=>`<button data-kind="${id}" class="${id===kind?'active':''}">${x.label}</button>`).join('')}</div>`:'')+`<section class="panel"><div class="toolbar"><h2 style="margin:0">${review?'Fila de conferência':kinds[k].label} <span class="badge">${rows.length}</span></h2><div class="filters"><input type="search" id="search" class="search" placeholder="Buscar por loja ou título" aria-label="Buscar registros" value="${esc(search)}">${review?'':`<select id="filter" aria-label="Filtrar por situação"><option value="">Todas as situações</option>${Object.entries(names).map(([id,n])=>`<option value="${id}" ${filter===id?'selected':''}>${n}</option>`).join('')}</select>`}</div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>${review?'Registro':'Loja / registro'}</th><th>${review?'Tipo':'Informações'}</th><th>Situação</th><th>Última atualização</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(label(r))}</strong><small>${r.kind==='stores'?'FR '+esc(r.data.code):esc(storeName(r.data.store))}</small></td><td>${review?kinds[r.kind].label:recordInfo(r)}</td><td>${status(r)}</td><td>${date(r.updated_at)}</td><td><button class="btn small" data-detail="${r.id}">Abrir ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`:empty(review?'Nenhuma validação pendente':search||filter?'Nenhum registro encontrado':'Nenhum registro nesta categoria',review?'Os envios do Eduardo aparecerão aqui para conferência.':search||filter?'Ajuste a busca ou o filtro.':'Adicione o primeiro registro. Ele será enviado para análise do gestor.',!review&&!search&&!filter?btn('Adicionar '+kinds[k].singular,'new',true):'')}</section>`;
}
function recordInfo(r){const d=r.data;if(r.kind==='orders')return money(d.amount);if(r.kind==='proposals')return esc(d.type)+'<small>Prazo: '+date(d.deadline)+'</small>';if(r.kind==='events'){const e=eventResult(d);return e.excluded?'Cancelamento documentado':e.pending?'Apuração pendente':e.hit?'Meta atingida':'Meta não atingida';}if(r.kind==='surveys')return d.rating+' / 5';if(r.kind==='visits')return date(d.date)+'<small>'+esc(d.phase)+'</small>';if(r.kind==='team')return d.quantity+' pessoa(s)<small>'+money(d.salary!=null&&d.benefits!=null?d.quantity*(d.salary+d.benefits):null)+'/mês, sem encargos</small>';if(r.kind==='stores')return storeInfo(r);return 'Retorno: '+date(d.deadline);}
function earnings(){const c=state.closing?.snapshot.calculation||state.calculation;return heading(MANAGER?'Apuração e pagamento':'Meus ganhos','Competência '+new Date(month+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+' · Eduardo',btn('Imprimir apuração','print'))+`<div class="cards">${stat('Pontuação',c.score.toFixed(2).replace('.',',')+' <small>/ 100</small>','Arredondada para duas casas','home')}${stat('Registros em 24h',(c.quality*100).toFixed(1).replace('.',',')+'%','Mínimo de 90% para liberar a variável','clock')}${stat('Satisfação',c.rating==null?'Pendente':c.rating.toFixed(2).replace('.',',')+' <small>/ 5</small>',c.responses+' resposta(s) validada(s)','check')}${stat('Bônus estimado',money(c.bonus),'100 pontos + superação comercial','money')}</div><div class="grid"><section class="panel"><div class="panelhead"><h2>Memória de cálculo</h2><span class="badge">${state.closing?'Fechado':'Provisório'}</span></div>${metrics(c)}<div class="listrow"><span>Compras elegíveis / meta proporcional</span><strong style="font-size:14px">${money(c.sales)} / ${money(c.commercial)}</strong></div><div class="listrow"><span>Eventos com meta / atribuídos</span><strong>${c.eventHits} / ${c.events}</strong></div><div class="listrow"><span>Retornos no prazo / previstos</span><strong>${c.returned} / ${c.actions}</strong></div><p class="hint">Faixas da variável: menos de 70 = 0%; de 70 a menos de 80 = 50%; de 80 a menos de 90 = 75%; de 90 a 100 = 100%. Bônus: variável alvo × excedente comercial, limitado a 20%.</p></section>${amountCard(c)}</div><section class="panel"><div class="panelhead"><h2>${state.closing?'Histórico do fechamento':'Condições para o fechamento'}</h2><span class="badge ${c.eligible?'good':'warn'}">${state.closing?.paid_at?'Pagamento registrado':state.closing?'Fechado':c.eligible?'Pronto para fechar':'Pendente'}</span></div>${state.closing?`<p>Fechado em ${date(state.closing.created_at)}. Total: <b>${money(c.total)}</b>.</p>${state.closing.paid_at?`<p>Pagamento registrado em ${date(state.closing.paid_at)}.<br>Comprovante: ${esc(state.closing.payment_ref)}</p>`:'<p class="sub">Aguardando o registro do pagamento realizado.</p>'}`:c.pending.length?`<ul class="plainlist">${c.pending.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>Todas as condições estão atendidas para o gestor fechar a competência.</p>'}${MANAGER?`<div class="actions" style="margin-top:24px">${!state.closing?btn('Fechar competência','close-month',true,c.eligible?'':'disabled'):!state.closing.paid_at?btn('Registrar pagamento','payment',true)+btn('Reabrir competência','reopen'):''}${btn('Exportar registros do mês','export')}</div>`:''}<p class="hint" style="margin-top:18px">Registrar pagamento guarda a data e o comprovante. Não realiza transferência de valores. O fechamento preserva a memória de cálculo e bloqueia alterações na competência.</p></section>`;}
const input=(key,label,type='number',value='',attrs='')=>`<label class="field">${label}<input name="${key}" type="${type}" value="${esc(value??'')}" ${attrs}></label>`;
function settings(){const c=state.config;return heading('Metas e acesso','Defina as condições do mês antes da vigência e confirme as comprovações no fechamento.')+`<div class="grid"><section class="panel"><h2>Condições de ${month.split('-').reverse().join('/')}</h2><form id="config-form"><div class="formgrid">${input('fixed','Honorários fixos (R$)','number',c.fixed,'min="0" step="0.01" required')}${input('allowance','Ajuda de custo (R$)','number',c.allowance,'min="0" step="0.01" required')}${input('target','Variável alvo (R$)','number',c.target,'min="0" step="0.01" required')}${input('days','Dias de campo acordados','number',c.days,'min="1" max="31" step="1" required')}${input('surveyDays','Dias de levantamento no mês','number',c.surveyDays,'min="0" max="31" step="1" required')}${input('commercial','Meta comercial mensal única (R$)','number',c.commercial,'min="0" step="0.01"')}<p class="hint wide" style="grid-column:1/-1">Meta de visitas: 4 × dias de campo. Meta comercial efetiva: meta mensal × (dias de campo − levantamento) ÷ dias de campo. Não utilizar as vendas totais da rede.</p><h3 class="sectiontitle">Comprovações do fechamento</h3>${[['nf','Nota fiscal entregue'],['report','Relatório mensal entregue'],['regular','Conduta e evidências regulares']].map(([k,l])=>`<label class="field check wide"><input type="checkbox" name="${k}" ${c[k]?'checked':''}>${l}</label>`).join('')}${input('nfEvidence','Referência da nota fiscal','text',c.nfEvidence)}${input('reportEvidence','Referência do relatório mensal','text',c.reportEvidence)}</div><div id="config-error" role="alert"></div><button class="btn primary" style="margin-top:24px" ${state.closing?'disabled':''}>Salvar condições do mês</button></form></section><div><section class="panel" style="margin-bottom:22px"><h2>Acessos</h2><p class="sub">Gestores validam, fecham e pagam. O consultor registra a operação e consulta os ganhos.</p>${(state.members||[]).map(m=>`<div class="listrow"><div><strong>${esc(m.name)}</strong><p>${esc(m.email)} · ${m.origem==='central-admin'?'Admin':m.role==='manager'?'Gestor':m.role==='franchisee'?'Franqueado':'Consultor'}${m.linked?'':' · aguardando primeiro acesso'}</p>${m.role==='franchisee'?`<p class="hint">${String(m.stores||'').split(',').filter(Boolean).map(id=>esc(storeLabel(id))).join(' · ')||'Sem loja'}</p>`:''}</div>${m.id===state.me.id?'<span class="badge">Você</span>':m.origem==='central-admin'?'<span class="badge" title="Admin é definido na Central POP → Admin → Equipe">Central</span>':m.origem==='raiox'?'<span class="badge" title="O login e as lojas do franqueado são definidos no Raio-X → Franqueados">Raio-X</span>':`<button class="btn small danger" data-revoke="${esc(m.id)}">Remover</button>`}</div>`).join('')}<form id="invite-form" style="margin-top:20px"><div class="formgrid">${input('email','E-mail de acesso','email','','required')}${input('name','Nome','text','','required maxlength="120"')}<label class="field">Perfil<select name="role"><option value="consultant">Consultor de campo</option>${state.me.admin?'<option value="manager">Gestor (valida, sem corrigir dados)</option>':''}</select></label>${state.me.admin?input('password','Senha inicial (só se o e-mail ainda não entra na Central)','password','','minlength="8" autocomplete="new-password"'):''}</div><div id="invite-error" role="alert"></div><button class="btn primary" style="margin-top:20px">Autorizar acesso</button></form><p class="hint" style="margin-top:16px">O login é o mesmo da Central POP. Se o e-mail já entra na Central, basta autorizar aqui. Se ainda não entra, informe uma senha inicial e passe para a pessoa por um canal seguro. Admins vêm da Central (Admin → Equipe) e franqueados vêm do Raio-X (aba Franqueados): aqui aparecem só para consulta.</p></section><section class="panel"><h2>Limites de cada perfil</h2><div class="listrow"><div><strong>Eduardo</strong><p>Registra a operação, envia proposições e consulta seus ganhos.</p></div></div><div class="listrow"><div><strong>Gestor</strong><p>Pactua metas, valida evidências, devolve ajustes, fecha a competência e registra pagamentos.</p></div></div><div class="listrow"><div><strong>Admin</strong><p>Tudo o que o gestor faz e mais: corrige os dados que vão para os painéis, resolve conflitos e reverte correções (sempre com motivo).</p></div></div><div class="listrow"><div><strong>Franqueado</strong><p>Vê e conclui só as tarefas liberadas para a loja dele.</p></div></div><p class="hint" style="margin-top:18px">Alterações, validações e fechamentos ficam registrados no histórico da base.</p></section></div></div>`;}
function render(){if(!state)return;updateBell();$('.nav').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});let html=tab==='home'?(MANAGER?attentionBlock():`<section class="panel flow-welcome"><div><span class="eyebrow">Próximo passo · Eduardo</span><h2>Comece pelo checklist da loja</h2><p>Estrutura primeiro, com fotos e nível de cada problema. Depois cadastro, custos e equipe.</p></div><button class="btn primary" data-tab="stores">Iniciar ou retomar conferência →</button></section>`)+home():tab==='service'?guide():tab==='earnings'?earnings():tab==='settings'?settings():tab==='stores'?storesPage():tab==='panorama'?panoramaPage():tab==='blocks'?blocksPage():tab==='ponte'?pontePage():tab==='acessofr'?acessoFrPage():listView();$('#main').innerHTML=(offline?`<div class="notice purple">Os rascunhos da conferência ficam neste navegador. Para compartilhar com o gestor e concluir registros, <a href="${ORIGIN}/${MODE}.html" target="_blank" rel="noopener"><b>abra o painel online</b></a>.</div>`:'')+(state.closing&&tab!=='earnings'?`<div class="notice purple">Esta competência está fechada. Os valores e registros da apuração foram preservados.</div>`:'')+html+`<p class="footnote">Rede POP Pet Center · ${offline?'Apresentação local':'Dados compartilhados entre consultor e gestor'} · Competência ${month.split('-').reverse().join('/')}</p>`;}
function modal(title,body,footer=''){$('#modal').classList.remove('store-dialog');$('#modal').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="close" data-action="dismiss" aria-label="Fechar janela">×</button></div>${body}${footer}`;if(!$('#modal').open)$('#modal').showModal();}
function field(f,d){const v=d[f.key];if(f.type==='checkbox')return `<label class="field check wide"><input type="checkbox" name="${f.key}" ${v?'checked':''}>${esc(f.label)}</label>`;const attr=`name="${f.key}" ${f.required?'required':''}`;let el;if(f.type==='textarea')el=`<textarea ${attr}>${esc(v)}</textarea>`;else if(f.type==='select'||f.type==='store'){const options=f.type==='store'?state.records.filter(r=>r.kind==='stores').map(r=>[r.id,r.data.code+' · '+r.data.name]):f.options.map(o=>[o,o]);el=`<select ${attr}><option value="">Selecionar</option>${options.map(([id,l])=>`<option value="${esc(id)}" ${v===id?'selected':''}>${esc(l)}</option>`).join('')}</select>`;}else el=`<input ${attr} type="${f.type}" value="${esc(v??'')}" ${f.type==='number'?`min="${f.min??0}" max="${f.max??1e10}" step="${f.integer?1:.01}"`:''}>`;return `<label class="field ${f.type==='textarea'?'wide':''}">${esc(f.label)}${f.required?' *':''}${el}</label>`;}
function newRecord(k,record=null){if(k==='stores'){storeEditor(record);return;}if(k==='surveys'&&state.me.role!=='manager'){modal('Satisfação dos franqueados','<div class="modalbody"><p>As respostas de satisfação são lançadas pelo gestor a partir da pesquisa feita com o franqueado. Assim a nota não depende de quem é avaliado.</p></div>');return;}if(state.closing){toast('A competência está fechada.');return;}const d=record?.data||{},stores=state.records.filter(r=>r.kind==='stores');if(k!=='stores'&&!stores.length){modal('Nenhuma loja na base',`<div class="modalbody"><p>O registro precisa estar vinculado a uma unidade da rede.</p>${state.me.admin?btn('Cadastrar loja','new-store',true):'<p class="hint">Só o administrador cadastra loja nova.</p>'}</div>`);return;}
 const hint=k==='stores'?'Deixe valores desconhecidos em branco. Zero somente quando confirmado. Os cinco custos não incluem equipe e demais despesas.':k==='visits'?'Horário de Brasília. Uma visita por loja e dia. O prazo de 24 horas considera o momento do envio completo; correções de conteúdo reiniciam essa comprovação.':k==='events'?'Informe as quatro datas comparáveis e as evidências. A base alternativa só vale com validação anterior ao evento. O gestor deve validar a apuração.':k==='proposals'?'A aprovação desta proposição não substitui a autorização do franqueado para pedidos de compra.':k==='weekly'?'Entrega de toda sexta-feira: resumo das visitas, pendências, oportunidades comerciais e agenda da semana seguinte.':k==='team'?'Uma linha por loja e função. Sem nomes pessoais. Se os salários forem diferentes na mesma função, use linhas separadas.':'Registre informações comprováveis. Campos com * são obrigatórios.';
 modal((record?'Editar ':'Adicionar ')+kinds[k].singular,`<form id="record-form" data-kind="${k}" data-id="${record?.id||''}" data-version="${record?.version||''}"><div class="modalbody"><p class="notice purple">${hint}</p><div class="formgrid">${kinds[k].fields.map(f=>field(f,d)).join('')}</div><div id="form-error" role="alert"></div></div><div class="modalfoot"><button type="button" class="btn" data-action="dismiss">Cancelar</button><button class="btn primary">Salvar e enviar para análise</button></div></form>`);}
function detail(id){const r=state.records.find(x=>x.id===id);if(!r)return;if(r.kind==='stores'){storeDetail(r);return;}const d=r.data;let detail=kinds[r.kind].fields.map(f=>`<div><dt>${esc(f.label)}</dt><dd>${f.type==='store'?esc(storeName(d[f.key])):f.type==='checkbox'?(d[f.key]?'Sim':'Não'):f.type==='number'?(d[f.key]==null?'Não informado':d[f.key].toLocaleString('pt-BR')):esc(d[f.key]||'Não informado')}</dd></div>`).join('');if(r.kind==='events'){const e=eventResult(d);detail+=`<div><dt>Média de referência</dt><dd>${money(e.average)}</dd></div><div><dt>Meta (dobro da média)</dt><dd>${money(e.target)}</dd></div><div><dt>Resultado</dt><dd>${recordInfo(r)}</dd></div>`;}
 const canReview=MANAGER&&state.me.role==='manager'&&!state.closing;
 modal(esc(label(r)),`<div class="modalbody"><div style="margin-bottom:22px">${status(r)} <span class="hint">${kinds[r.kind].label} · ${date(r.created_at)}</span></div>${r.note?`<p class="notice">${esc(r.note)}</p>`:''}<dl class="detailgrid">${detail}</dl>${canReview?`<label class="field" style="margin-top:24px">Parecer / ajustes solicitados<textarea id="review-note" placeholder="Descreva a decisão ou o ajuste necessário">${esc(r.note)}</textarea></label><div id="detail-error" role="alert"></div>`:''}</div>`,`<div class="modalfoot">${!state.closing&&(canReview||r.status!=='approved')?`<button class="btn" data-edit="${r.id}">Editar</button>`:''}${canReview?`<button class="btn danger" data-review="${r.id}" data-status="rejected">Solicitar ajuste</button><button class="btn primary" data-review="${r.id}" data-status="approved">Validar registro</button>`:''}<button class="btn" data-action="print">Imprimir</button></div>`);}
function err(selector,e){$(selector).innerHTML=`<p class="notice error" style="margin:18px 0 0">${esc(e.message)}</p>`;}
function simpleForm(title,fields,action,copy=''){modal(title,`<form id="simple-form" data-action="${action}"><div class="modalbody">${copy?`<p>${copy}</p>`:''}<div class="formgrid">${fields}</div><div id="simple-error" role="alert"></div></div><div class="modalfoot"><button type="button" class="btn" data-action="dismiss">Cancelar</button><button class="btn primary">Confirmar</button></div></form>`);}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;filter='';search='';render();$('.sidebar').classList.remove('open');return;}if(b.dataset.kind){kind=b.dataset.kind;if(kind==='stores')tab='stores';filter='';search='';render();return;}if(b.dataset.detail){detail(b.dataset.detail);return;}if(b.dataset.edit){newRecord(state.records.find(r=>r.id===b.dataset.edit).kind,state.records.find(r=>r.id===b.dataset.edit));return;}
 if(b.dataset.review){if(busy)return;busy=true;b.disabled=true;try{const r=state.records.find(x=>x.id===b.dataset.review);const rv=await mutate({action:'review',id:r.id,version:r.version,status:b.dataset.status,note:$('#review-note').value});$('#modal').close();toast(ponteAviso(rv.ponte)||'Registro atualizado nos dois painéis.');}catch(e){err('#detail-error',e);}finally{busy=false;b.disabled=false;}return;}
 if(b.dataset.revoke){if(busy)return;const m=(state.members||[]).find(x=>x.id===b.dataset.revoke);if(!m||!window.confirm('Remover o acesso de '+m.email+'?'))return;busy=true;try{await mutate({action:'revoke',memberId:m.id});toast('Acesso removido.');}catch(e){toast(e.message);}finally{busy=false;}return;}
 const a=b.dataset.action;if(!a)return;if(a==='menu'){$('.sidebar').classList.toggle('open');return;}if(a==='dismiss'){if(flowSession){await flowExit();return;}$('#modal').close();return;}if(a==='refresh'){load();return;}if(a==='print'){window.print();return;}if(a.startsWith('go-')){tab=a.slice(3);filter='';search='';render();return;}if(a==='new-proposal'){newRecord('proposals');return;}if(a==='new-visit'){newRecord('visits');return;}if(a==='new-store'){newRecord('stores');return;}if(a==='new'){newRecord(tab==='stores'?'stores':tab==='proposals'?'proposals':kind);return;}
 if(a==='close-month'){simpleForm('Fechar competência','', 'close','Confirmar o fechamento de '+month.split('-').reverse().join('/')+' no total de '+money(state.calculation.total)+'? Os registros serão bloqueados e a memória de cálculo ficará preservada.');return;}
 if(a==='payment'){simpleForm('Registrar pagamento',input('date','Data do pagamento','date','','required')+input('reference','Comprovante / referência','text','','required'),'payment','Registre somente um pagamento já realizado.');return;}
 if(a==='reopen'){simpleForm('Reabrir competência',input('reason','Motivo da reabertura','text','','required'),'reopen','O fechamento atual será preservado no histórico de auditoria.');return;}
 if(a==='export'){const blob=new Blob([JSON.stringify({competencia:month,consultor:'Eduardo',configuracao:state.config,registros:state.records,apuracao:state.calculation,fechamento:state.closing},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='POP-Eduardo-'+month+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
});
document.addEventListener('change',e=>{if(e.target.id==='month'){if(!e.target.value)return;month=e.target.value;load();}if(e.target.id==='filter'){filter=e.target.value;render();}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search'){clearTimeout(searchTimer);const pos=e.target.selectionStart;search=e.target.value;searchTimer=setTimeout(()=>{render();$('#search').focus();$('#search').setSelectionRange(pos,pos);},300);}});
document.addEventListener('submit',async e=>{if(!['record-form','config-form','invite-form','simple-form'].includes(e.target.id))return;e.preventDefault();if(busy)return;busy=true;const form=e.target,submit=form.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;const fd=new FormData(form),values=Object.fromEntries(fd.entries());try{
 if(form.id==='record-form'){const k=form.dataset.kind;for(const f of kinds[k].fields)if(f.type==='checkbox')values[f.key]=fd.has(f.key);await mutate({action:'save',kind:k,id:form.dataset.id||null,version:Number(form.dataset.version),data:values});$('#modal').close();toast('Registro enviado. O gestor já pode conferir.');}
 if(form.id==='config-form'){for(const k of ['nf','report','regular'])values[k]=fd.has(k);if(values.commercial==='')values.commercial=null;await mutate({action:'config',version:state.configVersion,config:values});toast('Condições do mês salvas.');}
 if(form.id==='invite-form'){await mutate({action:'invite',email:values.email,name:values.name,role:values.role,password:values.password||''});form.reset();toast(values.password?'Login criado e acesso autorizado.':'Acesso autorizado.');}
 if(form.id==='simple-form'){await mutate({action:form.dataset.action,...values});$('#modal').close();toast('Atualização registrada.');}
 }catch(e){err(form.id==='record-form'?'#form-error':form.id==='config-form'?'#config-error':form.id==='invite-form'?'#invite-error':'#simple-error',e);}finally{busy=false;if(submit)submit.disabled=false;}});
if(MODE==='franqueado')frMain();else{shell();load();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&!$('#modal').open&&tab!=='settings'&&!offline)load(true);});setInterval(()=>{if(!document.hidden&&state&&!$('#modal').open&&tab!=='settings'&&!offline&&!busy)load(true);},30000);}
</script></body></html>
