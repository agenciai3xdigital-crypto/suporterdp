<!-- ===== BARRA POP v1.0.1 · 21/09/2026 · cabeçalho único dos painéis da Rede POP =====
     Colado igual em: Central (index.html), raiox/index.html, raiox/dash.html, raiox/score.html,

<style id="pb-css">
.pb{--pb-bg:#fff;--pb-ink:#14332A;--pb-muted:#5A7268;--pb-line:#D3DFD8;--pb-soft:#EEF3F0;--pb-lar:#FF6B15;--pb-lar-soft:#FFEDE1;--pb-verde:#009150;--pb-verm:#C0392B;
  display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pb-bg);border-bottom:1px solid var(--pb-line);position:relative;flex-wrap:wrap;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:var(--pb-ink);line-height:1.3;box-sizing:border-box}
.pb *{box-sizing:border-box}

.pb-trilha a.pb-pai{color:var(--pb-muted);font-weight:600;font-size:14px;text-decoration:none;font-family:'Inter',system-ui,sans-serif;letter-spacing:0;white-space:nowrap}
.pb-trilha a.pb-pai:hover{color:var(--pb-lar)}
.pb-sep{color:var(--pb-line);font-weight:400}
.pb-trilha em{font-style:normal;color:var(--pb-lar)}
.pb-trilha small{display:block;font-family:'Inter',system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--pb-muted);letter-spacing:0;margin-top:2px}
.pb-esp{flex:1 1 8px}
.pb-quem{font-size:12.5px;color:var(--pb-muted);text-align:right;line-height:1.25;max-width:220px}
.pb-quem b{display:block;color:var(--pb-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-ico{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--pb-line);background:var(--pb-bg);display:grid;place-items:center;color:var(--pb-ink);cursor:pointer;position:relative;flex:none;padding:0;font:inherit}

.pb-ico.on{background:var(--pb-lar-soft)}
.pb-ico:focus-visible,.pb-sair:focus-visible,.pb-item:focus-visible{outline:2px solid var(--pb-lar);outline-offset:2px}
.pb-bd{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;line-height:17px;padding:0 4px;border-radius:9px;background:var(--pb-verm);color:#fff;font-size:10.5px;font-weight:700;text-align:center}
.pb-sair{border:1.5px solid var(--pb-line);background:var(--pb-bg);color:var(--pb-ink);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;line-height:1.3}
.pb-sair:hover{border-color:var(--pb-muted)}
.pb-relogio{font-family:'Archivo','Inter',system-ui,sans-serif;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.pb-relogio .sync{display:block;font-family:'Inter',system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--pb-verde);margin-top:2px}
.pb-veu{display:none;position:fixed;inset:0;background:rgba(20,51,42,.35);z-index:180}
.pb-veu.on{display:block}
.pb-pop{display:none;position:absolute;right:16px;top:calc(100% - 4px);width:min(560px,calc(100vw - 32px));background:var(--pb-bg);border:1px solid var(--pb-line);border-radius:14px;box-shadow:0 10px 30px rgba(20,51,42,.16);padding:14px;z-index:190;color:var(--pb-ink)}
.pb-pop.on{display:block}
.pb-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.pb-cab b{font-family:'Archivo','Inter',system-ui,sans-serif;font-weight:850;font-size:15px}
.pb-cab span{font-size:12px;color:var(--pb-muted)}
.pb-cab a{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--pb-verde);text-decoration:none;white-space:nowrap}
.pb-cab a:hover{text-decoration:underline}
.pb-x{display:none;margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--pb-muted);cursor:pointer;padding:0 4px}
.pb-grupo{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--pb-muted);margin:10px 0 6px}
.pb-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.pb-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;text-decoration:none;color:var(--pb-ink);border:1px solid transparent;min-width:0}
.pb-item:hover{background:var(--pb-soft)}
.pb-item.atual{background:var(--pb-lar-soft);cursor:default}
.pb-q{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:'Archivo','Inter',system-ui,sans-serif;font-weight:900;font-size:11px;flex:none;letter-spacing:.02em}
.pb-t{font-size:13px;font-weight:600;line-height:1.15;min-width:0}
.pb-t small{display:block;font-weight:500;font-size:11px;color:var(--pb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-item.ext .pb-t::after{content:" ↗";color:var(--pb-muted);font-weight:400}
.pb-chips{display:flex;flex-wrap:wrap;gap:6px}
.pb-chips a{font-size:12px;font-weight:600;color:var(--pb-muted);text-decoration:none;border:1px solid var(--pb-line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pb-chips a:hover{color:var(--pb-ink);border-color:var(--pb-muted)}
.pb-aviso{font-size:11.5px;color:var(--pb-muted);margin-top:10px;border-top:1px solid var(--pb-line);padding-top:8px}
@media(max-width:640px){
  .pb{padding:8px 12px;gap:8px;flex-wrap:nowrap}.pb-logo{height:32px}
  .pb-marca{flex:1 1 0;min-width:0}.pb-trilha{font-size:16px;flex-wrap:nowrap;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pb-trilha a.pb-pai,.pb-sep,.pb-trilha small{display:none} /* no celular o logo já leva à Central */
  .pb-esp{display:none}.pb-sair{padding:7px 10px}
  .pb-quem,.pb-relogio{display:none}
  .pb-pop{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:18px 18px 0 0;max-height:80vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .pb-x{display:block}.pb-cab a{margin-left:0;flex-basis:100%}
  .pb-grade{grid-template-columns:1fr 1fr}
}
@media print{.pb{display:none!important}}
</style>
<script id="pb-js">
/* BarraPop — API: BarraPop.montar(opts) → depois BarraPop.sessao() quando houver login, BarraPop.quem(nome,sub), BarraPop.sairVisivel(bool). */
window.BarraPop=(function(){
  'use strict';
  var SB_URL='https://klcxavgxonpsbsbzqcil.supabase.co';
  var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsY3hhdmd4b25wc2JzYnpxY2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MzQwMDAsImV4cCI6MjA5OTExMDAwMH0.UJK09SljKG0tJqDcGYQfuk41i1SN8GymL1hTTeE2ruY';
  var HUB_URL='https://agenciai3xdigital-crypto.github.io/painel-master-pop/';
  var GRID='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>';
  var O=null, el={}, carregou=false;

  function jwtPayload(t){try{var p=t.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return null;}}
  function doProjeto(t){var p=jwtPayload(t);return !!(p&&p.role==='authenticated'&&(String(p.iss||'').indexOf('klcxavgxonpsbsbzqcil')>=0||p.ref==='klcxavgxonpsbsbzqcil'));} /* v1.0.1: token de login traz o projeto em iss, não em ref */
  /* Token padrão: procura no localStorage qualquer sessão válida deste projeto (supabase-js ou fetch manual), só leitura. */
  function tokenPadrao(){
    var melhor=null;
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i), v;
        try{v=JSON.parse(localStorage.getItem(k));}catch(e){continue;}
        var c=v&&(typeof v.access_token==='string'?v:(v.currentSession||v.session));
        if(!c||typeof c.access_token!=='string'||!doProjeto(c.access_token))continue;
        var exp=Number(c.expires_at)||(jwtPayload(c.access_token)||{}).exp||0;
        if(exp*1000<Date.now()+15000)continue;
        if(!melhor||exp>melhor.exp)melhor={t:c.access_token,exp:exp};
      }
    }catch(e){}
    return Promise.resolve(melhor?melhor.t:null);
  }
  function rpc(nome,token,corpo,keep){
    return fetch(SB_URL+'/rest/v1/rpc/'+nome,{method:'POST',keepalive:!!keep,
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(corpo||{})}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }
  function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function iniciais(n){var p=String(n||'').replace(/[—–-].*$/,'').trim().split(/\s+/).filter(function(w){return w.length>2||/^[A-Z0-9]+$/.test(w);});return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
  function escura(hex){var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));if(!m)return true;var n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)<150;}
  function urlOk(u){try{var x=new URL(u,location.href);return x.protocol==='https:'?x:null;}catch(e){return null;}}

  function montar(o){
    O=o||{};var raiz=typeof O.el==='string'?document.getElementById(O.el):O.el;if(!raiz)return;
    var extras=[];while(raiz.firstChild){extras.push(raiz.firstChild);raiz.removeChild(raiz.firstChild);}
    raiz.className='pb'+(O.classe?' '+O.classe:'');raiz.setAttribute('role','banner');
    var marca=h('a','pb-marca');marca.href=O.logoHref||O.central||'./';marca.title='Ir para a Central POP';
    var img=h('img','pb-logo');img.src=O.logo||'logo-pop.png';img.alt='Rede POP Pet Center';img.onerror=function(){img.style.display='none';};marca.appendChild(img);
    var tr=h('div','pb-trilha');
    (O.trilha||[]).forEach(function(t){var a=h('a','pb-pai',t.nome);a.href=t.href;tr.appendChild(a);tr.appendChild(h('span','pb-sep','/'));});
    var tit=h('span');tit.innerHTML=O.titulo||'';if(O.sub){tit.appendChild(h('small',null,O.sub));}tr.appendChild(tit);
    marca.appendChild(tr);raiz.appendChild(marca);
    raiz.appendChild(h('span','pb-esp'));
    extras.forEach(function(n){raiz.appendChild(n);});
    el.quem=h('div','pb-quem');el.quemN=h('b');el.quemS=h('span');el.quem.appendChild(el.quemN);el.quem.appendChild(el.quemS);el.quem.style.display='none';raiz.appendChild(el.quem);
    el.btn=h('button','pb-ico');el.btn.type='button';el.btn.title='Sistemas';el.btn.setAttribute('aria-label','Sistemas');el.btn.setAttribute('aria-expanded','false');el.btn.innerHTML=GRID;el.btn.style.display='none';raiz.appendChild(el.btn);
    if(O.sair){el.sair=h('button','pb-sair','Sair');el.sair.type='button';el.sair.id=O.sairId||'pbSair';el.sair.onclick=function(){O.sair();};if(O.sairOculto)el.sair.style.display='none';raiz.appendChild(el.sair);}
    el.veu=h('div','pb-veu');el.pop=h('div','pb-pop');el.pop.setAttribute('role','dialog');el.pop.setAttribute('aria-label','Sistemas');
    raiz.appendChild(el.veu);raiz.appendChild(el.pop);
    el.btn.onclick=function(){alternar();};el.veu.onclick=fechar;
    document.addEventListener('keydown',function(e){if(e.key==='Escape')fechar();});
    document.addEventListener('click',function(e){if(el.pop.classList.contains('on')&&!el.pop.contains(e.target)&&!el.btn.contains(e.target))fechar();});
    if(O.quem)quem(O.quem.nome,O.quem.sub);
    if(O.auto!==false)sessao();
  }
  function alternar(){el.pop.classList.contains('on')?fechar():abrir();}
  function abrir(){el.pop.classList.add('on');el.veu.classList.add('on');el.btn.classList.add('on');el.btn.setAttribute('aria-expanded','true');}
  function fechar(){if(!el.pop)return;el.pop.classList.remove('on');el.veu.classList.remove('on');el.btn.classList.remove('on');el.btn.setAttribute('aria-expanded','false');}
  function quem(nome,sub){if(!el.quem)return;el.quemN.textContent=nome||'';el.quemS.textContent=sub||'';el.quem.style.display=nome?'':'none';}
  function sairVisivel(v){if(el.sair)el.sair.style.display=v?'':'none';}

  /* Carrega o menu: catálogo completo para quem está em hub_acesso; senão só os atalhos do papel (O.links). */
  function sessao(){
    if(!O||!el.pop)return Promise.resolve();
    var get=O.token||tokenPadrao;
    return Promise.resolve().then(function(){return get();}).then(function(tok){
      if(!tok)return desenhar(null,null);
      return rpc('barra_sistemas',tok,{}).then(function(r){desenhar(r&&r.ok?r:null,tok);});
    }).catch(function(){desenhar(null,null);});
  }
  function desenhar(r,tok){
    el.pop.innerHTML='';carregou=true;
    var itens=r?(r.paineis||[]):[];
    var links=(O.links||[]).filter(function(l){return urlOk(l.url);});
    var paineis=itens.filter(function(p){return p.grupo==='painel';});
    var bastidor=itens.filter(function(p){return p.grupo!=='painel';});
    if(!paineis.length&&!links.length){el.btn.style.display='none';return;}
    var cab=h('div','pb-cab');cab.appendChild(h('b',null,'Sistemas'));
    cab.appendChild(h('span',null,r?'catálogo do Painel Master':'atalhos do seu perfil'));
    var x=h('button','pb-x','×');x.type='button';x.setAttribute('aria-label','Fechar');x.onclick=fechar;
    if(r){var hub=h('a',null,'Abrir Painel Master →');hub.href=HUB_URL;hub.target='_blank';hub.rel='noopener';cab.appendChild(hub);}
    cab.appendChild(x);el.pop.appendChild(cab);
    el.pop.appendChild(h('div','pb-grupo','Painéis'));
    var g=h('div','pb-grade');
    (paineis.length?paineis:links).forEach(function(p){
      var u=urlOk(p.url);if(!u)return;
      var atual=(p.chave&&p.chave===O.sistema);
      var a=h(atual?'span':'a','pb-item'+(atual?' atual':''));
      if(!atual){a.href=u.href;if(u.origin!==location.origin){a.target='_blank';a.rel='noopener';a.classList.add('ext');}
        a.onclick=function(){if(tok&&p.chave)rpc('hub_registrar',tok,{p_acao:'abriu',p_alvo:p.chave},true);fechar();};}
      var q=h('span','pb-q',iniciais(p.nome));var cor=/^#[0-9a-f]{6}$/i.test(p.cor||'')?p.cor:'#00573F';q.style.background=cor;q.style.color=escura(cor)?'#fff':'#14332A';
      var t=h('span','pb-t',p.nome);var sub=atual?'você está aqui':(p.descricao||p.sub||'');if(sub)t.appendChild(h('small',null,sub));
      if(p.aviso)a.title=p.aviso;
      a.appendChild(q);a.appendChild(t);g.appendChild(a);
    });
    el.pop.appendChild(g);
    if(bastidor.length){
      el.pop.appendChild(h('div','pb-grupo','Bastidor'));var c=h('div','pb-chips');
      bastidor.forEach(function(p){var u=urlOk(p.url);if(!u)return;var a=h('a',null,p.nome+' ↗');a.href=u.href;a.target='_blank';a.rel='noopener';if(p.aviso)a.title=p.aviso;
        a.onclick=function(){if(tok&&p.chave)rpc('hub_registrar',tok,{p_acao:'abriu',p_alvo:p.chave},true);fechar();};c.appendChild(a);});
      el.pop.appendChild(c);
    }
    if(r)el.pop.appendChild(h('div','pb-aviso','Quem vê este botão é definido em Central POP → Admin → Equipe → "Botão Sistemas". Endereços e cards: pelo Painel Master.'));
    el.btn.style.display='';
  }
  return {montar:montar,sessao:sessao,quem:quem,sairVisivel:sairVisivel,fechar:fechar,rpc:rpc,token:tokenPadrao};
})();
</script>

/* checklist de conferência */
.ck-progress{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin:14px 0}
.ck-progress .progress{margin:0}
.ck-list{display:grid;gap:12px}
.ck-item{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.ck-item[data-status=problem]{border-color:var(--pop-laranja-suave);background:var(--pop-laranja-suave)}
.ck-item[data-status=ok]{border-color:var(--pop-verde-claro)}
.ck-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.ck-head h4{margin:0 0 4px;font-size:15px}.ck-head .hint{margin:0}
.ck-status,.ck-sev{display:flex;gap:6px;flex-wrap:wrap}
.ck-opt{position:relative;cursor:pointer}
.ck-opt input{position:absolute;opacity:0;pointer-events:none}
.ck-opt span{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;white-space:nowrap}
.ck-opt input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
.ck-opt-ok input:checked+span{background:var(--pop-verde);border-color:var(--pop-verde);color:#fff}
.ck-opt-problem input:checked+span{background:var(--orange);border-color:var(--orange);color:#fff}
.ck-opt-na input:checked+span{background:var(--pop-tinta-2);border-color:var(--pop-tinta-2);color:#fff}
.ck-sev{margin:14px 0 10px}
.ck-sev .sev-leve input:checked+span{background:var(--pop-amarelo);border-color:var(--pop-amarelo);color:var(--pop-tinta)}
.ck-sev .sev-medio input:checked+span{background:var(--orange);border-color:var(--orange);color:#fff}
.ck-sev .sev-grave input:checked+span{background:var(--pop-verm);border-color:var(--pop-verm);color:#fff}
.ck-item:not([data-status=problem]) .ck-problem,.ck-item:not([data-status=na]) .ck-na{display:none}
.ck-na{margin-top:12px}
.ck-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.ck-row .field{flex:1;min-width:160px}
.ck-photo-btn{cursor:pointer;background:#fff}
.ck-photo-btn.disabled{opacity:.5;pointer-events:none}
.ck-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

function guardar(s){const exp=s.expires_at||Math.floor(Date.now()/1000)+(Number(s.expires_in)||3600);const v={access_token:s.access_token,refresh_token:s.refresh_token,token_type:'bearer',expires_in:s.expires_in||3600,expires_at:exp,user:s.user||null};lsSet(SB_KEY,JSON.stringify(v));return {...v,exp};}

  return renovando;}

function eventResult(d){
 if(d.outcome==='Cancelamento externo') return {excluded:!!d.cancelReason,pending:!d.cancelReason,hit:false};
 if(d.outcome==='Não realizado') return {pending:false,hit:false,average:null};
 let valid=!!d.comparable, dates=[];
 for(let i=0;i<4;i++){const dt=d['baseDate'+i];dates.push(dt);if(!dt||dt>=d.date||new Date(dt+'T12:00:00Z').getUTCDay()!==new Date(d.date+'T12:00:00Z').getUTCDay()||d['base'+i]==null) valid=false;}
 valid=valid&&new Set(dates).size===4;
 let average=valid?[0,1,2,3].reduce((s,i)=>s+d['base'+i],0)/4:null;
 if(!(average>0)&&d.alternative>0&&d.alternativeEvidence&&d.alternativeDate&&d.alternativeDate<d.date)average=d.alternative;
 const pending=!(average>0)||d.revenue==null||d.outcome==='Atribuído'||!d.evidence;
 return {pending,hit:!pending&&d.revenue>=average*2&&d.plan&&d.onTime,average,target:average==null?null:average*2,growth:average>0&&d.revenue!=null?d.revenue/average-1:null};
}
function calculate(config,records){

 const timely=visits.filter(r=>r.qualified_at&&new Date(r.qualified_at).getTime()-new Date(r.data.date+'-03:00').getTime()<=86400000&&new Date(r.qualified_at)>=new Date(r.data.date+'-03:00')).length;
 const actions=by('actions'), returned=actions.filter(r=>r.data.returned&&r.data.returned<=r.data.deadline&&r.data.evidence&&r.data.result).length;
 const responses=by('surveys'), rating=responses.length?responses.reduce((s,r)=>s+r.data.rating,0)/responses.length:null;
 const sales=by('orders').filter(r=>r.data.paid&&r.data.participation&&r.data.authorized&&!r.data.excluded).reduce((s,r)=>s+r.data.amount,0);
 const events=by('events').map(r=>eventResult(r.data)).filter(e=>!e.excluded);
 const commercial=c.commercial==null&&c.surveyDays!==c.days?null:c.days>0?(c.commercial||0)*(c.days-c.surveyDays)/c.days:null;
 const noSales=commercial===0, noEvents=!events.length,noActions=!actions.length;
 const quality=visits.length?timely/visits.length:0;
 const weights=[20+(noEvents?7.5:0)+(noSales?12.5:0),20+(noEvents?7.5:0)+(noSales?12.5:0)+(noActions?5:0),15,noSales?0:25,noEvents?0:15,noActions?0:5];
 const ratios=[c.days>0?Math.min(1,visits.length/(4*c.days)):0,quality,rating==null||rating<4?0:Math.min(1,rating/4.5),commercial>0?Math.min(1,sales/commercial):0,events.length?events.filter(e=>e.hit).length/events.length:0,actions.length?returned/actions.length:0];
 const metrics=['Visitas','Qualidade dos registros','Satisfação','Compras diretas','Eventos','Acompanhamento'].map((name,i)=>({name,weight:weights[i],ratio:ratios[i],points:weights[i]*ratios[i]}));
 const score=Math.round(metrics.reduce((s,m)=>s+m.points,0)*100)/100;
 const variable=score<70?0:c.target*(score<80?.5:score<90?.75:1);
 const bonus=score===100&&commercial>0?Math.round(c.target*Math.min(.2,Math.max(0,sales/commercial-1))*100)/100:0;
 const pending=[];
 if(!c.agreed)pending.push('Metas do mês ainda não foram pactuadas pelo gestor.');
 if(!c.days||c.surveyDays>c.days||commercial==null||(c.surveyDays<c.days&&!(c.commercial>0)))pending.push('Definir dias de campo e meta comercial válida.');
 if(!responses.length)pending.push('Concluir a coleta de satisfação.');
 const awaiting=records.filter(r=>!['proposals','stores','team'].includes(r.kind)&&r.status!=='approved');
 const weekly=approved.filter(r=>r.kind==='weekly').length;
 if(awaiting.length)pending.push(awaiting.length+' registro(s) aguardando validação.');
 if(events.some(e=>e.pending))pending.push('Completar a apuração dos eventos.');
 if(quality<.9)pending.push('Pelo menos 90% dos registros devem estar completos em até 24 horas.');
 if(!c.nf||!c.nfEvidence)pending.push('Comprovar a entrega da nota fiscal.');

 return {metrics,score,variable,bonus,fixed:c.fixed,allowance:c.allowance,potential:c.fixed+c.allowance+variable+bonus,total:c.fixed+c.allowance+(eligible?variable+bonus:0),eligible,pending,visits:visits.length,visitTarget:4*c.days,timely,quality,rating,responses:responses.length,sales,commercial,events:events.length,eventHits:events.filter(e=>e.hit).length,actions:actions.length,returned,weekly};

function validateData(kind,raw){

  if(f.type==='checkbox')v=v===true;
  else if(f.type==='number'){v=v===''||v==null?null:Number(v);if(v!=null&&(!Number.isFinite(v)||v<(f.min??0)||v>(f.max??1e10)||(f.integer&&!Number.isInteger(v))))throw Error('Valor inválido: '+f.label);}

  if(f.required&&(v===''||v==null))throw Error('Preencha: '+f.label);d[f.key]=v;
 }
 if(kind==='visits'&&d.phase==='Consultoria'&&(!d.orientation||!d.nextSteps))throw Error('Registre a orientação e os próximos passos da consultoria.');
 if(kind==='visits'&&new Date(d.date+'-03:00').getTime()>Date.now())throw Error('A visita não pode estar no futuro.');
 if(kind==='actions'&&d.returned&&d.returned>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}))throw Error('O retorno realizado não pode estar no futuro.');
 if(kind==='actions'&&d.returned&&(!d.result||!d.evidence))throw Error('Informe o resultado e a evidência do retorno.');
 if(kind==='weekly'&&new Date(d.date+'T12:00:00Z').getUTCDay()!==5)throw Error('O resumo semanal deve ser datado na sexta-feira da semana.');
 if(kind==='events'&&d.outcome==='Cancelamento externo'&&!d.cancelReason)throw Error('Informe a justificativa do cancelamento externo.');
 return d;
}

d(x=>x.store===r.id).step||0)+1} de 8</small>`:''}<small>${d.verifiedAt?'Conferido em '+date(d.verifiedAt):'Dados da base a confirmar'}</small></td><td>${(()=>{const sm=inspectionSummary(storeView(r).d);return sm.answered?sevPills(sm.counts,true)+`<small>${sm.answered}/${sm.total} itens</small>`:'<small>Não iniciado</small>';})()}</td><td class="service-cell">${esc(serviceText(d,'bath'))}</td><td class="service-cell">${esc(serviceText(d,'clinic'))}</td><td><button class="btn small" data-store-open="${r.id}">${(state.drafts||[]).some(x=>x.store===r.id)?'Retomar conferência':r.status==='submitted'||r.status==='approved'?'Abrir':'Iniciar conferência'}</button><button class="btn small" data-store-summary="${r.id}">Resumo</button><button class="btn small" data-store-history="${r.id}">Histórico</button></td></tr>`;}).join('')}</tbody></table></div>`:empty('Nenhuma loja encontrada','Ajuste os filtros ou cadastre uma unidade.')}</section>`;}
function applicableField(f,d){if(f.key==='bathReason')return d.bathExists==='Sim'&&d.bathActive==='Não';if(f.key==='clinicReason')return d.clinicExists==='Sim'&&d.clinicActive==='Não';if(f.key==='whatsappNumber')return d.whatsappAvailable!=='Não';return true;}
function storeField(f,d){const v=d[f.key]||'',c=d.checks?.[f.key]||{},initial=d.source?.values?.[f.key];let control;if(f.options)control=`<select name="${f.key}"><option value="">Selecionar</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(f.type==='textarea')control=`<textarea name="${f.key}">${esc(v)}</textarea>`;else control=`<input type="${f.type}" name="${f.key}" value="${esc(v)}" ${f.key==='name'?'required':''}>`;
 return `<div class="verify-field" data-verify-field="${f.key}" ${applicableField(f,d)?'':'hidden'}><label class="field"><span>${esc(f.label)}${f.essential?' *':''}</span>${control}</label>${initial!==undefined?`<div class="source-value">Base de 09/09: ${esc(initial||'Não informado')}</div>`:''}<div class="verify-controls"><label class="field"><span class="hint">Conferência</span><select name="check_${f.key}" aria-label="Conferência de ${esc(f.label)}">${Object.entries(checkLabels).map(([k,v])=>`<option value="${k}" ${(c.state||'pending')===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span class="hint">Observação / justificativa</span><input name="note_${f.key}" value="${esc(c.note||'')}" placeholder="Obrigatória para Não se aplica"></label></div></div>`;
}

 modal(esc(d.name),`<div class="modalbody"><p>${status(r)} ${d.verifiedAt?`<span class="hint">Conferido por ${esc(d.verifiedBy)} em ${date(d.verifiedAt)}</span>`:''}</p>${r.note?`<p class="notice">${esc(r.note)}</p>`:''}<div class="grid equal"><section class="panel"><h3>Banho e tosa</h3><p>${esc(serviceText(d,'bath'))}</p></section><section class="panel"><h3>Consultório</h3><p>${esc(serviceText(d,'clinic'))}</p></section></div>${issues.length?`<p class="notice">${issues.length} pendência(s) de conferência. A validação será permitida após o consultor concluir os dados.</p>`:''}<dl class="detailgrid">${storeFields.filter(f=>!f.reference&&applicableField(f,d)).map(f=>`<div><dt>${esc(f.label)} <span class="badge">${esc(checkLabels[d.checks?.[f.key]?.state]||'Pendente')}</span></dt><dd>${esc(d[f.key]||'Não informado')}${d.checks?.[f.key]?.note?`<p class="hint">${esc(d.checks[f.key].note)}</p>`:''}</dd></div>`).join('')}<div><dt>Área e custos</dt><dd>${d.area?esc(d.area)+' m²':'Área não informada'}<br>${costKeys.map(([k,l])=>l+': '+(d[k]==null||d[k]===''?'—':money(Number(d[k])))).join(' · ')}<br><span class="hint">${esc(d.costsSource||'Origem não informada')}${d.costsMonth?' · competência '+esc(d.costsMonth):''}</span></dd></div><div><dt>Checklist</dt><dd>${sevPills(inspectionSummary(d).counts)}</dd></div><div><dt>Fonte da conferência</dt><dd>${esc(d.evidence||'Pendente')}</dd></div><div><dt>Pendências / prazo</dt><dd>${esc(d.reason||'—')}<br>${date(d.returnDate)}</dd></div></dl>${source?`<details class="verification-group"><summary>Cadastro original e rastreabilidade</summary><div class="group-inner"><p class="hint">${esc(source.file)} · ${esc(source.sheet)} · linha ${source.row}. Valores preservados como recebidos.</p><dl class="detailgrid">${Object.entries(source.raw).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v??'Não informado')}</dd></div>`).join('')}</dl>${source.duplicateMaps?.length?`<p class="notice">Há uma segunda ficha do Google para esta unidade, sem dupli document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.storeOpen){const r=state.records.find(x=>x.id===b.dataset.storeOpen);if(['draft','rejected'].includes(r.status)||(state.drafts||[]).some(d=>d.store===r.id))storeEditor(r);else storeDetail(r);}if(b.dataset.storeEdit)storeEditor(state.records.find(x=>x.id===b.dataset.storeEdit));});

const flowSteps=[
 {title:'Estrutura física',checklist:'estrutura',hint:'Comece pela estrutura: de fora para dentro. Fotografe cada problema e marque o nível.',keys:[]},
 {title:'Operação e exposição',checklist:'operacao',hint:'Com a loja funcionando: limpeza, exposição, preços, validade, atendimento e sistemas.',keys:[]},
 {title:'Identificação',hint:'Confirme o FR, o nome, o CNPJ e quem responde pela unidade. Os dados do Google ficam abaixo, só para consulta.',keys:['code','name','cnpj','storeStatus','facade','contact'],reference:true},
 {title:'Contatos',hint:'Teste os contatos e confirme qual número recebe mensagens no WhatsApp.',keys:['phone','mobile','whatsappAvailable','whatsappNumber','email','website']},
 {title:'Localização',hint:'Confira o endereço usado para atendimento e entrega.',keys:['city','uf','address','neighborhood','cep']},
 {title:'Serviços',hint:'Confira a estrutura, o funcionamento e o motivo de cada serviço inativo.',keys:['bathExists','bathActive','bathReason','clinicExists','clinicActive','clinicReason']},
 {title:'Área, custos e equipe',kind:'levantamento',hint:'Levantamento obrigatório da proposta: área, cinco custos, competência, origem dos valores e equipe por função.',keys:[]},
 {title:'Revisão e envio',kind:'review',hint:'Revise as pendências. Conclua somente quando as informações aplicáveis estiverem confirmadas.',keys:[]}
];
function automaticDemands(data,{started=false,completed=false}={}){
 if(!started&&!completed)return [];const list=[];const add=(rule,title,detail,priority='normal')=>list.push({rule,title,detail,priority,due:data.returnDate||null});
 if(started&&!completed)add('conference','Concluir a conferência da unidade','Retome a última etapa salva, confirme os dados pendentes e envie a ficha ao gestor.');
 if(!data.cnpj)add('cnpj','Solicitar o CNPJ da unidade','Peça o cartão CNPJ ao responsável e confirme o número na etapa Identificação.','alta');
 if(data.whatsappAvailable==='Sim'&&!data.whatsappNumber)add('whatsapp','Confirmar o número do WhatsApp','Teste o atendimento e registre o número com DDD na etapa Contatos.','alta');
 for(const [key,label] of [['bath','banho e tosa'],['clinic','consultório']])if(data[key+'Exists']==='Sim'&&data[key+'Active']==='Não')add(key+'-inactive','Acompanhar reativação do '+label,data[key+'Reason']?'Motivo informado: '+data[key+'Reason']+'. Combine o responsável e o prazo para regularização.':'Apure o motivo da inatividade e combine uma ação com o responsável.','alta');
 for(const [key,c] of Object.entries(data.checks||{}))if(c.state==='unavailable')add('field:'+key,'Confirmar informação pendente: '+(storeFields.find(f=>f.key===key)?.label||key),c.note||'Entre em contato com o responsável, registre a resposta e confirme este campo.');
 for(const [key,title] of [['phoneMismatch','Corrigir a divergência de telefone no Google'],['addressMismatch','Corrigir a divergência de endereço no Google'],['staleMap','Solicitar atualização da ficha do Google']])if(/^(sim|diverge)$/i.test(data[key]||''))add(key,title,'Apontado no levantamento de 09/09/2026. Verifique a informação correta com a unidade e acompanhe a atualização da ficha.');
 // problemas médios e graves do checklist viram demanda com prazo; leves ficam só no resumo
 for(const it of checklistItems){const r=data.inspection?.items?.[it.key];if(!r||r.status!=='problem'||!['grave','medio'].includes(r.severity)||!applicableItem(it,data))continue;add('check:'+it.key,(r.severity==='grave'?'Problema grave · ':'Problema médio · ')+it.label,(r.note||'Sem descrição.')+(r.photos?.length?' · '+r.photos.length+' foto(s)':' · sem foto')+'. Quando resolver, marque o item como Conforme no checklist com foto do resultado.',r.severity==='grave'?'alta':'normal');const last=list[list.length-1];if(r.due)last.due=r.due;}
 return list;
}

let flowSession=null,flowTimer,flowSerial=Promise.resolve();
function flowKey(id){return 'pop-flow-v1:'+ (offline?'local':state.me.user_id||state.me.id)+':'+id;}
function readFlowCache(id){try{return JSON.parse(localStorage.getItem(flowKey(id))||'null');}catch{return null;}}
function cacheFlow(s){try{localStorage.setItem(flowKey(s.id),JSON.stringify({data:s.data,step:s.step,baseVersion:s.baseVersion,draftVersion:s.draftVersion,dirty:s.dirty,updatedAt:new Date().toISOString()}));s.cacheFailed=false;}catch{s.cacheFailed=true;}}
function flowStatus(){if(!flowSession||!$('#flow-save'))return;const s=flowSession;$('#flow-save').textContent=s.saving?'Salvando…':s.error?s.error:offline?'Rascunho salvo neste navegador':s.dirty?'Alterações aguardando salvamento…':'✓ Salvo automaticamente'+(s.savedAt?' às '+new Date(s.savedAt).toLocaleTimeString('pt-BR'): '');$('#flow-save').classList.toggle('save-error',!!s.error);}
async function flowRequest(payload){const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consultant:'eduardo',month,...payload})});const d=await r.json();if(!r.ok){const err=Error(d.error||'Não foi possível salvar.');err.status=r.status;throw err;}return d;}
function captureFlow(){const s=flowSession,f=$('#flow-form');if(!s||!f)return;const fd=new FormData(f);s.data.checks||={};for(const [k,v]of fd){if(k.startsWith('ins__')){const [,key,field]=k.split('__');s.data.inspection||={items:{}};s.data.inspection.items||={};const it=(s.data.inspection.items[key]||={status:'',severity:'',note:'',due:'',photos:[]});if(field==='nanote'){if(it.status==='na')it.note=v;}else it[field]=v;continue;}if(k.startsWith('check_')){const key=k.slice(6);s.data.checks[key]={...s.data.checks[key],state:v};}else if(k.startsWith('note_')){const key=k.slice(5);s.data.checks[key]={...s.data.checks[key],note:v};}else s.data[k]=v;}s.dirty=true;s.revision++;cacheFlow(s);flowStatus();}
function queueFlowSave(){clearTimeout(flowTimer);flowTimer=setTimeout(()=>saveFlow(),800);}
function saveFlow(){const s=flowSession;if(!s)return Promise.resolve(true);flowSerial=flowSerial.catch(()=>false).then(async()=>{if(!s.dirty||s.conflict)return !s.dirty;const revision=s.revision;s.saving=true;flowStatus();if(offline){cacheFlow(s);s.dirty=s.cacheFailed;s.saving=false;s.error=s.cacheFailed?'Não foi possível salvar neste navegador. Mantenha esta janela aberta.':'';flowStatus();return !s.cacheFailed;}try{const d=await flowRequest({action:'store-draft',id:s.id,baseVersion:s.baseVersion,draftVersion:s.draftVersion,step:s.step,data:structuredClone(s.data)});s.draftVersion=d.draft.version;s.savedAt=d.draft.updated_at;s.dirty=s.revision!==revision;s.error='';state.drafts=d.drafts;state.tasks=d.tasks;cacheFlow(s);updateBell();return !s.dirty;}catch(e){s.conflict=e.status===409;s.error=s.conflict?'Conflito: outra sessão alterou os dados. Seu rascunho local foi preservado.':s.cacheFailed?'Falha ao salvar. Mantenha a janela aberta e tente novamente.':'Sem sincronização: rascunho preservado neste navegador. Tente novamente.';return false;}finally{s.saving=false;flowStatus();if(s===flowSession&&s.dirty&&!s.error)queueFlowSave();}});return flowSerial;}
async function storeEditor(record=null){if(!record&&!state?.me?.admin){toast('Só o administrador cadastra loja nova. Escolha a loja na base e inicie a conferência.');return;}if(flowSession)await flowExit();if(flowSession)return;if(!record){modal('Cadastrar unidade',`<form id="new-store-flow"><div class="modalbody"><label class="field">Nome da unidade<input name="name" required></label><label class="field">Código FR<input name="code"></label><p>Depois de criar, siga a conferência guiada.</p><div id="new-store-error"></div></div><div class="modalfoot"><button class="btn primary">Criar e iniciar</button></div></form>`);return;}
 const draft=(state.drafts||[]).find(x=>x.store===record.id),local=readFlowCache(record.id);let data=structuredClone(draft?.data||normalizedStore(record.data)),step=draft?.step||0,dirty=!draft,conflict=false;const baseVersion=draft?.base_version||record.version,draftVersion=draft?.version||0;
 if(local&&(offline||local.dirty)){data=local.data;step=local.step;dirty=true;conflict=!offline&&(local.baseVersion!==baseVersion||local.draftVersion!==draftVersion);}
 flowSession={id:record.id,record,data:{...data,source:record.data.source},step,baseVersion,draftVersion,dirty,revision:1,conflict,error:conflict?'Há uma versão mais recente. Seu rascunho local está preservado.':baseVersion!==record.version?'O cadastro foi atualizado. Compare as versões antes de continuar.':''};if(baseVersion!==record.version)flowSession.conflict=true;cacheFlow(flowSession);drawFlow();if(!flowSession.conflict)saveFlow();}
function flowIssues(){const list=verificationIssues(flowSession.data,{teamRows:state.records.filter(r=>r.kind==='team'&&r.data.store===flowSession.id).length});try{validateStore(flowSession.data,flowSession.record.data,false);}catch(e){if(!list.includes(e.message))list.push(e.message);}return list;}
function drawFlow(){const s=flowSession,step=flowSteps[s.step],d=s.data;const issues=flowIssues();let body='';if(step.checklist)body=checklistStep(step.checklist,d);else if(step.kind==='levantamento')body=levantamentoStep(d,s);else if(step.kind==='review')body=`${reviewSummary(d)}<div class="notice ${issues.length?'':'purple'}">${issues.length?issues.length+' itens ainda precisam de atenção. Toque em um item para voltar à etapa.':'Tudo conferido. Envie a ficha para validação do gestor.'}</div><div class="flow-issues">${issues.map((x,i)=>`<button type="button" class="issue-link" data-flow-issue="${i}">${esc(x)} →</button>`).join('')}</div><p class="hint">As demandas abertas continuam acompanhadas no sininho e no histórico da loja, mesmo depois do envio.</p>`;else body=`<p class="hint">Para cada dado: confira o valor e selecione Confirmado, Corrigido ou justifique Não se aplica. Se não conseguir confirmar, sinalize a pendência.</p><div class="verification-grid">${step.keys.map(k=>storeFields.find(f=>f.key===k)).filter(Boolean).map(f=>storeField(f,d)).join('')}</div>${step.reference?referenceBlocks(d):''}`;
 modal('Conferência · '+esc(s.record.data.name),`<div class="flow-summary"><span>Eduardo · Etapa ${s.step+1} de ${flowSteps.length}</span><span id="flow-save" role="status" aria-live="polite"></span></div><nav class="flow-steps" aria-label="Etapas da conferência">${flowSteps.map((x,i)=>`<button type="button" data-flow-step="${i}" class="${i===s.step?'active':''}" ${i===s.step?'aria-current="step"':''}>${i+1}. ${esc(x.title)}</button>`).join('')}</nav><form id="flow-form" novalidate><div class="modalbody"><h3>${esc(step.title)}</h3><p>${esc(step.hint)}</p>${s.record.note?`<p class="notice">Solicitação do gestor: ${esc(s.record.note)}</p>`:''}${s.conflict?'<p class="notice">O envio está bloqueado para não sobrescrever outra conferência. Baixe seu rascunho e compare com os dados atuais.</p><button type="button" class="btn" data-flow-export>Baixar meu rascunho</button><button type="button" class="btn" data-flow-current>Comparar com a versão atual</button>':''}${body}<div id="flow-error" role="alert"></div></div><div class="modalfoot store-footer"><button type="button" class="btn" data-flow-pause>Pausar e voltar às lojas</button><button type="button" class="btn" data-flow-retry>Tentar salvar agora</button>${s.step?'<button type="button" class="btn" data-flow-step="'+(s.step-1)+'">← Voltar</button>':''}${s.step<flowSteps.length-1?'<button type="button" class="btn primary" data-flow-step="'+(s.step+1)+'">Próxima etapa →</button>':'<button type="submit" class="btn primary" '+(issues.length||s.conflict||offline?'disabled':'')+'>Concluir e enviar ao gestor</button>'}</div></form>`);$('#modal').classList.add('store-dialog');flowStatus();}
function flowConditions(){const s=flowSession,form=$('#flow-form');if(!s||!form)return;for(const f of storeFields){const row=form.querySelector(`[data-verify-field="${f.key}"]`);if(row)row.hidden=!applicableField(f,s.data);}for(const key of ['bath','clinic'])if(s.data[key+'Exists']==='Não'){s.data[key+'Active']='Não se aplica';s.data.checks[key+'Active']={state:'not_applicable',note:'A loja não possui esta estrutura.'};if(form.elements[key+'Active']){form.elements[key+'Active'].value='Não se aplica';form.elements['check_'+key+'Active'].value='not_applicable';form.elements['note_'+key+'Active'].value='A loja não possui esta estrutura.';}}else if(s.data[key+'Active']==='Não se aplica'&&form.elements[key+'Active']){form.elements[key+'Active'].value='';form.elements['check_'+key+'Active'].value='pending';s.data[key+'Active']='';s.data.checks[key+'Active']={state:'pending',note:''};}cacheFlow(s);}
async function flowExit(){if(!flowSession)return;captureFlow();await saveFlow();const s=flowSession;if(s.cacheFailed&&s.dirty){toast('Ainda não foi possível salvar. Tente novamente antes de fechar.');return;}clearTimeout(flowTimer);flowSession=null;$('#modal').close();render();toast(s.error?'Rascunho preservado neste navegador. Sincronize ao retornar.':'Conferência pausada. Retome pela mesma loja.');}
function updateBell(){const count=(state?.tasks||[]).filter(t=>t.status==='open').length;if($('#demand-count'))$('#demand-count').textContent=count;if($('#demand-bell'))$('#demand-bell').setAttribute('aria-label',`Avisos e demandas: ${count} abertas`);}
function flowStoreName(id){return state.records.find(r=>r.id===id)?.data.name||'Unidade';}
function demandCards(store=''){const today=new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});const tasks=(state.tasks||[]).filter(t=>t.status==='open'&&(!store||t.store===store)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.priority==='alta'?-1:1));return tasks.length?tasks.map(t=>`<article class="demand-card"><div><span class="badge">${esc(flowStoreName(t.store))}</span> <span class="badge ${t.priority==='alta'?'rejected':''}">${t.priority==='alta'?'Alta prioridade':'Acompanhar'}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.detail)}</p><p class="${t.due&&t.due<today?'overdue':'hint'}">${t.due?(t.due<today?'Prazo vencido · ': 'Prazo · ')+date(t.due):'Sem prazo · defina quando retornar à franquia'}</p><div class="task-tools"><button class="btn small" data-task-open="${esc(t.id)}">${t.origin==='automatic'?'Resolver na conferência':'Registrar conclusão'}</button><button class="btn small" data-task-date="${esc(t.id)}">Definir prazo</button><button class="btn small" data-store-history="${t.store}">Histórico da franquia</button></div></article>`).join(''):'<p class="notice purple">Nenhuma demanda aberta'+(store?' nesta franquia':'')+'.</p>';}
function showDemands(){modal('🔔 Avisos e demandas',`<div class="modalbody"><p>Demandas práticas do Eduardo, com prazo e histórico por franquia. As vencidas aparecem primeiro.</p>${offline?'<p class="notice">Abra o painel online para consultar e compartilhar demandas atualizadas.</p>':''}${demandCards()}</div>`);$('#modal').classList.add('store-dialog');}
async function storeHistory(id,offset=0){if(flowSession)await flowExit();if(flowSession)return;return archive(id,offset==='demandas'?'demandas':'linha');}
function demandForm(store,task=null,schedule=false){modal(schedule?'Definir prazo':task?'Registrar conclusão':'Nova demanda · '+esc(flowStoreName(store)),`<form id="demand-form" data-store="${store}" data-task="${esc(task?.id||'')}" data-version="${task?.version||0}" data-intent="${schedule?'task-schedule':task?'task-resolve':'task-create'}"><div class="modalbody">${task?'<h3>'+esc(task.title)+'</h3>':''}${!task?'<label class="field">O que precisa ser feito?<input name="title" required maxlength="160" placeholder="Ex.: confirmar telefone com a gerente"></label><label class="field">Orientação prática<textarea name="detail" required maxlength="4000" placeholder="Contato, ação esperada e evidência a apresentar"></textarea></label><label class="field">Prioridade<select name="priority"><option value="normal">Normal</option><option value="alta">Alta</option></select></label>':''}${!task||schedule?'<label class="field">Prazo de retorno<input type="date" name="due" required value="'+esc(task?.due||'')+'"></label>':'<label class="field">Resultado e evidência *<textarea name="resolution" required maxlength="4000" placeholder="O que foi resolvido, com quem e onde está a evidência"></textarea></label>'}<div id="demand-error" role="alert"></div></div><div class="modalfoot"><button class="btn primary">Salvar no histórico da franquia</button></div></form>`);}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-flow-step')){captureFlow();flowSession.step=Number(b.dataset.flowStep);cacheFlow(flowSession);drawFlow();saveFlow();}if(b.hasAttribute('data-flow-issue')){const issue=flowIssues()[Number(b.dataset.flowIssue)],f=storeFields.find(f=>issue.toLowerCase().includes(f.label.toLowerCase()))||storeFields.find(f=>f.key===(/banho e tosa/i.test(issue)?'bathActive':/consultório/i.test(issue)?'clinicActive':/whatsapp/i.test(issue)?'whatsappNumber':null));captureFlow();const ck=/^Checklist · (.+?):/.exec(issue||''),cki=ck&&checklistItems.find(i=>i.label===ck[1]);flowSession.step=cki?flowSteps.findIndex(x=>x.checklist===cki.section):f?Math.max(0,flowSteps.findIndex(x=>x.keys.includes(f.key))):flowSteps.findIndex(x=>x.kind==='levantamento');drawFlow();if(f)$('#flow-form').elements[f.key]?.focus();saveFlow();}if(b.hasAttribute('data-flow-pause'))await flowExit();if(b.hasAttribute('data-flow-retry'))await saveFlow();if(b.hasAttribute('data-flow-export')){captureFlow();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(flowSession.data,null,2)],{type:'application/json'}));a.download='rascunho-franquia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}if(b.hasAttribute('data-flow-current'))await compareFlow();if(b.hasAttribute('data-demands'))showDemands();if(b.dataset.storeHistory)await storeHistory(b.dataset.storeHistory);if(b.dataset.historyId)await storeHistory(b.dataset.historyId,Number(b.dataset.historyPage));if(b.dataset.demandNew){if(offline){toast('Abra o painel online para criar demandas compartilhadas.');return;}demandForm(b.dataset.demandNew);}if(b.dataset.taskOpen){const t=state.tasks.find(t=>t.id===b.dataset.taskOpen);if(t.origin==='automatic')await storeEditor(state.records.find(r=>r.id===t.store));else demandForm(t.store,t);}if(b.dataset.taskDate){const t=state.tasks.find(t=>t.id===b.dataset.taskDate);demandForm(t.store,t,true);}});
document.addEventListener('submit',async e=>{if(e.target.id==='new-store-flow'){e.preventDefault();try{const v=Object.fromEntries(new FormData(e.target));const result=await mutate({action:'store-save',data:v,complete:false});const r=result.records.find(x=>x.kind==='stores'&&x.data.name===v.name&&x.data.code===(v.code||''));await storeEditor(r);}catch(error){err('#new-store-error',error);}return;}if(e.target.id==='demand-form'){e.preventDefault();const f=e.target,button=f.querySelector('button');button.disabled=true;try{const result=await flowRequest({action:f.dataset.intent,store:f.dataset.store,task:f.dataset.task,version:Number(f.dataset.version),...Object.fromEntries(new FormData(f))});state={...state,...result};updateBell();await archive(f.dataset.store,'demandas');toast('Demanda registrada no histórico.');}catch(error){err('#demand-error',error);button.disabled=false;}return;}if(e.target.id!=='flow-form')return;e.preventDefault();if(busy)return;busy=true;try{captureFlow();if(!await saveFlow())throw Error('Aguarde o salvamento ou resolva a falha antes de enviar.');const s=flowSession;await mutate({action:'store-save',id:s.id,version:s.baseVersion,draftVersion:s.draftVersion,complete:true,data:s.data});localStorage.removeItem(flowKey(s.id));flowSession=null;$('#modal').close();toast('Conferência enviada. O histórico e as demandas foram atualizados.');}catch(error){err('#flow-error',error);}finally{busy=false;}});
window.addEventListener('beforeunload',e=>{if(flowSession?.dirty){cacheFlow(flowSession);e.preventDefault();e.returnValue='';}});window.addEventListener('online',()=>{if(flowSession?.dirty&&!flowSession.conflict)saveFlow();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&flowSession){cacheFlow(flowSession);saveFlow();}});

async function compareFlow(){captureFlow();const s=flowSession;try{const r=await fetch('/api/data?consultant=eduardo&month='+month),latest=await r.json();if(!r.ok)throw Error(latest.error);const record=latest.records.find(r=>r.id===s.id),draft=latest.drafts.find(d=>d.store===s.id);s.comparison={record,draft,data:draft?.data||normalizedStore(record.data)};const keys=[...storeFields.map(f=>f.key),'area','salesArea','storeFormat','parking','frontage','openingDate','ownDelivery','deliveryRadius','geoConfirm','rent','water','energy','tax','internet','evidence','reason','returnDate'];modal('Comparar versões · '+esc(record.data.name),`<div class="modalbody"><p>Seu rascunho está preservado. Confira as diferenças e escolha qual versão usar para continuar. Esta escolha será registrada no histórico.</p><div class="tablewrap"><table><thead><tr><th>Informação</th><th>Meu rascunho</th><th>Versão compartilhada</th></tr></thead><tbody>${keys.filter(k=>JSON.stringify([s.data[k],s.data.checks?.[k]])!==JSON.stringify([s.comparison.data[k],s.comparison.data.checks?.[k]])).map(k=>`<tr><td>${esc(storeFields.find(f=>f.key===k)?.label||k)}</td><td>${esc(s.data[k]||'—')}<small>${esc(checkLabels[s.data.checks?.[k]?.state]||'')} ${esc(s.data.checks?.[k]?.note||'')}</small></td><td>${esc(s.comparison.data[k]||'—')}<small>${esc(checkLabels[s.comparison.data.checks?.[k]?.state]||'')} ${esc(s.comparison.data.checks?.[k]?.note||'')}</small></td></tr>`).join('')}</tbody></table></div><div id="compare-error"></div></div><div class="modalfoot"><button class="btn" data-compare-choice="cancel">Voltar sem substituir</button><button class="btn" data-compare-choice="current">Usar versão compartilhada</button><button class="btn primary" data-compare-choice="local">Confirmo: usar meu rascunho</button></div>`);$('#modal').classList.add('store-dialog');}catch(e){toast(e.message);}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-compare-choice]');if(!b)return;const s=flowSession,c=s.comparison;if(b.dataset.compareChoice==='cancel'){drawFlow();return;}b.disabled=true;try{const data=b.dataset.compareChoice==='current'?c.data:s.data;const result=await flowRequest({action:'store-draft',id:s.id,baseVersion:c.record.version,draftVersion:c.draft?.version||0,step:s.step,data,rebase:true});s.data={...data,source:c.record.data.source};s.record=c.record;s.baseVersion=c.record.version;s.draftVersion=result.draft.version;s.dirty=false;s.conflict=false;s.error='';s.savedAt=result.draft.updated_at;state.drafts=result.drafts;state.tasks=result.tasks;state.records=state.records.map(r=>r.id===s.id?c.record:r);cacheFlow(s);drawFlow();updateBell();}catch(error){err('#compare-error',error);b.disabled=false;}});

const sevOrder=['grave','medio','leve'];
const sevClass={grave:'sev-grave',medio:'sev-medio',leve:'sev-leve'};
const todayBR=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
function photoUrl(id){return '/api/data?photo='+encodeURIComponent(id)+'&consultant=eduardo&month='+month;}
function photoThumbs(ids,editable=false){if(!ids?.length)return '';return `<div class="ck-thumbs">${ids.map(id=>offline?`<span class="ck-thumb ck-thumb-off" title="Foto disponível no painel online">📷</span>`:`<span class="ck-thumb"><a href="#" data-foto-link="${photoUrl(id)}"><img src="${PIXEL}" data-foto="${photoUrl(id)}" alt="Foto do problema" loading="lazy"></a>${editable?`<button type="button" class="ck-thumb-del" data-photo-del="${esc(id)}" aria-label="Remover foto">×</button>`:''}</span>`).join('')}</div>`;}

// Passo do checklist dentro da conferência guiada
function checklistStep(sectionId,d){const sec=checklistSections.find(x=>x.id===sectionId),items=d.inspection?.items||{};
 const list=sec.items.map(([key])=>checklistItems.find(i=>i.key===key)).filter(it=>applicableItem(it,d));
 const done=list.filter(it=>items[it.key]?.status).length;
 return `<p class="hint">${esc(sec.hint)} ${offline?'<b>Fotos só podem ser enviadas no painel online.</b>':''}</p><p class="notice purple">Não fotografe clientes nem documentos pessoais. Enquadre só o problema. <b>Grave</b> exige foto e vira demanda de alta prioridade; <b>médio</b> vira demanda; <b>leve</b> fica registrado no resumo.</p><div class="ck-progress"><span>${done} de ${list.length} itens respondidos</span><div class="progress"><i style="width:${list.length?done/list.length*100:0}%"></i></div></div><div class="ck-list">${list.map(it=>{const r=items[it.key]||{},st=r.status||'';return `<article class="ck-item" data-status="${st}" data-item="${it.key}"><div class="ck-head"><div><h4>${esc(it.label)}</h4><p class="hint">${esc(it.help)}</p></div><div class="ck-status" role="radiogroup" aria-label="Situação de ${esc(it.label)}">${[['ok','Conforme'],['problem','Com problema'],['na','Não se aplica']].map(([v,l])=>`<label class="ck-opt ck-opt-${v}"><input type="radio" name="ins__${it.key}__status" value="${v}" ${st===v?'checked':''}><span>${l}</span></label>`).join('')}</div></div><div class="ck-problem"><div class="ck-sev" role="radiogroup" aria-label="Nível do problema">${sevOrder.slice().reverse().map(k=>`<label class="ck-opt ${sevClass[k]}"><input type="radio" name="ins__${it.key}__severity" value="${k}" ${r.severity===k?'checked':''}><span>${severities[k]}</span></label>`).join('')}</div><label class="field">O que foi encontrado<textarea name="ins__${it.key}__note" maxlength="2000" placeholder="Descreva o problema, onde fica e o impacto para a loja">${esc(r.note||'')}</textarea></label><div class="ck-row"><label class="field">Prazo combinado (opcional)<input type="date" name="ins__${it.key}__due" value="${esc(r.due||'')}"></label><label class="btn ck-photo-btn ${offline?'disabled':''}">📷 Tirar ou anexar foto<input type="file" accept="image/*" capture="environment" data-photo-item="${it.key}" hidden ${offline?'disabled':''}></label></div><div class="ck-photos" id="ck-photos-${it.key}">${photoThumbs(r.photos,true)}</div></div><div class="ck-na"><label class="field">Por que não se aplica?<input name="ins__${it.key}__nanote" value="${esc(st==='na'?r.note||'':'')}" maxlength="300" placeholder="Ex.: a loja não tem vitrine"></label></div></article>`;}).join('')}</div>`;}

function levantamentoStep(d,s){const teams=state.records.filter(r=>r.kind==='team'&&r.data.store===s.id);const act=isActiveStore(d),req=act?' *':'',sel=(k,l,list)=>`<label class="field">${l}<select name="${k}"><option value="">Selecionar</option>${list.map(([v,t])=>`<option value="${esc(v)}" ${String(d[k]??'')===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;const gpsTxt=d.geoLat!=null&&d.geoLat!==''?`GPS registrado: ${esc(d.geoLat)}, ${esc(d.geoLng)}${d.geoAccuracy?' · precisão ~'+esc(Math.round(d.geoAccuracy))+' m':''}`:'Sem ponto de GPS registrado.';const gmaps=d.latitude&&d.longitude?`Ponto do Google Maps no cadastro: ${esc(d.latitude)}, ${esc(d.longitude)}.`:'Sem ponto do Google Maps no cadastro.';return `<div class="formgrid"><h3 class="sectiontitle wide" style="grid-column:1/-1">Dados da loja que alimentam os painéis</h3><p class="hint wide" style="grid-column:1/-1">Vão para o potencial, os clusters e o localizador depois que o gestor validar a conferência. Em branco quando não souber.</p>${input('salesArea','Área de venda (m²)'+req,'number',d.salesArea,'min="10" max="5000" step="0.1"')}${input('area','Área total (m²)','number',d.area,'min="0" step="0.1"')}${sel('storeFormat','Formato da loja'+req,storeFormats)}${sel('parking','Estacionamento',parkingOptions)}${input('frontage','Frente da loja (m)','number',d.frontage,'min="1" max="300" step="0.1"')}${input('openingDate','Data de inauguração','date',d.openingDate,'min="2000-01-01"')}${sel('ownDelivery','Faz entrega própria?',[['Sim','Sim'],['Não','Não'],['Não informado','Não informado']])}${input('deliveryRadius','Raio de entrega (km)','number',d.deliveryRadius,'min="0" max="50" step="0.5"')}${sel('geoConfirm','Localização no Google',geoOptions.map(o=>[o,o]))}<div class="field wide geo-row" style="grid-column:1/-1"><button type="button" class="btn small" data-gps>📍 Registrar GPS (estando na loja)</button><input type="hidden" name="geoLat" value="${esc(d.geoLat??'')}"><input type="hidden" name="geoLng" value="${esc(d.geoLng??'')}"><input type="hidden" name="geoAccuracy" value="${esc(d.geoAccuracy??'')}"><p class="hint" id="gps-txt">${gpsTxt} ${gmaps}</p></div><h3 class="sectiontitle wide" style="grid-column:1/-1">Custos da loja (não vão para nenhum painel)</h3>${[['rent','Aluguel mensal (R$)'],['water','Água mensal (R$)'],['energy','Luz mensal (R$)'],['tax','IPTU mensal (R$)'],['internet','Internet mensal (R$)']].map(([k,l])=>input(k,l,'number',d[k],'min="0" step="0.01"')).join('')}${input('taxAnnual','IPTU anual (R$) — o mensal vira 1/12','number',d.taxAnnual,'min="0" step="0.01"')}${input('costsMonth','Competência dos custos','month',d.costsMonth)}<label class="field">Origem dos valores<select name="costsSource"><option value="">Selecionar</option>${costSources.map(o=>`<option ${d.costsSource===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label><p class="hint wide">Em branco quando não souber; zero só quando confirmado. Os cinco custos não são o custo total da operação.</p><div class="listrow wide"><div><strong>Equipe por função</strong><p>${teams.length?teams.map(t=>esc(t.data.function)+' × '+esc(t.data.quantity)).join(' · '):'Nenhuma função cadastrada.'}</p></div><button type="button" class="btn small" data-team-add="${s.id}">Adicionar função</button></div><label class="field wide">Fonte / evidência da conferência *<textarea name="evidence" placeholder="Quem confirmou, quando e referência do documento ou atendimento">${esc(d.evidence||'')}</textarea></label><label class="field wide">Pendências e próximos passos<textarea name="reason">${esc(d.reason||'')}</textarea></label>${input('returnDate','Prazo de retorno','date',d.returnDate)}</div>`;}

// Compressão e envio de foto (reduz para ~1280 px, JPEG)
async function compressPhoto(file){const bmp=await createImageBitmap(file);let max=1280,q=.72,url='';for(let i=0;i<4;i++){const scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<700000)break;max=Math.round(max*.8);q=Math.max(.5,q-.08);}return url;}
function flowItem(key){const s=flowSession;s.data.inspection||={items:{}};s.data.inspection.items||={};return s.data.inspection.items[key]||={status:'',severity:'',note:'',due:'',photos:[]};}

 const s=flowSession;toast('Enviando foto…');try{captureFlow();const image=await compressPhoto(file);const d=await flowRequest({action:'photo-upload',store:s.id,item:key,image});const it=flowItem(key);it.photos=[...(it.photos||[]),d.photo.id];if(it.status!=='problem'){it.status='problem';const box=document.querySelector(`.ck-item[data-item="${key}"]`);if(box){box.dataset.status='problem';const r=box.querySelector(`input[name="ins__${key}__status"][value="problem"]`);if(r)r.checked=true;}}s.dirty=true;s.revision++;cacheFlow(s);refreshThumbs(key);queueFlowSave();toast('Foto registrada no histórico da loja.');}catch(err){toast(err.message||'Não foi possível enviar a foto.');}});

function storeView(r){const draft=(state.drafts||[]).find(x=>x.store===r.id),d=normalizedStore(draft?{...r.data,...draft.data,source:r.data.source}:r.data),sm=inspectionSummary(d),today=todayBR(),tasks=(state.tasks||[]).filter(t=>t.store===r.id&&t.status==='open'),overdue=tasks.filter(t=>t.due&&t.due<today).length;
 const conf=draft?{label:'Em andamento · etapa '+((draft.step||0)+1)+' de '+flowSteps.length,cls:'warn'}:r.status==='approved'?{label:'Validada',cls:'good'}:r.status==='submitted'?{label:'Enviada ao gestor',cls:'warn'}:r.status==='rejected'?{label:'Ajuste solicitado',cls:'bad'}:{label:'Não iniciada',cls:''};
 const inactive=['bath','clinic'].filter(s=>d[s+'Exists']==='Sim'&&d[s+'Active']==='Não').map(s=>s==='bath'?'Banho e tosa inativo':'Consultório inativo');
 const score=sm.counts.grave*1000+sm.counts.medio*50+sm.counts.leve*2+overdue*20+tasks.length;
 return {r,d,draft,sm,tasks,overdue,conf,inactive,score,active:isActiveStore(d)};}

let panoSearch='',panoFilter='';
function panoramaPage(){const views=state.records.filter(r=>r.kind==='stores').map(storeView),active=views.filter(v=>v.active);
 const withGrave=views.filter(v=>v.sm.counts.grave).length,tot={grave:0,medio:0,leve:0};views.forEach(v=>sevOrder.forEach(k=>tot[k]+=v.sm.counts[k]));
 const conferidas=active.filter(v=>['approved','submitted'].includes(v.r.status)).length,started=active.filter(v=>v.draft||v.sm.answered).length,overdue=views.reduce((a,v)=>a+v.overdue,0);
 const freq={};views.forEach(v=>v.sm.problems.forEach(p=>{freq[p.key]||={label:p.label,section:p.sectionTitle,grave:0,medio:0,leve:0,stores:0};freq[p.key][p.severity||'leve']++;freq[p.key].stores++;}));
 const top=Object.values(freq).sort((a,b)=>(b.grave*100+b.medio*10+b.leve)-(a.grave*100+a.medio*10+a.leve)).slice(0,6);
 let rows=views.filter(v=>{const t=[v.d.code,v.d.name,v.d.city,v.d.uf].join(' ').toLowerCase();return (!panoSearch||t.includes(panoSearch.toLowerCase()))&&(!panoFilter||(panoFilter==='grave'?v.sm.counts.grave:panoFilter==='andamento'?!!v.draft:panoFilter==='nao'?!v.draft&&v.r.status==='draft'&&!v.sm.answered:panoFilter==='enviada'?v.r.status==='submitted':panoFilter==='servico'?v.inactive.length:panoFilter==='vencida'?v.overdue:true));}).sort((a,b)=>b.score-a.score||a.d.name.localeCompare(b.d.name,'pt-BR'));
 return heading('Panorama das lojas','O que importa de cada loja: problemas por nível, serviços parados, demandas e andamento da conferência.',btn('Exportar resumo (CSV)','pano-csv'))+`<div class="cards">${stat('Lojas conferidas',conferidas+' <small>/ '+active.length+'</small>',started+' com checklist iniciado · lojas ativas','check',active.length?conferidas/active.length*100:0)}${stat('Lojas com problema grave',withGrave,'Exigem ação imediata','pin')}${stat('Problemas registrados',tot.grave+tot.medio+tot.leve,`${tot.grave} graves · ${tot.medio} médios · ${tot.leve} leves`,'file')}${stat('Demandas vencidas',overdue,'Prazo combinado já passou','clock')}</div>${top.length?`<section class="panel" style="margin-bottom:22px"><div class="panelhead"><h2>Problemas que mais se repetem na rede</h2><span class="badge">${top.length}</span></div>${top.map(t=>`<div class="listrow"><div><strong>${esc(t.label)}</strong><p>${esc(t.section)} · ${t.stores} loja(s)</p></div><div>${sevPills(t,true)}</div></div>`).join('')}</section>`:''}<section class="panel"><div class="toolbar"><h2 style="margin:0">Lojas <span class="badge">${rows.length}</span></h2><div class="filters"><input id="pano-search" type="search" value="${esc(panoSearch)}" placeholder="Buscar FR, loja ou cidade" aria-label="Buscar lojas"><select id="pano-filter" aria-label="Filtrar lojas"><option value="">Todas as lojas</option>${[['grave','Com problema grave'],['vencida','Com demanda vencida'],['servico','Com serviço inativo'],['andamento','Conferência em andamento'],['enviada','Enviadas para validação'],['nao','Não iniciadas']].map(([k,l])=>`<option value="${k}" ${panoFilter===k?'selected':''}>${l}</option>`).join('')}</select></div></div>${rows.length?`<div class="tablewrap"><table class="pano"><thead><tr><th>Loja</th><th>Conferência</th><th>Checklist</th><th>Principais problemas</th><th>Serviços</th><th>Demandas</th><th></th></tr></thead><tbody>${rows.map(v=>`<tr class="${v.sm.counts.grave?'row-grave':''}"><td><strong>${esc(v.d.name)}</strong><small>${v.d.code?'FR '+esc(v.d.code):'Sem FR'} · ${esc(v.d.city||'—')}/${esc(v.d.uf||'—')}${v.active?'':' · '+esc(v.d.storeStatus||'')}</small></td><td><span class="badge ${v.conf.cls}">${esc(v.conf.label)}</span></td><td>${v.sm.answered?sevPills(v.sm.counts,true)+`<small>${v.sm.answered}/${v.sm.total} itens</small>`:'<small>Não iniciado</small>'}</td><td class="pano-issues">${v.sm.problems.filter(p=>p.severity!=='leve').slice(0,3).map(p=>`<span class="sev-dot ${sevClass[p.severity]}"></span>${esc(p.label)}`).join('<br>')||'<small>—</small>'}</td><td>${v.inactive.length?v.inactive.map(esc).join('<br>'):'<small>Em dia</small>'}</td><td>${v.tasks.length?v.tasks.length+' aberta(s)'+(v.overdue?`<small class="overdue">${v.overdue} vencida(s)</small>`:''):'<small>—</small>'}</td><td><button class="btn small" data-store-summary="${v.r.id}">Resumo</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma loja encontrada','Ajuste a busca ou o filtro.')}</section>`;}

function attentionBlock(){const views=state.records.filter(r=>r.kind==='stores').map(storeView).filter(v=>v.sm.counts.grave||v.sm.counts.medio||v.overdue).sort((a,b)=>b.score-a.score).slice(0,5);return `<section class="panel flow-welcome"><div><span class="eyebrow">Lojas que precisam de atenção</span>${views.length?views.map(v=>`<div class="listrow"><div><strong>${esc(v.d.name)}</strong><p>${v.sm.problems.filter(p=>p.severity!=='leve').slice(0,2).map(p=>esc(p.label)).join(' · ')||'Demanda vencida'}</p></div><div>${sevPills(v.sm.counts,true)} <button class="btn small" data-store-summary="${v.r.id}">Resumo</button></div></div>`).join(''):'<p>Nenhum problema médio ou grave registrado até agora.</p>'}</div><button class="btn primary" data-tab="panorama">Ver panorama das lojas →</button></section>`;}

function storeSummary(id){const r=state.records.find(x=>x.id===id);if(!r)return;const v=storeView(r),d=v.d,teams=state.records.filter(x=>x.kind==='team'&&x.data.store===id),costs=costKeys.map(([k,l])=>[l,d[k]]),costSum=costs.every(([,x])=>x!==''&&x!=null)?costs.reduce((a,[,x])=>a+Number(x),0):null,payroll=teams.reduce((a,t)=>a+(Number(t.data.quantity)||0)*((Number(t.data.salary)||0)+(Number(t.data.benefits)||0)),0);
 modal('Resumo · '+esc(d.name),`<div class="modalbody"><p><span class="badge ${v.conf.cls}">${esc(v.conf.label)}</span> ${sevPills(v.sm.counts)} <span class="hint">${v.sm.answered}/${v.sm.total} itens do checklist</span></p>${v.draft?'<p class="hint">Mostrando o rascunho mais recente da conferência, ainda não enviado.</p>':''}<h3>Problemas encontrados</h3>${v.sm.problems.length?v.sm.problems.map(p=>`<article class="sum-problem ${sevClass[p.severity]||''}"><div><span class="sev-pill ${sevClass[p.severity]||''}">${esc(severities[p.severity]||'Sem nível')}</span> <strong>${esc(p.label)}</strong> <small>${esc(p.sectionTitle)}${p.due?' · prazo '+date(p.due):''}</small></div><p>${esc(p.note||'Sem descrição.')}</p>${photoThumbs(p.photos)}${!p.photos?.length?'<small class="hint">Sem foto.</small>':''}</article>`).join(''):'<p class="notice purple">Nenhum problema registrado no checklist.</p>'}<div class="grid equal" style="margin-top:22px"><section class="panel"><h3>Cadastro</h3><dl class="detailgrid"><div><dt>FR</dt><dd>${esc(d.code||'—')}</dd></div><div><dt>CNPJ</dt><dd>${esc(d.cnpj||'Pendente')}</dd></div><div><dt>Responsável da loja</dt><dd>${esc(d.contact||'Pendente')}</dd></div><div><dt>WhatsApp</dt><dd>${esc(d.whatsappAvailable==='Sim'?d.whatsappNumber||'Número pendente':d.whatsappAvailable||'—')}</dd></div><div><dt>Endereço</dt><dd>${esc([d.address,d.neighborhood,d.city,d.uf].filter(Boolean).join(', ')||'—')}</dd></div><div><dt>Situação</dt><dd>${esc(d.storeStatus||'—')}</dd></div></dl></section><section class="panel"><h3>Serviços e levantamento</h3><dl class="detailgrid"><div><dt>Banho e tosa</dt><dd>${esc(serviceText(d,'bath'))}</dd></div><div><dt>Consultório</dt><dd>${esc(serviceText(d,'clinic'))}</dd></div><div><dt>Área</dt><dd>${d.area?esc(d.area)+' m²':'Pendente'}</dd></div><div><dt>5 custos da loja</dt><dd>${costSum==null?'Incompleto':money(costSum)+'/mês'}<small>${costs.map(([l,x])=>l+': '+(x===''||x==null?'—':money(Number(x)))).join(' · ')}</small><small>${esc(d.costsSource||'Origem não informada')}${d.costsMonth?' · '+esc(d.costsMonth):''}</small></dd></div><div><dt>Equipe</dt><dd>${teams.length?teams.map(t=>esc(t.data.function)+' × '+esc(t.data.quantity)).join('<br>')+`<small>Salários + benefícios: ${money(payroll)}/mês (sem encargos)</small>`:'Não cadastrada'}</dd></div></dl></section></div><h3>Tarefas do franqueado</h3>${blocksOf(id).length?blocksOf(id).map(b=>blockCard(b,true)).join(''):'<p class="hint">Nenhum bloco de tarefas para esta loja.</p>'}<h3>Demandas abertas</h3>${demandCards(id)}</div>`,`<div class="modalfoot store-footer"><button class="btn" data-store-history="${id}">Arquivo da loja</button><button class="btn primary" data-block-new="${id}">Montar bloco p/ franqueado</button><button class="btn" data-store-open="${id}">${MANAGER?'Abrir ficha':'Abrir conferência'}</button><button class="btn" data-action="print">Imprimir</button></div>`);$('#modal').classList.add('store-dialog');}

function panoCsv(){const views=state.records.filter(r=>r.kind==='stores').map(storeView).sort((a,b)=>b.score-a.score);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[['FR','Loja','Cidade','UF','Situação','Conferência','Itens respondidos','Graves','Médios','Leves','Problemas graves e médios','Serviços inativos','Demandas abertas','Demandas vencidas'].map(q).join(';')];for(const v of views)lines.push([v.d.code,v.d.name,v.d.city,v.d.uf,v.d.storeStatus,v.conf.label,v.sm.answered+'/'+v.sm.total,v.sm.counts.grave,v.sm.counts.medio,v.sm.counts.leve,v.sm.problems.filter(p=>p.severity!=='leve').map(p=>p.label+' ('+severities[p.severity]+')').join(' | '),v.inactive.join(' | '),v.tasks.length,v.overdue].map(q).join(';'));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='panorama-lojas-'+todayBR()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.storeSummary){storeSummary(b.dataset.storeSummary);}if(b.dataset.action==='pano-csv')panoCsv();});
let panoTimer;document.addEventListener('input',e=>{if(e.target.id==='pano-search'){panoSearch=e.target.value;const pos=e.target.selectionStart;clearTimeout(panoTimer);panoTimer=setTimeout(()=>{render();$('#pano-search').focus();$('#pano-search').setSelectionRange(pos,pos);},250);}});
document.addEventListener('change',e=>{if(e.target.id==='pano-filter'){panoFilter=e.target.value;render();}});

// GPS: registra o ponto onde o consultor está (só com a permissão do navegador). Precisão acima de 150 m é recusada.
document.addEventListener('click',e=>{const b=e.target.closest('[data-gps]');if(!b)return;const f=b.closest('form');if(!navigator.geolocation){toast('Este aparelho não informa a localização.');return;}b.disabled=true;b.textContent='Buscando o GPS…';
 navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;b.textContent='📍 Registrar GPS de novo';const acc=Math.round(p.coords.accuracy||0);if(acc>150){toast('GPS impreciso (~'+acc+' m). Tente perto da porta da loja, fora de área coberta.');return;}
  f.geoLat.value=p.coords.latitude.toFixed(6);f.geoLng.value=p.coords.longitude.toFixed(6);f.geoAccuracy.value=acc;const t=f.querySelector('#gps-txt');if(t)(t.innerHTML='GPS registrado agora: '+esc(f.geoLat.value)+', '+esc(f.geoLng.value)+' · precisão ~'+acc+' m.');f.geoLat.dispatchEvent(new Event('input',{bubbles:true}));toast('Localização registrada.');},
  er=>{b.disabled=false;b.textContent='📍 Registrar GPS (estando na loja)';toast(er.code===1?'Permita a localização no navegador para registrar o GPS.':'Não foi possível obter o GPS agora.');},{enableHighAccuracy:true,timeout:20000,maximumAge:0});});

// ── Blocos de tarefas para o franqueado, arquivo da franquia e portal do franqueado ──
const blockLabels={draft:'Rascunho · aguardando aprovação',approved:'Liberado ao franqueado',closed:'Concluído',cancelled:'Cancelado'};
const taskLabels={open:'A fazer',done:'Feita · aguardando verificação',verified:'Verificada',reopened:'Refazer'};
const taskBadge={open:'warn',done:'',verified:'good',reopened:'bad'};
const histCats=[['todas','Tudo'],['conferencia','Conferências'],['fotos','Fotos'],['demandas','Demandas'],['franqueado','Tarefas do franqueado'],['registros','Visitas e registros'],['geral','Outros']];
const blocksOf=store=>(state.blocks||[]).filter(b=>b.store===store);
const storeLabel=id=>{const r=state.records?.find(x=>x.id===id);return r?(r.data.code?'FR '+r.data.code+' · ':'')+r.data.name:'Loja';};
function blockProgress(b){const t=b.tasks||[],v=t.filter(x=>x.status==='verified').length,d=t.filter(x=>x.status==='done').length;return {total:t.length,verified:v,done:d,pct:t.length?v/t.length*100:0};}
function mergeState(d){for(const k of ['blocks','drafts','tasks','members'])if(d[k])state[k]=d[k];}
async function teamPost(payload){const d=await flowRequest(payload);mergeState(d);return d;}

// ── montador de bloco (consultor propõe, gestor aprova) ──
function blockCandidates(store){const r=state.records.find(x=>x.id===store),v=storeView(r),used=new Set(blocksOf(store).flatMap(b=>(b.tasks||[]).map(t=>t.origin_task).filter(Boolean)));
 const fromTasks=(state.tasks||[]).filter(t=>t.store===store&&t.status==='open'&&t.rule!=='conference'&&!used.has(t.id)).map(t=>{const key=(t.rule||'').startsWith('check:')?t.rule.slice(6):null,p=key?v.d.inspection?.items?.[key]:null;return {origin_task:t.id,title:t.title.replace(/^Problema (grave|médio) · /,''),detail:t.detail.replace(/ · \d+ foto\(s\)\. Quando resolver.*$/,'').replace(/ · sem foto\. Quando resolver.*$/,''),severity:p?.severity||(t.priority==='alta'?'grave':''),item:key,photos:p?.photos||[],due:t.due||p?.due||'',checked:(t.rule||'').startsWith('check:')};}).sort((a,b)=>({grave:0,medio:1,leve:2}[a.severity]??3)-({grave:0,medio:1,leve:2}[b.severity]??3));
 const keys=new Set(fromTasks.map(c=>c.item).filter(Boolean));
 const leves=v.sm.problems.filter(p=>p.severity==='leve'&&!keys.has(p.key)).map(p=>({origin_task:'',title:p.label,detail:p.note||'',severity:'leve',item:p.key,photos:p.photos||[],due:p.due||'',checked:false}));
 return [...fromTasks,...leves];}
function blockBuilder(store,block=null){const cands=block?block.tasks.map(t=>({...t,checked:true})):blockCandidates(store),monthName=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 modal((block?'Editar bloco · ':'Montar bloco de tarefas · ')+esc(storeLabel(store)),`<form id="block-form" data-store="${store}" data-id="${block?.id||''}" data-version="${block?.version||0}"><div class="modalbody"><p class="notice purple">O bloco reúne as tarefas que o franqueado vai executar. ${MANAGER?'Ao liberar, o franqueado passa a ver as tarefas, as fotos anexadas e os prazos.':'Você monta; o gestor revisa e libera ao franqueado.'} Custos, notas e dados internos nunca aparecem para ele.</p><div class="formgrid">${input('btitle','Nome do bloco','text',block?.title||'Tarefas da loja · '+monthName,'required maxlength="160"')}${input('bdue','Prazo geral','date',block?.due||'')}<label class="field wide">Recado ao franqueado (opcional)<textarea name="bnote" maxlength="4000" placeholder="Ex.: prioridade para os itens graves; qualquer dúvida, fale com o consultor">${esc(block?.note||'')}</textarea></label></div><h3 style="margin-top:22px">Tarefas <span class="badge" id="bcount"></span></h3><p class="hint">Marque o que entra no bloco e ajuste o texto em linguagem simples, dizendo o que fazer e como comprovar.</p><div id="bt-list">${cands.length?cands.map((c,i)=>btRow(c,i)).join(''):'<p class="notice">Sem demandas abertas nesta loja. Adicione tarefas manuais.</p>'}</div><button type="button" class="btn small" data-bt-add>+ Adicionar tarefa manual</button><div id="block-error" role="alert"></div></div><div class="modalfoot"><button type="button" class="btn" data-action="dismiss">Cancelar</button><button class="btn ${MANAGER?'':'primary'}" name="intent" value="draft">Salvar ${MANAGER?'rascunho':'e enviar ao gestor'}</button>${MANAGER?'<button class="btn primary" name="intent" value="approve">Salvar e liberar ao franqueado</button>':''}</div></form>`);$('#modal').classList.add('store-dialog');countBt();}
function btRow(c,i){return `<article class="bt-row ${c.severity?sevClass[c.severity]:''}" data-bt="${i}" data-origin="${esc(c.origin_task||'')}" data-item="${esc(c.item||'')}" data-severity="${esc(c.severity||'')}" data-photos='${esc(JSON.stringify(c.photos||[]))}'><label class="bt-check"><input type="checkbox" name="bt_on" ${c.checked?'checked':''}> ${c.severity?`<span class="sev-pill ${sevClass[c.severity]}">${severities[c.severity]}</span>`:'<span class="sev-pill sev-none">Tarefa</span>'}</label><div class="bt-fields"><input name="bt_title" value="${esc(c.title)}" maxlength="160" placeholder="O que fazer" aria-label="Tarefa"><textarea name="bt_detail" maxlength="4000" placeholder="Como fazer e como comprovar (ex.: enviar foto do resultado)" aria-label="Orientação">${esc(c.detail)}</textarea><div class="ck-row"><label class="field">Prazo<input type="date" name="bt_due" value="${esc(c.due||'')}"></label>${photoThumbs(c.photos)}</div></div></article>`;}
function countBt(){const n=[...document.querySelectorAll('#bt-list .bt-row')].filter(r=>r.querySelector('[name=bt_on]').checked).length;if($('#bcount'))$('#bcount').textContent=n+' selecionada(s)';}
function readBlockForm(form){return {title:form.btitle.value,due:form.bdue.value,note:form.bnote.value,tasks:[...form.querySelectorAll('.bt-row')].filter(r=>r.querySelector('[name=bt_on]').checked).map(r=>({title:r.querySelector('[name=bt_title]').value,detail:r.querySelector('[name=bt_detail]').value,due:r.querySelector('[name=bt_due]').value,origin_task:r.dataset.origin,item:r.dataset.item,severity:r.dataset.severity,photos:JSON.parse(r.dataset.photos||'[]')}))};}
document.addEventListener('change',e=>{if(e.target.name==='bt_on')countBt();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-bt-add]');if(!b)return;const list=$('#bt-list'),i=list.querySelectorAll('.bt-row').length;list.querySelector('.notice')?.remove();list.insertAdjacentHTML('beforeend',btRow({title:'',detail:'',checked:true,photos:[]},i));countBt();list.lastElementChild.querySelector('[name=bt_title]').focus();});
document.addEventListener('submit',async e=>{if(e.target.id!=='block-form')return;e.preventDefault();const f=e.target,intent=e.submitter?.value||'draft',btns=[...f.querySelectorAll('button')];btns.forEach(x=>x.disabled=true);try{const v=readBlockForm(f);const d=await teamPost({action:'block-save',store:f.dataset.store,id:f.dataset.id||null,version:Number(f.dataset.version),...v});if(intent==='approve'){const blk=state.blocks.find(x=>x.id===d.saved);await teamPost({action:'block-approve',id:blk.id,version:blk.version});}$('#modal').close();render();toast(intent==='approve'?'Bloco liberado. O franqueado já vê as tarefas.':MANAGER?'Rascunho salvo.':'Bloco enviado ao gestor para aprovação.');}catch(error){err('#block-error',error);btns.forEach(x=>x.disabled=false);}});

function pickStore(){const opts=state.records.filter(r=>r.kind==='stores').sort((a,b)=>a.data.name.localeCompare(b.data.name,'pt-BR'));modal('Montar bloco · escolha a loja',`<div class="modalbody"><label class="field">Loja<select id="pick-store">${opts.map(r=>{const n=(state.tasks||[]).filter(t=>t.store===r.id&&t.status==='open').length;return `<option value="${r.id}">${esc((r.data.code?'FR '+r.data.code+' · ':'')+r.data.name)}${n?' — '+n+' demanda(s)':''}</option>`;}).join('')}</select></label></div>`,`<div class="modalfoot"><button class="btn primary" data-pick-go>Continuar</button></div>`);}
