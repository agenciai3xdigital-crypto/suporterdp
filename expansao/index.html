<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteira de Expansão · Rede POP Pet Center</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14332A; --muted:#5A7268; --line:#D3DFD8; --board:#EEF3F0; --card:#FFFFFF;
  --pine:#009150; --pine-soft:#E2F2EA; --rust:#B84A0A; --rust-soft:#FFEDE1;
  --amber:#9A6A00; --amber-soft:#FBF1DC; --steel:#00573F; --col:268px;
  --laranja:#FF6B15; --verde-escuro:#00573F; --verde-claro:#A8D3C4; --amarelo:#FDAE25; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--board);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:Archivo,Inter,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

.top{padding:14px 24px 0} /* v3.9: faixa verde e título saíram para a Barra POP */
.pb-esteira{padding-left:24px;padding-right:24px}
@media(max-width:640px){.pb-esteira{padding-left:14px;padding-right:14px}.pb-esteira .sync{display:none}} /* estado da sincronização só no computador */
.marca{display:flex;align-items:center;gap:14px}.marca img{height:44px;width:auto}
@media(max-width:600px){.marca img{height:34px}}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.top p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--laranja);background:var(--laranja);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;box-shadow:0 2px 8px rgba(255,107,21,.22)}
.btn:hover{background:#e85f0f;border-color:#e85f0f}
.btn-ghost{background:#fff;color:var(--verde-escuro);border-color:var(--verde-claro);box-shadow:none}
.btn-ghost:hover{background:var(--pine-soft);border-color:var(--pine)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:0;margin:18px 24px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 2px;margin-right:24px;color:var(--muted);font-weight:500}
.tab.on{color:var(--verde-escuro);border-bottom-color:var(--laranja);font-weight:600}
.tab .badge{display:inline-block;background:var(--laranja);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px;font-variant-numeric:tabular-nums}
.filtros{display:flex;gap:6px;margin:14px 24px 0;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:2px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.funnel{margin:16px 24px 0;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px 18px 12px}
.funnel-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.funnel-head h2{font-size:14px;font-weight:600;margin:0}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font-family:Archivo;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.stat.alert b{color:var(--rust)}
.bars{display:flex;align-items:flex-end;gap:4px;height:74px}
.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bar{background:var(--pine);border-radius:1px 1px 0 0;min-height:2px}
.bar.zero{background:var(--line)}
.bar-n{font-family:Archivo;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:3px}
.bar-labels{display:flex;gap:4px;margin-top:6px}
.bar-labels div{flex:1;min-width:0;font-size:10.5px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv{display:flex;gap:4px;margin-top:2px}
.conv div{flex:1;min-width:0;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.scroller{overflow-x:auto;padding:18px 24px 40px}
.bands,.board{display:grid;grid-template-columns:repeat(10,var(--col));gap:10px;min-width:min-content}
.band{font-size:11.5px;font-weight:600;color:var(--muted);border-top:2px solid var(--ink);padding:5px 2px 8px}
.band.b2{border-top-color:var(--amber)}
.band.b3{border-top-color:var(--pine)}
.band.b4{border-top-color:var(--steel)}
.col{display:flex;flex-direction:column;min-height:120px}
.col-head{padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:9px}
.col-head .t{display:flex;align-items:baseline;gap:7px}
.col-head .n{font-family:Archivo;font-size:11px;font-weight:700;color:var(--muted);width:14px}
.col-head h3{font-size:13px;font-weight:600;margin:0;letter-spacing:-.01em}
.col-head .c{margin-left:auto;font-family:Archivo;font-weight:700;font-variant-numeric:tabular-nums}
.col-head .sla{font-size:11px;color:var(--muted);padding-left:21px}
.cards{display:flex;flex-direction:column;gap:8px}
.empty-col{border:1px dashed #C4CCC8;border-radius:2px;height:52px}

.lead{position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:8px;padding:10px 11px 9px;text-align:left;width:100%}
.lead:hover{border-color:#AEB8B3}
.lead.late{border-left-color:var(--rust)}
.lead.warn{border-left-color:var(--amber)}
.lead.hold{border-left-color:var(--steel)}
.lead .nm{font-weight:600;font-size:13.5px;margin-bottom:1px}
.lead .loc{color:var(--muted);font-size:12px}
.lead .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.days{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.days.late{color:var(--rust);font-weight:600}
.days.warn{color:var(--amber);font-weight:600}
.pill{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);background:#fff}
.pill.nova{border-color:#B9C6BF;color:var(--pine)}
.pill.conversao{border-color:#E0CFA6;color:var(--amber)}
.pill.repasse{border-color:#B5C4D2;color:var(--steel)}
.note{margin-top:7px;font-size:11.5px;display:flex;gap:5px;align-items:flex-start;color:var(--amber)}
.note.block{color:var(--rust)}
.note svg{flex:none;margin-top:2px}

.blank{margin:22px 24px;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:26px}
.blank h2{margin:0 0 6px;font-size:17px}
.blank p{margin:0 0 16px;color:var(--muted);max-width:60ch}

/* follow-ups */
.fu{padding:18px 24px 48px;max-width:1000px}
.fu-grupo{margin-bottom:26px}
.fu-grupo h3{font-size:13px;margin:0 0 10px;font-weight:600}
.fu-grupo h3 em{font-style:normal;color:var(--muted);font-weight:400}
.fu-item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:2px;padding:11px 13px;margin-bottom:7px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fu-item.late{border-left-color:var(--rust)}
.fu-item.hoje{border-left-color:var(--pine)}
.fu-item .who{min-width:180px}
.fu-item .who b{display:block;font-size:13.5px}
.fu-item .who span{color:var(--muted);font-size:12px}
.fu-item .obj{flex:1;min-width:220px;font-size:13px}
.fu-item .obj span{color:var(--muted);font-size:11.5px;display:block}
.fu-item .acts{display:flex;gap:6px}
.vazio{color:var(--muted);background:var(--card);border:1px dashed #C4CCC8;padding:18px;border-radius:2px}

/* login, sincronização, ficha do cedente (v3 supabase) */
.login{position:fixed;inset:0;background:var(--board);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:28px 30px;width:100%;max-width:380px}
.login-box h2{margin:0 0 4px;font-size:18px}
.login-box p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-box .field{margin-bottom:12px}
.login-box .btn{width:100%;padding:10px}
.login-err{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px}
.sync{font-size:11.5px;color:var(--muted);padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}
.sync.ok{border-color:#BFD8CE;color:var(--pine)}
.sync.busy{border-color:#E6D7A8;color:var(--amber)}
.sync.err{border-color:#E7C6B8;color:var(--rust);background:var(--rust-soft)}
.quem{font-size:12.5px;color:var(--muted);align-self:center;white-space:nowrap}
.pill.ficha-enviada{border-color:#E6D7A8;color:var(--amber)}
.pill.ficha-rascunho_cedente{border-color:#B5C4D2;color:var(--steel)}
.pill.ficha-recebida{border-color:#BFD8CE;color:var(--pine);background:var(--pine-soft)}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.linkbox input{flex:1;min-width:260px;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:2px;background:#F7F9F8}
.ced-contato{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;font-size:13px}
.ced-contato span{display:block;color:var(--muted);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
body.leitura #btnNovo,body.leitura #btnImportar,body.leitura #btnNovaLoja,body.leitura #btnGerarLink,body.leitura #btnNovoLink,body.leitura #btnRevogar,body.leitura #btnExcluirLoja{display:none}

/* ficha em modo leitura */
.ficha-cab{background:linear-gradient(135deg,var(--verde-escuro),var(--pine));color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.ficha-cab h3{margin:0;font-size:20px;color:#fff}.ficha-cab .sub{opacity:.9;font-size:13px;margin-top:2px}
.ficha-cab .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.ficha-cab .acts{display:flex;gap:8px;flex-wrap:wrap}
.ficha-cab .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.5)}
.ficha-cab .btn-ghost:hover{background:rgba(255,255,255,.22)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:Archivo;font-size:20px;font-variant-numeric:tabular-nums;color:var(--verde-escuro)}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.destaque{background:var(--pine-soft);border-color:var(--verde-claro)}
.kpi.neg b{color:var(--rust)}.kpi.pos b{color:var(--pine)}
.grid-ficha{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid-ficha{grid-template-columns:1fr}}
.kvf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 16px;font-size:13px;align-items:baseline}
.kvf>span:nth-child(odd){color:var(--muted);min-width:0}.kvf>span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.kvf .totf{grid-column:1/3;border-top:1.5px dashed var(--verde-claro);margin-top:4px;padding-top:6px;font-weight:700;color:var(--verde-escuro);display:flex;justify-content:space-between;gap:12px}
.grid-ficha>.ed{min-width:0;margin-bottom:0}.grid-ficha .texto{min-width:0;overflow-wrap:anywhere}
.interno{font-size:10.5px;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:600}
.texto{white-space:pre-wrap;font-size:13.5px}

/* lojas para repasse */
.lojas{max-width:1120px}
.loja-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(4,minmax(110px,1fr));grid-template-areas:'id n1 n2 n3 n4' 'acts acts acts acts acts';gap:6px 18px;align-items:center}
.loja-card .id{grid-area:id}.loja-card .n:nth-of-type(1){grid-area:n1}.loja-card .n:nth-of-type(2){grid-area:n2}.loja-card .n:nth-of-type(3){grid-area:n3}.loja-card .n:nth-of-type(4){grid-area:n4}
.loja-card.falta{border-left-color:var(--amarelo)}
.loja-card.repassada{border-left-color:var(--pine);opacity:.7}
.loja-card .id{min-width:210px}
.loja-card .id b{display:block;font-size:14.5px}
.loja-card .id span{color:var(--muted);font-size:12px}
.loja-card .n{min-width:120px}
.loja-card .n b{display:block;font-family:Archivo;font-size:15px;font-variant-numeric:tabular-nums}
.loja-card .n span{color:var(--muted);font-size:11.5px}
.loja-card .acts{grid-area:acts;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.loja-card .id{min-width:0}.loja-card .n{min-width:0}
@media(max-width:820px){.loja-card{grid-template-columns:1fr 1fr;grid-template-areas:'id id' 'n1 n2' 'n3 n4' 'acts acts'}.loja-card .acts{justify-content:flex-start}}
.alerta{background:var(--amber-soft);border:1px solid #EAD59A;border-radius:var(--r);padding:10px 12px;font-size:12.5px;margin:0 0 12px}
.alerta b{display:block;margin-bottom:2px}
.ok-box{background:var(--pine-soft);border:1px solid #BFD8CE;border-radius:2px;padding:10px 12px;font-size:12.5px;margin:0 0 12px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.ed h3{font-size:14px;margin:0 0 12px;font-weight:700;color:var(--verde-escuro);display:flex;align-items:center;gap:8px}
.ed h3::before{content:'';width:9px;height:9px;background:var(--laranja);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);flex:none}
.ed h3 em{font-style:normal;color:var(--muted);font-weight:400;font-size:12.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela td{padding:3px 0;border-bottom:1px solid #EDF0EE}
.tabela td:first-child{width:60%}
.tabela td input{border:1px solid transparent;background:transparent;padding:5px 6px}
.tabela td input:hover{border-color:var(--line)}
.tabela td input:focus{border-color:var(--pine);background:#fff}
.tabela input.v{text-align:right;font-variant-numeric:tabular-nums}
.tabela .x{width:26px}
.tabela .x button{background:none;border:none;color:var(--muted);padding:2px 6px}
.tot{display:flex;justify-content:space-between;padding:9px 0 0;font-weight:600;font-variant-numeric:tabular-nums;border-top:1px solid var(--ink);margin-top:4px}
.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.diag div{background:var(--card);border:1px solid var(--line);padding:11px 13px}
.diag b{display:block;font-family:Archivo;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.diag span{color:var(--muted);font-size:12px}
.diag div.mal b{color:var(--rust)}
.diag div.bem b{color:var(--pine)}
.ficha{background:#F5F7F6;border:1px solid var(--line);border-radius:2px;padding:11px 12px;margin-bottom:16px;font-size:12.5px}
.ficha .l{display:flex;justify-content:space-between;padding:3px 0}
.ficha .l span{color:var(--muted)}
.ficha .l b{font-variant-numeric:tabular-nums}
@media (max-width:760px){.grid3,.grid4{grid-template-columns:1fr 1fr}}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(22,32,43,.34);opacity:0;pointer-events:none;transition:opacity .18s;z-index:4}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:450px;max-width:100%;background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:5}
.drawer.on{transform:none}
.dr-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font-size:19px;letter-spacing:-.02em}
.dr-head .loc{color:var(--muted);margin-top:2px;font-size:12.5px}
.dr-body{padding:16px 20px 24px;overflow-y:auto;flex:1}
.dr-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.sec{margin-bottom:20px}
.sec h4{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #EDF0EE}
.chk input{margin-top:2px;accent-color:var(--pine);width:15px;height:15px;flex:none}
.chk label{font-size:13px;line-height:1.35}
.chk .req{color:var(--rust);font-size:11px;margin-left:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #EDF0EE;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:2px;padding:7px 9px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:64px;resize:vertical}
.box{border:1px solid #E4D3A8;background:var(--amber-soft);border-radius:2px;padding:10px 12px;font-size:12.5px;margin-bottom:16px}
.box.block{background:var(--rust-soft);border-color:#E7C6B8}
.box b{display:block;margin-bottom:2px}
.reason{display:none;margin-top:10px}
.reason.on{display:block}
.toque{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #EDF0EE;font-size:13px}
.toque .d{width:74px;flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toque .d.late{color:var(--rust);font-weight:600}
.toque .t{flex:1}
.toque .t span{display:block;color:var(--muted);font-size:11.5px}
.toque .ok{color:var(--pine);font-size:11.5px;white-space:nowrap}
.toque .sem{color:var(--rust);font-size:11.5px;white-space:nowrap}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;padding:20px;background:rgba(22,32,43,.34)}
.modal.on{display:flex}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:3px;width:430px;max-width:100%;padding:22px;max-height:90vh;overflow-y:auto}
.modal-box h2{margin:0 0 14px;font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* COF */
.cofwrap{position:fixed;inset:0;background:var(--board);z-index:9;display:none;flex-direction:column}
.cofwrap.on{display:flex}

<style id="pb-css">
.pb{--pb-bg:#fff;--pb-ink:#14332A;--pb-muted:#5A7268;--pb-line:#D3DFD8;--pb-soft:#EEF3F0;--pb-lar:#FF6B15;--pb-lar-soft:#FFEDE1;--pb-verde:#009150;--pb-verm:#C0392B;
  display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pb-bg);border-bottom:1px solid var(--pb-line);position:relative;flex-wrap:wrap;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:var(--pb-ink);line-height:1.3;box-sizing:border-box}

.pb-trilha a.pb-pai{color:var(--pb-muted);font-weight:600;font-size:14px;text-decoration:none;font-family:'Inter',system-ui,sans-serif;letter-spacing:0;white-space:nowrap}
.pb-trilha a.pb-pai:hover{color:var(--pb-lar)}
.pb-sep{color:var(--pb-line);font-weight:400}

.pb-esp{flex:1 1 8px}

.pb-veu{display:none;position:fixed;inset:0;background:rgba(20,51,42,.35);z-index:180}

.pb-pop{display:none;position:absolute;right:16px;top:calc(100% - 4px);width:min(560px,calc(100vw - 32px));background:var(--pb-bg);border:1px solid var(--pb-line);border-radius:14px;box-shadow:0 10px 30px rgba(20,51,42,.16);padding:14px;z-index:190;color:var(--pb-ink)}

.pb-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}

.pb-aviso{font-size:11.5px;color:var(--pb-muted);margin-top:10px;border-top:1px solid var(--pb-line);padding-top:8px}
@media(max-width:640px){
  .pb{padding:8px 12px;gap:8px;flex-wrap:nowrap}.pb-logo{height:32px}
  .pb-marca{flex:1 1 0;min-width:0}.pb-trilha{font-size:16px;flex-wrap:nowrap;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .pb-x{display:block}.pb-cab a{margin-left:0;flex-basis:100%}
  .pb-grade{grid-template-columns:1fr 1fr}
}
@media print{.pb{display:none!important}}
</style>
<script id="pb-js">
/* BarraPop — API: BarraPop.montar(opts) → depois BarraPop.sessao() quando houver login, BarraPop.quem(nome,sub), BarraPop.sairVisivel(bool). */
window.BarraPop=(function(){
  'use strict';
  var SB_URL='https://klcxavgxonpsbsbzqcil.supabase.co';
  var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsY3hhdmd4b25wc2JzYnpxY2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MzQwMDAsImV4cCI6MjA5OTExMDAwMH0.UJK09SljKG0tJqDcGYQfuk41i1SN8GymL1hTTeE2ruY';
  var HUB_URL='https://agenciai3xdigital-crypto.github.io/painel-master-pop/';
  var GRID='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>';
  var O=null, el={}, carregou=false;

  function jwtPayload(t){try{var p=t.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return null;}}
  function doProjeto(t){var p=jwtPayload(t);return !!(p&&p.role==='authenticated'&&(String(p.iss||'').indexOf('klcxavgxonpsbsbzqcil')>=0||p.ref==='klcxavgxonpsbsbzqcil'));} /* v1.0.1: token de login traz o projeto em iss, não em ref */
  /* Token padrão: procura no localStorage qualquer sessão válida deste projeto (supabase-js ou fetch manual), só leitura. */
  function tokenPadrao(){
    var melhor=null;
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i), v;
        try{v=JSON.parse(localStorage.getItem(k));}catch(e){continue;}
        var c=v&&(typeof v.access_token==='string'?v:(v.currentSession||v.session));
        if(!c||typeof c.access_token!=='string'||!doProjeto(c.access_token))continue;
        var exp=Number(c.expires_at)||(jwtPayload(c.access_token)||{}).exp||0;
        if(exp*1000<Date.now()+15000)continue;
        if(!melhor||exp>melhor.exp)melhor={t:c.access_token,exp:exp};
      }
    }catch(e){}
    return Promise.resolve(melhor?melhor.t:null);
  }
  function rpc(nome,token,corpo,keep){
    return fetch(SB_URL+'/rest/v1/rpc/'+nome,{method:'POST',keepalive:!!keep,
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(corpo||{})}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }
  function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function iniciais(n){var p=String(n||'').replace(/[—–-].*$/,'').trim().split(/\s+/).filter(function(w){return w.length>2||/^[A-Z0-9]+$/.test(w);});return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
  function escura(hex){var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));if(!m)return true;var n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)<150;}
  function urlOk(u){try{var x=new URL(u,location.href);return x.protocol==='https:'?x:null;}catch(e){return null;}}

  function montar(o){
    O=o||{};var raiz=typeof O.el==='string'?document.getElementById(O.el):O.el;if(!raiz)return;
    var extras=[];while(raiz.firstChild){extras.push(raiz.firstChild);raiz.removeChild(raiz.firstChild);}
    raiz.className='pb'+(O.classe?' '+O.classe:'');raiz.setAttribute('role','banner');
    var marca=h('a','pb-marca');marca.href=O.logoHref||O.central||'./';marca.title='Ir para a Central POP';
    var img=h('img','pb-logo');img.src=O.logo||'logo-pop.png';img.alt='Rede POP Pet Center';img.onerror=function(){img.style.display='none';};marca.appendChild(img);
    var tr=h('div','pb-trilha');
    (O.trilha||[]).forEach(function(t){var a=h('a','pb-pai',t.nome);a.href=t.href;tr.appendChild(a);tr.appendChild(h('span','pb-sep','/'));});
    var tit=h('span');tit.innerHTML=O.titulo||'';if(O.sub){tit.appendChild(h('small',null,O.sub));}tr.appendChild(tit);
    marca.appendChild(tr);raiz.appendChild(marca);
    raiz.appendChild(h('span','pb-esp'));
    extras.forEach(function(n){raiz.appendChild(n);});
    el.quem=h('div','pb-quem');el.quemN=h('b');el.quemS=h('span');el.quem.appendChild(el.quemN);el.quem.appendChild(el.quemS);el.quem.style.display='none';raiz.appendChild(el.quem);
    el.btn=h('button','pb-ico');el.btn.type='button';el.btn.title='Sistemas';el.btn.setAttribute('aria-label','Sistemas');el.btn.setAttribute('aria-expanded','false');el.btn.innerHTML=GRID;el.btn.style.display='none';raiz.appendChild(el.btn);
    if(O.sair){el.sair=h('button','pb-sair','Sair');el.sair.type='button';el.sair.id=O.sairId||'pbSair';el.sair.onclick=function(){O.sair();};if(O.sairOculto)el.sair.style.display='none';raiz.appendChild(el.sair);}
    el.veu=h('div','pb-veu');el.pop=h('div','pb-pop');el.pop.setAttribute('role','dialog');el.pop.setAttribute('aria-label','Sistemas');
    raiz.appendChild(el.veu);raiz.appendChild(el.pop);
    el.btn.onclick=function(){alternar();};el.veu.onclick=fechar;
    document.addEventListener('keydown',function(e){if(e.key==='Escape')fechar();});
    document.addEventListener('click',function(e){if(el.pop.classList.contains('on')&&!el.pop.contains(e.target)&&!el.btn.contains(e.target))fechar();});
    if(O.quem)quem(O.quem.nome,O.quem.sub);
    if(O.auto!==false)sessao();
  }
  function alternar(){el.pop.classList.contains('on')?fechar():abrir();}
  function abrir(){el.pop.classList.add('on');el.veu.classList.add('on');el.btn.classList.add('on');el.btn.setAttribute('aria-expanded','true');}
  function fechar(){if(!el.pop)return;el.pop.classList.remove('on');el.veu.classList.remove('on');el.btn.classList.remove('on');el.btn.setAttribute('aria-expanded','false');}
  function quem(nome,sub){if(!el.quem)return;el.quemN.textContent=nome||'';el.quemS.textContent=sub||'';el.quem.style.display=nome?'':'none';}
  function sairVisivel(v){if(el.sair)el.sair.style.display=v?'':'none';}

  /* Carrega o menu: catálogo completo para quem está em hub_acesso; senão só os atalhos do papel (O.links). */
  function sessao(){
    if(!O||!el.pop)return Promise.resolve();
    var get=O.token||tokenPadrao;
    return Promise.resolve().then(function(){return get();}).then(function(tok){
      if(!tok)return desenhar(null,null);
      return rpc('barra_sistemas',tok,{}).then(function(r){desenhar(r&&r.ok?r:null,tok);});
    }).catch(function(){desenhar(null,null);});
  }
  function desenhar(r,tok){
    el.pop.innerHTML='';carregou=true;
    var itens=r?(r.paineis||[]):[];
    var links=(O.links||[]).filter(function(l){return urlOk(l.url);});
    var paineis=itens.filter(function(p){return p.grupo==='painel';});
    var bastidor=itens.filter(function(p){return p.grupo!=='painel';});
    if(!paineis.length&&!links.length){el.btn.style.display='none';return;}
    var cab=h('div','pb-cab');cab.appendChild(h('b',null,'Sistemas'));
    cab.appendChild(h('span',null,r?'catálogo do Painel Master':'atalhos do seu perfil'));
    var x=h('button','pb-x','×');x.type='button';x.setAttribute('aria-label','Fechar');x.onclick=fechar;
    if(r){var hub=h('a',null,'Abrir Painel Master →');hub.href=HUB_URL;hub.target='_blank';hub.rel='noopener';cab.appendChild(hub);}
    cab.appendChild(x);el.pop.appendChild(cab);
    el.pop.appendChild(h('div','pb-grupo','Painéis'));
    var g=h('div','pb-grade');
    (paineis.length?paineis:links).forEach(function(p){
      var u=urlOk(p.url);if(!u)return;
      var atual=(p.chave&&p.chave===O.sistema);
      var a=h(atual?'span':'a','pb-item'+(atual?' atual':''));
      if(!atual){a.href=u.href;if(u.origin!==location.origin){a.target='_blank';a.rel='noopener';a.classList.add('ext');}
        a.onclick=function(){if(tok&&p.chave)rpc('hub_registrar',tok,{p_acao:'abriu',p_alvo:p.chave},true);fechar();};}
      var q=h('span','pb-q',iniciais(p.nome));var cor=/^#[0-9a-f]{6}$/i.test(p.cor||'')?p.cor:'#00573F';q.style.background=cor;q.style.color=escura(cor)?'#fff':'#14332A';
      var t=h('span','pb-t',p.nome);var sub=atual?'você está aqui':(p.descricao||p.sub||'');if(sub)t.appendChild(h('small',null,sub));
      if(p.aviso)a.title=p.aviso;
      a.appendChild(q);a.appendChild(t);g.appendChild(a);
    });
    el.pop.appendChild(g);
    if(bastidor.length){
      el.pop.appendChild(h('div','pb-grupo','Bastidor'));var c=h('div','pb-chips');
      bastidor.forEach(function(p){var u=urlOk(p.url);if(!u)return;var a=h('a',null,p.nome+' ↗');a.href=u.href;a.target='_blank';a.rel='noopener';if(p.aviso)a.title=p.aviso;
        a.onclick=function(){if(tok&&p.chave)rpc('hub_registrar',tok,{p_acao:'abriu',p_alvo:p.chave},true);fechar();};c.appendChild(a);});
      el.pop.appendChild(c);
    }
    if(r)el.pop.appendChild(h('div','pb-aviso','Quem vê este botão é definido em Central POP → Admin → Equipe → "Botão Sistemas". Endereços e cards: pelo Painel Master.'));
    el.btn.style.display='';
  }
  return {montar:montar,sessao:sessao,quem:quem,sairVisivel:sairVisivel,fechar:fechar,rpc:rpc,token:tokenPadrao};
})();

function validarEtapas(v){
  if(!Array.isArray(v)||!v.length)return 'deve ser uma lista com ao menos 1 etapa';
  for(const e of v){
    if(!e||typeof e!=='object')return 'cada etapa deve ser um objeto';
    if(!e.id)return 'etapa sem "id"';
    if(!e.nome||typeof e.nome!=='object'||!e.nome._)return 'etapa "'+e.id+'": "nome" precisa ter a chave "_"';
    if(typeof e.sla!=='number')return 'etapa "'+e.id+'": "sla" deve ser número (dias)';
    if(!Array.isArray(e.gates))return 'etapa "'+e.id+'": "gates" deve ser lista';
    for(const g of e.gates){if(!g.id||!g.t)return 'etapa "'+e.id+'": gate sem "id" ou "t"';}
    if(!Array.isArray(e.cad))return 'etapa "'+e.id+'": "cad" deve ser lista';
    for(const t of e.cad){if(typeof t.d!=='number'||!t.c||!t.o)return 'etapa "'+e.id+'": toque da cadência precisa de d (número), c (canal) e o (objetivo)';}
  }
  const faltam=[...new Set(((estado&&estado.leads)||[]).map(l=>l.etapa))].filter(id=>!v.some(e=>e.id===id));
  if(faltam.length)return 'leads gravados referenciam etapa(s) ausente(s): '+faltam.join(', ');
  return null;
}
function validarMotivos(v){return (Array.isArray(v)&&v.length&&v.every(x=>typeof x==='string'))?null:'deve ser uma lista de textos';}
function validarLimites(v){return (v&&typeof v==='object'&&typeof v.bloqueio==='number'&&v.bloqueio>=1)?null:'deve ser um objeto com "bloqueio" numérico (>=1)';}
function aplicarConfigLinha(chave,valor){
  const v={etapas:validarEtapas,motivos_perda:validarMotivos,semresp_limites:validarLimites}[chave];
  if(!v)return false;
  const msg=v(valor);
  if(msg){console.warn('exp_config "'+chave+'" recusada, mantendo a configuração atual: '+msg);return false;}
  if(chave==='etapas')ETAPAS=valor;else if(chave==='motivos_perda')MOTIVOS=valor;else LIMITES=valor;
  return true;
}

  const [rl,rs,rc,rt]=await Promise.all([
    supa.from('exp_leads').select('id,dados'),
    supa.from('exp_lojas').select('id,dados,ficha_status,enviado_em,atualizado_em'),
    supa.from('exp_config').select('chave,valor'),
    supa.from('exp_tokens').select('token,loja_id,expira_em,ultimo_acesso,acessos').eq('revogado',false)]);
  for(const r of [rl,rs,rc,rt])if(r.error)throw r.error;
  estado={leads:rl.data.map(r=>r.dados),
    lojas:rs.data.map(r=>({...r.dados,_ficha:{status:r.ficha_status,enviadoEm:r.enviado_em,atualizadoEm:r.atualizado_em}})),
    emissor:'',seq:1,seqL:1};
  const em=rc.data.find(c=>c.chave==='emissor');estado.emissor=em&&em.valor?(em.valor.v||''):'';
  rc.data.forEach(c=>{if(c.chave!=='emissor')aplicarConfigLinha(c.chave,c.valor);});
  rt.data.forEach(t=>{const s=estado.lojas.find(x=>x.id===t.loja_id);if(s)fichaDe(s).token=t;});
  estado.leads.forEach(l=>{l.tipo=l.tipo||'nova';l.toques=l.toques||{};l.gates=l.gates||{};});
  estado.lojas.sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
  tirarFoto();
  document.getElementById('cofEmissor').value=estado.emissor||'';
  setSync('Sincronizado','ok');desenhar();
}
function tirarFoto(){
  snap={leads:{},lojas:{},emissor:estado.emissor||''};
  estado.leads.forEach(l=>snap.leads[l.id]=canon(l));
  estado.lojas.forEach(s=>snap.lojas[s.id]=canon(limpo(s)));
}
function salvar(){if(somenteLeitura){toast('Seu papel é somente leitura. Nada foi salvo.');return;}clearTimeout(tmSalvar);setSync('Salvando…','busy');tmSalvar=setTimeout(salvarAgora,350);}
async function salvarAgora(){
  if(somenteLeitura)return;
  if(salvando){fila=true;return;}
  salvando=true;
  try{
    const upL=[],upS=[],delL=[],delS=[],vL=new Set(),vS=new Set();
    estado.leads.forEach(l=>{vL.add(l.id);if(snap.leads[l.id]!==canon(l))upL.push({id:l.id,dados:l});});
    estado.lojas.forEach(s=>{vS.add(s.id);const c=limpo(s);if(snap.lojas[s.id]!==canon(c))upS.push({id:s.id,dados:c});});
    Object.keys(snap.leads).forEach(id=>{if(!vL.has(id))delL.push(id);});
    Object.keys(snap.lojas).forEach(id=>{if(!vS.has(id))delS.push(id);});
    const ops=[];
    if(upS.length)ops.push(supa.from('exp_lojas').upsert(upS));
    if(upL.length)ops.push(supa.from('exp_leads').upsert(upL));
    if(delL.length)ops.push(supa.from('exp_leads').delete().in('id',delL));
    if(delS.length)ops.push(supa.from('exp_lojas').delete().in('id',delS));
    if((estado.emissor||'')!==snap.emissor)ops.push(supa.from('exp_config').upsert({chave:'emissor',valor:{v:estado.emissor||''},atualizado_em:new Date().toISOString()}));
    const rs=await Promise.all(ops);
    const err=rs.find(r=>r&&r.error);if(err)throw err.error;
    tirarFoto();
    setSync('Salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),'ok');
  }catch(e){console.error(e);setSync('Erro ao salvar: '+(e.message||e),'err');}
  finally{salvando=false;if(fila){fila=false;salvarAgora();}}
}

/* alterações vindas de outra máquina (ou da página do cedente) */
function assinar(){
  supa.channel('esteira-expansao')
    .on('postgres_changes',{event:'*',schema:'public',table:'exp_lojas'},ev=>aplicarRemoto('lojas',ev))
    .on('postgres_changes',{event:'*',schema:'public',table:'exp_leads'},ev=>aplicarRemoto('leads',ev))
    .on('postgres_changes',{event:'*',schema:'public',table:'exp_config'},ev=>{
      const r=ev.new;if(!r||!r.chave||r.chave==='emissor')return;
      if(aplicarConfigLinha(r.chave,r.valor)){toast('Configuração "'+r.chave+'" atualizada por outro usuário.');if(aba==='config')desenharConfig();desenhar();}
    })
    .subscribe(status=>{
      // depois de uma reconexão, recarrega tudo: eventos perdidos enquanto o canal esteve fora não são reenviados
      if(status==='SUBSCRIBED'){if(jaAssinou)carregar().catch(e=>{console.error(e);setSync('Erro ao recarregar: '+(e.message||e),'err');});jaAssinou=true;}
    });
}
let jaAssinou=false;
function aplicarRemoto(col,ev){
  const arr=estado[col];
  const editando=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(ev.eventType==='DELETE'){
    const id=ev.old&&ev.old.id;const i=arr.findIndex(x=>x.id===id);
    if(i<0)return;arr.splice(i,1);delete snap[col][id];
    if(col==='lojas'&&lojaAberta===id)lojaAberta=null;
    if(col==='leads'&&atual&&atual.id===id)fechar();
    if(!editando)desenhar();return;
  }
  const r=ev.new;if(!r||!r.dados)return;
  const i=arr.findIndex(x=>x.id===r.id);
  const local=i>=0?arr[i]:null;
  const jRemoto=canon(r.dados);
  // se eu tenho alteração local ainda não salva neste registro, a minha vence
  if(local&&snap[col][r.id]!==undefined&&canon(limpo(local))!==snap[col][r.id])return;
  // eco da minha própria gravação, sem mudança de ficha: nada a fazer
  if(local&&jRemoto===snap[col][r.id]&&(col==='leads'||fichaDe(local).status===r.ficha_status))return;
  let obj;
  if(col==='lojas'){
    const fichaAntes=local?fichaDe(local).status:null;
    obj={...r.dados,_ficha:{status:r.ficha_status,enviadoEm:r.enviado_em,atualizadoEm:r.atualizado_em,token:local&&local._ficha?local._ficha.token:null}};
    if(r.ficha_status==='recebida'){obj._ficha.token=null;if(fichaAntes!=='recebida')toast('Ficha de formação de preço de '+(r.dados.nome||'loja')+' recebida do cedente.');}
    if(r.ficha_status==='interna')obj._ficha.token=null;
  }else obj=r.dados;
  const inseriu=i<0;
  if(local){  // mantém o objeto vivo: a gaveta/editor guardam referência a ele nos handlers
    for(const k in local)if(!(k in obj))delete local[k];
    Object.assign(local,obj);
  }else arr.push(obj);
  if(col==='leads'&&inseriu&&ev.eventType==='INSERT'&&obj.status!=='perdido')avisarLeadNovo(obj);
  snap[col][r.id]=jRemoto;
  if(!editando){desenhar();if(col==='leads'&&atual&&atual.id===r.id)abrir(r.id);}
}

 {chave:'etapas',titulo:'Etapas, gates, SLAs e cadências (ETAPAS)',validar:validarEtapas,get:()=>ETAPAS,set:v=>ETAPAS=v,padrao:()=>ETAPAS_PADRAO,

function desenharConfig(){
  const v=document.getElementById('viewConfig');
  if(!perfil||!perfil.is_admin){v.innerHTML='<div class="bloco">Somente administradores acessam as configurações.</div>';return;}
  v.innerHTML='<div class="bloco"><h3>Régua de atendimento configurável</h3>'+
    '<p class="dica">Os valores abaixo são os vigentes (banco <code>exp_config</code>; na ausência, o padrão do código). Salvar grava no Supabase e aplica na hora, para todos, sem novo deploy. JSON inválido não é salvo.</p></div>'+
    CFG_BLOCOS.map((b,i)=>'<div class="bloco"><h3>'+b.titulo+'</h3><p class="dica">'+b.dica+'</p>'+
      '<textarea id="cfgT'+i+'" spellcheck="false">'+esc(JSON.stringify(b.get(),null,1))+'</textarea>'+
      '<div class="st" id="cfgS'+i+'"></div></div>').join('')+
    '<div class="bloco" style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn" id="cfgSalvar">Salvar configurações</button>'+
    '<button class="btn btn-ghost" id="cfgPadrao">Preencher com o padrão do código</button>'+
    '<span class="st" id="cfgSt"></span></div>';
  document.getElementById('cfgPadrao').onclick=()=>{
    CFG_BLOCOS.forEach((b,i)=>{document.getElementById('cfgT'+i).value=JSON.stringify(b.padrao(),null,1);
      const s=document.getElementById('cfgS'+i);s.textContent='Preenchido com o padrão do código — clique em Salvar para aplicar.';s.className='st';});
  };
  document.getElementById('cfgSalvar').onclick=salvarConfig;
}
async function salvarConfig(){
  if(!perfil||!perfil.is_admin)return;
  const st=document.getElementById('cfgSt');
  const linhas=[];let erro=false;
  CFG_BLOCOS.forEach((b,i)=>{
    const ta=document.getElementById('cfgT'+i),s=document.getElementById('cfgS'+i);
    let v;ta.classList.remove('err');s.className='st';s.textContent='';
    try{v=JSON.parse(ta.value);}catch(e){erro=true;ta.classList.add('err');s.className='st err';s.textContent='JSON inválido: '+e.message;return;}
    const msg=b.validar(v);
    if(msg){erro=true;ta.classList.add('err');s.className='st err';s.textContent='Estrutura inválida: '+msg;return;}
    linhas.push({b,v,s});
  });
  if(erro){st.className='st err';st.textContent='Corrija os blocos marcados — nada foi salvo.';return;}
  st.className='st';st.textContent='Salvando…';
  try{
    const agora=new Date().toISOString();
    const {error}=await supa.from('exp_config').upsert(linhas.map(x=>({chave:x.b.chave,valor:x.v,atualizado_em:agora})));
    if(error)throw error;
    linhas.forEach(x=>{x.b.set(x.v);x.s.className='st ok';x.s.textContent='Salvo e aplicado.';});
    st.className='st ok';st.textContent='Configurações salvas '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' — já valem para todos os usuários.';
    desenhar();toast('Régua de atendimento atualizada.');
  }catch(e){st.className='st err';st.textContent='Erro ao salvar: '+(e.message||e);}
}

/* ---------- aviso em tempo real de lead novo (spec §4) ---------- */
let leadsNovos=[];
function bipe(){try{
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  [[880,0],[1175,.18]].forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.22,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.35);
    o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.4);});
}catch(e){}}
function avisarLeadNovo(l){
  leadsNovos.push(l.id);
  const rot=(l.nome||'Sem nome')+(l.cidade?' — '+l.cidade+(l.uf?'/'+l.uf:''):'');
  document.getElementById('leadAlertTxt').innerHTML=(leadsNovos.length>1?'<b>'+leadsNovos.length+' leads novos</b> na esteira. Último: ':'🔔 <b>Lead novo:</b> ')+esc(rot)+' · <b>contato imediato</b>';
  document.getElementById('leadAlert').classList.add('on');
  document.title='(🔔 '+leadsNovos.length+') Esteira de expansão';
  bipe();
  if('Notification' in window&&Notification.permission==='granted'){
    try{const n=new Notification('Lead novo na esteira',{body:rot+' — contato humano imediato',tag:'lead-novo'});
      n.onclick=()=>{window.focus();abrirAlertaLead();};}catch(e){}
  }
  toast('Lead novo: '+rot);
}
function abrirAlertaLead(){
  const id=leadsNovos[leadsNovos.length-1];
  fecharAlertaLead();
  if(id){aba='esteira';desenhar();abrir(id);}
}
function fecharAlertaLead(){leadsNovos=[];document.getElementById('leadAlert').classList.remove('on');document.title='Esteira de expansão · Rede POP';}
document.getElementById('leadAlertAbrir').onclick=abrirAlertaLead;
document.getElementById('leadAlertFechar').onclick=fecharAlertaLead;

/* ---------- login (mesmo Auth do Plantão) ---------- */
async function iniciar(){
  // se a Central (raiz) tiver um service worker com cache, garante que esta página venha da rede na próxima abertura
  if('caches' in window){caches.keys().then(ks=>ks.forEach(k=>caches.open(k).then(c=>c.keys().then(rs=>rs.forEach(r=>{if(r.url.includes('/expansao/'))c.delete(r).catch(()=>{});}))).catch(()=>{}))).catch(()=>{});}
  if(!window.supabase){setSync('Biblioteca Supabase não carregou','err');return;}
  if(SUPABASE_ANON_KEY.startsWith('COLE_AQUI')){setSync('Falta a ANON_KEY no topo do script','err');document.getElementById('loginErro').textContent='Configure SUPABASE_ANON_KEY no index.html antes de usar.';return;}
  supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data:{session}}=await supa.auth.getSession();
  if(session)await entrou(session);else setSync('Faça login','');
  supa.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload();});
}
async function entrou(session){
  usuario=session.user;
  supa.from('acessos').insert({user_id:usuario.id}).then(()=>{}).catch(()=>{});
  const {data:p}=await supa.from('perfis').select('nome,is_admin,cor,papeis').eq('id',usuario.id).maybeSingle();
  perfil=p||{nome:usuario.email.split('@')[0],is_admin:false,papeis:[]};
  const papeis=perfil.papeis||[];
  const temPapel=x=>!!perfil.is_admin||papeis.includes(x);
  if(!temPapel('expansao')&&!temPapel('diretoria')){
    const er=document.getElementById('loginErro');
    er.innerHTML='Este login ('+esc(usuario.email)+') não tem acesso à esteira de expansão. Peça ao administrador para incluir o papel <b>expansao</b> no seu perfil. <a href="#" id="lnkSair">Sair</a>';
    document.getElementById('lnkSair').onclick=async ev=>{ev.preventDefault();await supa.auth.signOut();};
    document.getElementById('loginForm').querySelectorAll('input,button').forEach(e=>e.style.display='none');
    setSync('Sem papel expansao','err');return;
  }
  somenteLeitura=!temPapel('expansao');
  document.getElementById('quem').textContent=perfil.nome+(perfil.is_admin?' · admin':somenteLeitura?' · diretoria (leitura)':'')+' · '+VERSAO;
  if(window.BarraPop){BarraPop.quem(perfil.nome,(perfil.is_admin?'admin':somenteLeitura?'diretoria (leitura)':'expansão')+' · '+VERSAO);BarraPop.sessao();} // v3.9: Barra POP
  if(perfil.is_admin)document.getElementById('btnCofDireta').style.display='';
  if(perfil.is_admin)document.getElementById('tabConfig').style.display='';
  if('Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission();}catch(e){}}
  if(somenteLeitura)document.body.classList.add('leitura');
  document.getElementById('login').style.display='none';
  try{await carregar();assinar();carregarFranquias();}
  catch(e){console.error(e);setSync('Erro ao carregar: '+(e.message||e)+(String(e.message||'').match(/exp_/)?' — a migração SQL foi aplicada?':''),'err');}
}
document.getElementById('loginForm').onsubmit=async ev=>{
  ev.preventDefault();
  const b=document.getElementById('loginBtn'),er=document.getElementById('loginErro');
  b.disabled=true;er.textContent='';
  const {data,error}=await supa.auth.signInWithPassword({
    email:document.getElementById('loginEmail').value.trim(),

function exportarJson(){
  const o={versao:VERSAO,exportadoEm:new Date().toISOString(),emissor:estado.emissor||'',
    leads:estado.leads,lojas:estado.lojas.map(limpo)};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
  a.download='esteira-expansao-'+hoje()+'.json';a.click();
}
document.getElementById('btnExportar').onclick=exportarJson;
document.getElementById('btnImportar').onclick=()=>document.getElementById('arqImport').click();
document.getElementById('arqImport').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  let o;try{o=JSON.parse(await f.text());}catch(e){alert('Arquivo não é um JSON válido.');return;}
  const leads=Array.isArray(o.leads)?o.leads:[],lojas=Array.isArray(o.lojas)?o.lojas:[];
  if(!leads.length&&!lojas.length){alert('O arquivo não tem leads nem lojas.');return;}
  const erros=[];
  const idOk=x=>x&&typeof x.id==='string'&&x.id.length>0&&x.id.length<=64;
  leads.forEach((l,i)=>{
    if(!l||typeof l!=='object'||!idOk(l)){erros.push('lead #'+(i+1)+': id ausente ou inválido');return;}
    if(idx(l.etapa)<0)erros.push('lead '+l.id+': etapa "'+l.etapa+'" não existe na régua');
    if(!TIPOS[l.tipo||'nova'])erros.push('lead '+l.id+': tipo "'+l.tipo+'" desconhecido');
    if(estado.leads.some(x=>x.id===l.id))erros.push('lead '+l.id+': id já existe na esteira');
  });
  lojas.forEach((s,i)=>{
    if(!s||typeof s!=='object'||!idOk(s)){erros.push('loja #'+(i+1)+': id ausente ou inválido');return;}
    if(estado.lojas.some(x=>x.id===s.id))erros.push('loja '+s.id+': id já existe');
  });
  const idsL=new Set(),idsS=new Set();
  leads.forEach(l=>{if(l&&idsL.has(l.id))erros.push('lead '+l.id+': id repetido no arquivo');idsL.add(l&&l.id);});
  lojas.forEach(s=>{if(s&&idsS.has(s.id))erros.push('loja '+s.id+': id repetido no arquivo');idsS.add(s&&s.id);});
  if(erros.length){alert('Importação recusada — nada foi gravado:\n\n'+erros.slice(0,12).join('\n')+(erros.length>12?'\n… e mais '+(erros.length-12):''));return;}
  if(!confirm('Importar '+leads.length+' candidato(s) e '+lojas.length+' loja(s)?\nSó registros novos são aceitos (ids já existentes foram recusados). Nada é apagado.'))return;
  lojas.forEach(s=>{const c=limpo(s);estado.lojas.push({...c,_ficha:{status:'interna'}});});
  leads.forEach(l=>{l.tipo=l.tipo||'nova';l.toques=l.toques||{};l.gates=l.gates||{};estado.leads.push(l);});
  if(o.emissor&&!estado.emissor)estado.emissor=o.emissor;
  await salvarAgora();desenhar();toast('Importação concluída.');
};

/* ---------- ficha do cedente: link público ---------- */
const urlFicha=t=>new URL(FICHA_PAGINA,location.href).href+'#t='+encodeURIComponent(t);   // fragmento: não vai em log de servidor nem em Referer
const urlFichaMascarada=t=>new URL(FICHA_PAGINA,location.href).href+'#t='+String(t||'').slice(0,6)+'…';
const ROTULO_FICHA={interna:'ficha interna',enviada:'link enviado',rascunho_cedente:'cedente preenchendo',recebida:'ficha recebida'};
const fmtDH=iso=>iso?new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
async function gerarLink(s,dias){
  if(fichaDe(s).status==='recebida'){
    if(!confirm('A ficha já foi enviada pelo cedente. Gerar um novo link reabre a ficha para ele editar. Continuar?'))return;
    const {error}=await supa.from('exp_lojas').update({ficha_status:'enviada'}).eq('id',s.id);
    if(error){alert('Não foi possível reabrir: '+error.message);return;}
  }
  const {data,error}=await supa.rpc('repasse_gerar_token',{p_loja_id:s.id,p_dias:dias||15});
  if(error){alert(/LOJA_SEM_IDENTIFICACAO/.test(error.message)?'Escolha a unidade da rede antes de gerar o link.':'Não foi possível gerar o link: '+error.message);return;}
  const t=Array.isArray(data)?data[0]:data;
  fichaDe(s).token={token:t.token,expira_em:t.expira_em,acessos:0};
  if(fichaDe(s).status==='interna'||fichaDe(s).status==='recebida')fichaDe(s).status='enviada';
  desenhar();
  try{await navigator.clipboard.writeText(urlFicha(t.token));toast('Link gerado e copiado.');}catch(e){toast('Link gerado.');}
}
async function revogarLink(s){
  const tk=fichaDe(s).token;if(!tk)return;
  if(!confirm('Revogar este link? O cedente perde o acesso; o que ele já salvou fica na ficha.'))return;
  const {error}=await supa.from('exp_tokens').update({revogado:true}).eq('token',tk.token);
  if(error){alert(error.message);return;}
  fichaDe(s).token=null;
  if(fichaDe(s).status!=='recebida'){await supa.from('exp_lojas').update({ficha_status:'interna'}).eq('id',s.id);fichaDe(s).status='interna';}
  desenhar();
}

function ligarCedente(s){
  const q=id=>document.getElementById(id);
  if(q('btnGerarLink'))q('btnGerarLink').onclick=()=>gerarLink(s,parseInt(q('selDias').value,10));

  if(q('btnRevogar'))q('btnRevogar').onclick=()=>revogarLink(s);
  if(q('btnCopiarLink'))q('btnCopiarLink').onclick=async()=>{const tk=fichaDe(s).token;if(!tk)return;try{await navigator.clipboard.writeText(urlFicha(tk.token));toast('Link copiado.');}catch(e){prompt('Copie o link:',urlFicha(tk.token));}};
}

/* ---------- regras ---------- */
const liberacaoCof=l=>l.cofEm?addD(l.cofEm,PRAZO_COF):null;
function travaLegal(l,destino){
  if(destino!=='taxa')return null;
  if(!l.cofEm)return 'Registre a data de entrega da COF antes de assinar contrato ou receber a taxa.';
  const lib=liberacaoCof(l);
  if(hoje()<lib)return 'Assinatura e pagamento liberados a partir de '+fmtD(lib)+', 10 dias após a entrega da COF.';
  return null;
}
const pendentes=l=>gatesDe(ETAPAS[idx(l.etapa)],l.tipo).filter(g=>g.req&&!(l.gates||{})[g.id]);
function podeAvancar(l){
  const i=idx(l.etapa);
  if(i>=ETAPAS.length-1)return{ok:false,msg:'Última etapa da esteira.'};
  const p=pendentes(l);
  if(p.length)return{ok:false,msg:p.length+(p.length>1?' critérios obrigatórios pendentes.':' critério obrigatório pendente.')};
  const t=travaLegal(l,ETAPAS[i+1].id);
  if(t)return{ok:false,msg:t,legal:true};
  return{ok:true,proxima:ETAPAS[i+1]};
}
function toques(l){
  const e=ETAPAS[idx(l.etapa)];
  return (e.cad||[]).map((t,i)=>{
    const chave=l.etapa+'-'+i;
    return {...t,i,chave,feito:(l.toques||{})[chave]||null,data:addD(l.desdeEm,t.d)};
  });
}
const proxToque=l=>toques(l).find(t=>!t.feito)||null;
function estadoCard(l){
  const e=ETAPAS[idx(l.etapa)],d=dias(l.desdeEm,hoje());
  const pt=proxToque(l);
  if(pt&&pt.data<hoje())return{cls:'late',dcls:'late',d,fu:'atrasado'};
  if(l.etapa==='contrato'&&l.cofEm&&hoje()<liberacaoCof(l))return{cls:'hold',dcls:'',d,fu:pt?'ok':'ok'};
  if(d>e.sla)return{cls:'late',dcls:'late',d,fu:'ok'};
  if(d>e.sla*0.7)return{cls:'warn',dcls:'warn',d,fu:'ok'};
  return{cls:'',dcls:'',d,fu:'ok'};
}
const ativos=()=>estado.leads.filter(l=>l.status==='ativo'&&(filtro==='todos'||l.tipo===filtro));

/* ---------- desenho ---------- */
function desenhar(){
  estado.leads.forEach(l=>{if(idx(l.etapa)<0){
    console.warn('Lead '+l.id+' está na etapa desconhecida "'+l.etapa+'"; exibindo na primeira etapa da régua.');
    l.etapa=ETAPAS[0].id;snap.leads[l.id]=canon(l);  // ajusta a foto para não gravar sozinho
  }});
  document.getElementById('viewEsteira').style.display=aba==='esteira'?'':'none';
  document.getElementById('viewFu').style.display=aba==='fu'?'':'none';
  document.getElementById('viewLojas').style.display=aba==='lojas'?'':'none';
  document.getElementById('viewConfig').style.display=aba==='config'?'':'none';
  document.getElementById('filtros').style.display=(aba==='lojas'||aba==='config')?'none':'';
  document.getElementById('tabEsteira').classList.toggle('on',aba==='esteira');
  document.getElementById('tabFu').classList.toggle('on',aba==='fu');
  document.getElementById('tabLojas').classList.toggle('on',aba==='lojas');
  document.getElementById('tabConfig').classList.toggle('on',aba==='config');
  document.getElementById('tabLojas').textContent='Lojas para repasse ('+
    (estado.lojas||[]).filter(s=>s.status!=='repassada').length+')';

  document.getElementById('filtros').innerHTML=
    [['todos','Todos'],['nova','Loja nova'],['conversao','Conversão'],['repasse','Repasse']]
    .map(([v,t])=>`<button class="chip ${filtro===v?'on':''}" data-f="${v}">${t}${
      v==='todos'?'':' ('+estado.leads.filter(l=>l.status==='ativo'&&l.tipo===v).length+')'}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filtro=c.dataset.f;desenhar()});

  const pend=estado.leads.filter(l=>l.status==='ativo').map(l=>({l,t:proxToque(l)}))
    .filter(x=>x.t&&x.t.data<=hoje());
  const bd=document.getElementById('fuBadge');
  bd.style.display=pend.length?'':'none';bd.textContent=pend.length;

  if(aba==='esteira')desenharEsteira();
  else if(aba==='fu')desenharFu();
  else if(aba==='config')desenharConfig();
  else desenharLojas();
}

   <div class="bar-labels">${ETAPAS.map(e=>`<div title="${esc(e.nome._)}">${esc(e.nome._)}</div>`).join('')}</div>
   <div class="conv">${alcance.map((n,i)=>i===0?'<div></div>':

function registrarToque(par,r){
  const [id,chave]=par.split('|');
  const l=estado.leads.find(x=>x.id===id);if(!l)return;
  l.toques=l.toques||{};l.toques[chave]={em:hoje(),r};
  if(r==='ok'){l.semResp=0;l.ultResposta=hoje();}else{l.semResp=(l.semResp||0)+1;}
  salvar();desenhar();if(atual&&atual.id===id)abrir(id);
}

function fechar(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('on');atual=null;
}
function avancar(l){
  const prox=ETAPAS[idx(l.etapa)+1];
  l.etapa=prox.id;l.desdeEm=hoje();l.semResp=0;
  l.alcancou=l.alcancou||[];if(!l.alcancou.includes(prox.id))l.alcancou.push(prox.id);
  if(prox.id==='taxa'&&!l.taxaEm){l.taxaEm=hoje();const s=lojaDo(l);if(s)s.status='repassada';}
  if(prox.id==='inauguracao'&&!l.inauguradoEm)l.inauguradoEm=hoje();
  salvar();abrir(l.id);desenhar();
}
function voltar(l){l.etapa=ETAPAS[idx(l.etapa)-1].id;salvar();abrir(l.id);desenhar();}  // desdeEm mantido: voltar não zera o SLA

let cofLead=null, cofPayload=null;
function limparCofFrame(){const fr=document.getElementById('cofframe');fr.removeAttribute('srcdoc');fr.src='about:blank';}
function abrirCofDireta(){
  if(!perfil||!perfil.is_admin)return;
  cofLead=null;

  document.getElementById('cofSp').textContent='sem vínculo com a esteira · somente admin';

  const fr=document.getElementById('cofframe');
  cofPayload={tipo:'lead',dataEntrega:document.getElementById('cofData').value,emissor:estado.emissor||''};
  fr.onload=()=>{try{fr.contentWindow.postMessage(cofPayload,location.origin);}catch(e){}};
  fr.removeAttribute('srcdoc');fr.src='cof.html?v='+Date.now();
  document.getElementById('cofwrap').classList.add('on');
}
document.getElementById('btnCofDireta').onclick=abrirCofDireta;
window.addEventListener('message',ev=>{
  const fr=document.getElementById('cofframe');
  if(ev.origin!==location.origin||!fr||ev.source!==fr.contentWindow)return;
  if(ev.data&&ev.data.tipo==='cof-pronto'&&cofPayload){
    try{fr.contentWindow.postMessage(cofPayload,location.origin);}catch(e){}
  }
});
function abrirCof(l){
  document.getElementById('cofRegistrar').style.display='';
  cofLead=l;
  document.getElementById('cofNome').textContent='COF · '+l.nome;
  document.getElementById('cofSp').textContent=TIPOS[l.tipo]+' · '+(l.cidade||'')+(l.uf?'/'+l.uf:'');
  document.getElementById('cofData').value=l.cofEm||hoje();
  const fr=document.getElementById('cofframe');
  cofPayload={tipo:'lead',
      nome:l.nome,cpf:l.cpf||'',tel:l.tel||'',email:l.email||'',
      cidade:l.cidade||'',uf:l.uf||'',regiao:l.regiao||'',
      dataEntrega:document.getElementById('cofData').value,
      tipoOp:l.tipo,lojaRep:l.lojaRef||'',emissor:estado.emissor||'',
      vLoja:(lojaDo(l)&&lojaDo(l).valorPedido)||0};
  fr.onload=()=>{try{fr.contentWindow.postMessage(cofPayload,location.origin);}catch(e){}};
  fr.removeAttribute('srcdoc');fr.src='cof.html?v='+Date.now();
  document.getElementById('cofwrap').classList.add('on');
}
document.getElementById('cofFechar').onclick=()=>{
  document.getElementById('cofwrap').classList.remove('on');
  limparCofFrame();cofLead=null;};
document.getElementById('cofEmissor').onchange=e=>{estado.emissor=e.target.value;salvar();};
document.getElementById('cofData').onchange=e=>{
  const fr=document.getElementById('cofframe');
  if(fr.contentWindow)try{fr.contentWindow.postMessage({tipo:'lead',dataEntrega:e.target.value},location.origin);}catch(x){}};
document.getElementById('cofRegistrar').onclick=()=>{
  if(!cofLead)return;
  const d=document.getElementById('cofData').value||hoje();
  cofLead.cofEm=d;cofLead.gates=cofLead.gates||{};cofLead.gates.f1=true;
  if(idx(cofLead.etapa)>=0&&idx('cof')>=0&&idx(cofLead.etapa)<idx('cof')){
    let moveu=false,parou=null;
    while(idx(cofLead.etapa)<idx('cof')){
      const av=podeAvancar(cofLead);   // respeita gates obrigatórios e travas de cada etapa pulada
      if(!av.ok){parou=av.msg;break;}
      const prox=av.proxima;
      cofLead.etapa=prox.id;cofLead.alcancou=cofLead.alcancou||[];
      if(!cofLead.alcancou.includes(prox.id))cofLead.alcancou.push(prox.id);
      moveu=true;
    }
    if(moveu){cofLead.desdeEm=d;cofLead.semResp=0;}
    if(parou)toast('Entrega da COF registrada. O lead ficou em "'+nomeEt(ETAPAS[idx(cofLead.etapa)],cofLead.tipo)+'": '+parou);
  }
  salvar();
  document.getElementById('cofwrap').classList.remove('on');
  limparCofFrame();
  const id=cofLead.id;cofLead=null;desenhar();abrir(id);
};

/* ---------- lojas para repasse ---------- */
const somaL=a=>(a||[]).reduce((x,i)=>x+(Number(i.v)||0),0);
const STATUS_LOJA={disponivel:'Disponível',negociacao:'Em negociação',repassada:'Repassada'};
const ASSUME={cedente:'Cedente quita antes da transferência',comprador:'Comprador assume',negociado:'Ainda não definido'};

function novaLoja(){
  return{id:novoId('S'),_ficha:{status:'interna'},nome:'',cedente:{},obsCedente:'',cidade:'',uf:'',fr:'',m2:'',status:'disponivel',
    motivo:'',locacaoAte:'',valorPedido:0,
    desp:['Aluguel','IPTU','Telefone fixo + internet','Telefone móvel','Água','Energia'].map(t=>({t,v:0})),
    folha:[{t:'Balconista',v:0}],enc:30,contas:[],assume:'negociado',
    fat:0,margem:0,estoque:0,estoqueMorto:0,ticket:0,divFranq:0,outrosPassivos:0,mult:2,tetoMeses:24,
    outros:['Royalties','Software de gestão','Contabilidade','Fundo de marketing','Manutenção e embalagens','Seguro','Pró-labore'].map(t=>({t,v:t==='Software de gestão'?467:0})),
    obs:''};}

function calc(s){
  const desp=somaL(s.desp),folha=somaL(s.folha),enc=folha*(Number(s.enc)||0)/100,
        outros=somaL(s.outros),contas=somaL(s.contas);
  const informado=desp+folha, ajustado=desp+folha+enc+outros;
  const fat=Number(s.fat)||0, mg=Number(s.margem)||0, est=Number(s.estoque)||0;
  const mc=fat*mg/100;
  const be=mg>0?ajustado/(mg/100):null;
  const ebitda=fat&&mg?mc-ajustado:null;
  const faltando=[];
  if(!fat)faltando.push('faturamento médio dos últimos 12 meses');
  if(!mg)faltando.push('margem de contribuição');
  if(!est)faltando.push('estoque inventariado e valorado');
  if(!s.locacaoAte)faltando.push('vencimento do contrato de locação');
  if(!s.motivo)faltando.push('motivo do repasse');
  const mult=Number(s.mult)||2, morto=Number(s.estoqueMorto)||0;
  const estLiq=Math.max(0,est-morto);
  const passivo=contas+(Number(s.divFranq)||0)+(Number(s.outrosPassivos)||0);
  const deduz=s.assume==='cedente'?0:passivo;
  const intangivel=mult*fat;
  const valorRef=intangivel+estLiq-deduz;
  const pedido=Number(s.valorPedido)||0;
  const teto=estLiq+(Number(s.tetoMeses)||24)*(ebitda||0)-deduz;
  return{desp,folha,enc,outros,contas,informado,ajustado,fat,mg,est,be,ebitda,
    mult,estLiq,morto,passivo,deduz,intangivel,valorRef,pedido,teto,
    dif:pedido-valorRef,
    estNecessario:pedido-intangivel+deduz,
    fatNecessario:mult?(pedido-estLiq+deduz)/mult:null,
    pbIntang:ebitda&&ebitda>0?intangivel/ebitda:null,
    meses:ebitda&&ebitda>0?(Number(s.valorPedido)||0)/ebitda:null,
    xFat:fat?(Number(s.valorPedido)||0)/fat:null,
    pctEstoque:Number(s.valorPedido)?est/Number(s.valorPedido)*100:null,
    entrada:(Number(s.valorPedido)||0)+(s.assume==='comprador'?contas:0)+ajustado*3,
    faltando};
}

      <button class="btn" id="btnNovaLoja">Cadastrar loja</button></div>
    ${ls.length?ls.map(s=>{const c=calc(s);
      const leads=estado.leads.filter(l=>l.lojaId===s.id&&l.status==='ativo');
      return `<div class="loja-card ${s.status==='repassada'?'repassada':(c.faltando.length?'falta':'')}">

        <div class="n"><b>${brl(c.ajustado)}</b><span>custo mensal ajustado</span></div>
        <div class="n"><b>${c.fat?brl(c.valorRef):'—'}</b><span>valor pela regra da rede</span></div>
        <div class="n"><b style="color:${c.ebitda===null?'inherit':(c.ebitda>0?'var(--pine)':'var(--rust)')}">${c.ebitda===null?'—':brl(c.ebitda)}</b><span>resultado mensal</span></div>
        <div class="acts">
          ${fichaDe(s).status!=='interna'?`<span class="pill ficha-${fichaDe(s).status}">${ROTULO_FICHA[fichaDe(s).status]}</span>`:''}
          ${c.faltando.length?`<span class="pill" style="border-color:#E7C6B8;color:var(--rust)">faltam ${c.faltando.length} dados</span>`:''}
          <button class="btn btn-ghost btn-sm" data-loja="${s.id}" data-modo="ver">Abrir ficha</button>
          <button class="btn btn-ghost btn-sm" data-loja="${s.id}" data-modo="editar">Editar</button></div>

  document.getElementById('btnNovaLoja').onclick=()=>{
    const s=novaLoja();estado.lojas.push(s);lojaAberta=s.id;lojaModo='editar';salvar();desenhar();};

function linhas(s,campo,rotulo){

      <td><input type="text" value="${esc(i.t)}" data-l="${campo}|${n}|t"></td>
      <td><input type="number" class="v" value="${i.v||''}" data-l="${campo}|${n}|v"></td>
      <td class="x"><button data-del="${campo}|${n}" aria-label="Remover">×</button></td></tr>`).join('')}
    </table>
    <div class="tot"><span>${rotulo}</span><span>${brl(somaL(s[campo]))}</span></div>

const tabelaKv=(arr,rotulo)=>`<div class="kvf">${(arr||[]).filter(i=>i.t||i.v).map(i=>`<span>${esc(i.t||'—')}</span><span>${brl(i.v)}</span>`).join('')||'<span style="grid-column:1/3;color:var(--muted)">nenhuma linha</span>'}<div class="totf"><span>${rotulo}</span><span>${brl(somaL(arr))}</span></div></div>`;
const kvPares=pares=>`<div class="kvf">${pares.map(([k,v])=>`<span>${k}</span><span>${v}</span>`).join('')}</div>`;

    <div class="ed"><h3>Números da loja</h3>${kvPares([

      ['Ponto de equilíbrio (faturamento)',c.be?brl(c.be):'—'],['Ticket médio',brl(s.ticket)],['Metragem',s.m2?x(s.m2,0)+' m²':'—'],

      ${kvPares([['Encargos ('+x(s.enc||0)+'%)',brl(c.enc)],...(interno?[['Custos que não vieram do cedente',brl(c.outros)]]:[]),['Custo mensal ajustado',brl(c.ajustado)]])}</div>

function blocosCandidato(s,c){
  const x=(n,d=1)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d});
  const equipe=(s.folha||[]).filter(i=>i.t).map(i=>esc(i.t));
  const despesas=(s.desp||[]).filter(i=>i.t&&i.v);
  const resultadoPos=c.ebitda!==null&&c.ebitda>0;
  return `
  ${s.pontosFortes?`<div class="ed" style="border-left:5px solid var(--laranja)"><h3>Por que esta loja</h3><div class="texto">${esc(s.pontosFortes)}</div></div>`:''}
  <div class="kpis">
    <div class="kpi destaque"><b>${brl(c.fat)}</b><span>faturamento médio mensal · últimos 12 meses</span></div>
    <div class="kpi"><b>${c.mg?x(c.mg)+'%':'—'}</b><span>margem de contribuição</span></div>
    ${resultadoPos?`<div class="kpi pos"><b>${brl(c.ebitda)}</b><span>resultado operacional mensal</span></div>`:''}
    <div class="kpi"><b>${brl(c.estLiq)}</b><span>estoque incluído (a custo, líquido)</span></div>
    <div class="kpi"><b>${brl(s.ticket)}</b><span>ticket médio</span></div>
    <div class="kpi destaque"><b>${brl(s.valorPedido)}</b><span>valor de repasse</span></div>
  </div>
  <div class="grid-ficha">
    <div class="ed"><h3>A loja</h3>${kvPares([
      ['Unidade',s.fr?'FR'+esc(s.fr):'—'],['Cidade',esc([s.cidade,s.uf].filter(Boolean).join('/')||'—')],['Área',s.m2?x(s.m2,0)+' m²':'—'],
      ['Contrato de locação até',fmtD(s.locacaoAte)],['Equipe atual',equipe.length?equipe.length+' pessoa(s): '+equipe.join(', '):'—'],
      ['Motivo do repasse',esc(s.motivo||'—')]])}</div>
    <div class="ed"><h3>Operação mensal</h3>${kvPares([
      ...despesas.map(i=>[esc(i.t),brl(i.v)]),['Folha com encargos',brl(c.folha+c.enc)],['Custo operacional total',brl(c.ajustado)],
      ['Faturamento de equilíbrio',c.be?brl(c.be):'—'],
      ...(resultadoPos&&c.meses?[['Retorno do investimento (pedido ÷ resultado)',x(c.meses,0)+' meses']]:[])])}</div>
    <div class="ed"><h3>O que está incluído no repasse</h3>${kvPares([
      ['Ponto comercial, fachada e mobiliário padrão da rede','✓'],['Estoque inventariado a custo',brl(c.estLiq)],['Carteira de clientes e histórico de vendas','✓'],
      ['Treinamento e suporte da franqueadora na transição','✓'],['Contas a pagar da loja',c.contas?brl(c.contas)+' — '+(ASSUME[s.assume]||'a negociar'):'nenhuma']])}</div>
    <div class="ed"><h3>Próximos passos</h3><div class="texto">1. Conversa com a equipe de expansão e visita à loja.
2. Acesso à Circular de Oferta de Franquia (COF) e prazo legal de 10 dias.
3. Diligência do candidato sobre os números apresentados.
4. Contrato de franquia e termo de repasse; transição acompanhada pela franqueadora.</div></div>
  </div>`;
}

function fichaLoja(v){
  const s=estado.lojas.find(x=>x.id===lojaAberta);
  if(!s){lojaAberta=null;return desenharLojas();}
  const c=calc(s),f=fichaDe(s);
  v.innerHTML=`
   <div class="ficha-cab">
     <div><h3>${esc(s.nome||'Nova loja')}</h3>
       <div class="sub">${s.fr?'FR'+esc(s.fr)+' · ':''}${esc([s.cidade,s.uf].filter(Boolean).join('/')||'cidade não informada')}
         &nbsp;<span class="pill">${STATUS_LOJA[s.status]||''}</span>${f.status!=='interna'?` <span class="pill">${ROTULO_FICHA[f.status]}</span>`:''}</div></div>
     <div class="acts">
       <button class="btn btn-sm" id="btnEditarLoja">Editar</button>
       <button class="btn btn-ghost btn-sm" id="btnPdfInterno">PDF interno</button>
       <button class="btn btn-ghost btn-sm" id="btnPdfCandidato">PDF para candidato</button>
       <button class="btn btn-ghost btn-sm" id="btnVoltarLojas">Voltar à lista</button></div>
   </div>

function exportarPdfLoja(s,interno){
  const c=calc(s);
  const css=document.querySelector('style').textContent;
  const logo=new URL('../logo-pop.png',location.href).href;
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(s.nome||'Loja')} — ficha de formação de preço</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>${css}
  body{background:#fff;padding:0}.pdf{max-width:900px;margin:0 auto;padding:20px 24px}
  .pdf-topo{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid var(--laranja);padding-bottom:12px;margin-bottom:14px}
  .pdf-topo img{height:48px}.pdf-topo .t{text-align:right;font-size:12px;color:var(--muted)}.pdf-topo .t b{display:block;font-size:15px;color:var(--verde-escuro)}
  .ed{break-inside:avoid;box-shadow:none}.kpis{break-inside:avoid}
  .rodape{margin-top:18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  @media print{.pdf{padding:0}@page{margin:14mm}}
  </style></head><body><div class="pdf">
  <div class="pdf-topo"><img src="${logo}" alt="Rede POP Pet Center"><div class="t"><b>${interno?'Ficha de formação de preço de loja · uso interno':'Oportunidade de repasse de loja'}</b>${esc(s.nome||'')}${s.fr?' · FR'+esc(s.fr):''} · ${esc([s.cidade,s.uf].filter(Boolean).join('/'))}<br>emitida em ${new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${perfil?' por '+esc(perfil.nome):''}</div></div>
  ${interno?blocosFicha(s,c,true):blocosCandidato(s,c)}
  <div class="rodape">${interno?'Documento interno da franqueadora. Contém avaliação, múltiplo, teto e observações que não devem ser compartilhados com cedente ou candidato.':'Valores informados pelo franqueado cedente e conferidos pela franqueadora. Este documento não constitui oferta nem garantia de resultado; a decisão de investimento é do candidato, após a própria diligência.'} — POP Franchising e Participações Ltda · CNPJ 14.860.843/0001-72</div>
  </div><script>window.onload=()=>setTimeout(()=>window.print(),400);<\/script></body></html>`;
  const w=window.open('','_blank');
  if(!w){alert('O navegador bloqueou a janela do PDF. Libere pop-ups para este site e tente de novo.');return;}
  w.document.open();w.document.write(html);w.document.close();
}

      estado.leads.filter(l=>l.lojaId===s.id).forEach(l=>l.lojaRef=rotuloLoja(s));

  v.querySelectorAll('[data-l]').forEach(el=>el.onchange=e=>{

  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const [campo,n]=b.dataset.del.split('|');s[campo].splice(n,1);salvar();desenhar();});
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    s[b.dataset.add].push({t:'',v:0});salvar();desenhar();});
}
const rotuloLoja=s=>s?(s.nome+([s.cidade,s.uf].filter(Boolean).length?' — '+[s.cidade,s.uf].filter(Boolean).join('/'):'')):'';

function toggleLoja(){
  const t=document.getElementById('fTipo').value;
  document.getElementById('wrapLoja').style.display=t==='nova'?'none':'block';
  document.getElementById('labLoja').textContent=t==='repasse'?'Loja objeto do repasse':'Loja a ser convertida';
  const sel=document.getElementById('fLojaSel'),inp=document.getElementById('fLoja');
  const disp=(estado.lojas||[]).filter(s=>s.status!=='repassada');
  sel.style.display=t==='repasse'?'block':'none';
  inp.style.display=t==='repasse'?'none':'block';
  if(t==='repasse'){
    sel.innerHTML=disp.length?disp.map(s=>`<option value="${s.id}">${esc(rotuloLoja(s))}</option>`).join('')
      :'<option value="">Nenhuma loja cadastrada</option>';
    document.getElementById('dicaLoja').textContent=disp.length
      ?'Só aparecem aqui as lojas cadastradas na aba Lojas para repasse.'
      :'Cadastre a loja na aba Lojas para repasse antes de abrir o candidato.';
  }else document.getElementById('dicaLoja').textContent='';
}
document.getElementById('fTipo').onchange=toggleLoja;
function novo(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('fNome')){document.getElementById('fNome').focus();return;}
  const tipo=document.getElementById('fTipo').value;
  let lojaId='',lojaRef=g('fLoja');
  if(tipo==='repasse'){
    lojaId=document.getElementById('fLojaSel').value;
    const s=(estado.lojas||[]).find(x=>x.id===lojaId);
    if(s){lojaRef=rotuloLoja(s);if(s.status==='disponivel')s.status='negociacao';}
  }
  estado.leads.push({id:novoId('L'),nome:g('fNome'),tipo,
    lojaId,lojaRef,cidade:g('fCidade'),uf:g('fUf').toUpperCase(),regiao:g('fRegiao'),
    origem:document.getElementById('fOrigem').value,capital:g('fCapital'),investimento:g('fInvest'),
    tel:g('fTel'),cpf:g('fCpf'),email:g('fEmail'),
    etapa:'captacao',criadoEm:hoje(),desdeEm:hoje(),alcancou:['captacao'],gates:{},toques:{},semResp:0,
    status:'ativo',notas:''});
  ['fNome','fLoja','fCidade','fUf','fRegiao','fCapital','fInvest','fTel','fCpf','fEmail']
    .forEach(i=>document.getElementById(i).value='');
  document.getElementById('modal').classList.remove('on');
  salvar();desenhar();
}

function perdas(){
  const p=estado.leads.filter(l=>l.status==='perdido');
  if(!p.length){alert('Nenhuma perda registrada ainda.');return;}
  const c={};p.forEach(l=>c[l.motivo||'Outro']=(c[l.motivo||'Outro']||0)+1);
  alert('Perdas por motivo ('+p.length+' no total)\n\n'+
    Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`${n} — ${m} (${Math.round(n/p.length*100)}%)`).join('\n')+
    '\n\nSe o topo da lista é capital ou perfil, o problema está na captação, não no fechamento.');
}

function csv(){
  const cab=['id','nome','tipo','loja_ref','cidade','uf','regiao','origem','etapa','dias_na_etapa','status',
    'motivo_perda','sem_resposta','proximo_contato','capital','investimento','criado_em','cof_em',
    'liberacao_assinatura','ponto_em','taxa_em','aberto_em','tel','cpf','email','notas'];
  const linhas=estado.leads.map(l=>{const pt=proxToque(l);return [l.id,l.nome,TIPOS[l.tipo],l.lojaRef||'',l.cidade,l.uf,
    l.regiao||'',l.origem,nomeEt(ETAPAS[idx(l.etapa)],l.tipo),dias(l.desdeEm,hoje()),l.status,l.motivo||'',
    l.semResp||0,pt?pt.data:'',l.capital||'',l.investimento||'',l.criadoEm,l.cofEm||'',liberacaoCof(l)||'',
    l.pontoEm||'',l.taxaEm||'',l.inauguradoEm||'',l.tel||'',l.cpf||'',l.email||'',(l.notas||'').replace(/[\n;]/g,' ')];});
  const cel=v=>{let t=String(v==null?'':v);if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};  // aspas + neutraliza fórmulas
  const txt=[cab.map(cel).join(';'),...linhas.map(r=>r.map(cel).join(';'))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));
  a.download='esteira-expansao.csv';a.click();
}

function exemplo(){
  if(location.hostname!=='localhost'){alert('Os dados de exemplo só podem ser carregados em ambiente local (localhost).');return;}
  const d=n=>addD(hoje(),-n);
  const base=[
   ['Marcos Vieira','Águas Claras','DF','Indicação de franqueado','captacao','nova',2,320000,''],
   ['Juliana Prado','Anápolis','GO','Portal de franquias','qualificacao','nova',9,260000,''],
   ['Rogério Lima','Taguatinga','DF','Instagram','reuniao','conversao',5,400000,'Pet Shop Amigo Fiel — Taguatinga/DF'],
   ['Camila Freitas','Valparaíso','GO','Cliente da rede','cof','nova',6,280000,''],
   ['Eduardo Nunes','Sobradinho','DF','Prospecção ativa','ponto','conversao',26,350000,'Mundo Animal — Sobradinho/DF'],
   ['Patrícia Alves','Luziânia','GO','Feira / evento','contrato','repasse',4,300000,'POP PET LUZIÂNIA — Luziânia/GO'],
   ['Fernando Sá','Samambaia','DF','Indicação de franqueado','implantacao','nova',52,380000,''],
   ['Beatriz Rocha','Ceilândia','DF','Google','inauguracao','repasse',6,360000,'POP PET CEILÂNDIA — Ceilândia/DF']];
  base.forEach((b,i)=>{
    const et=b[4],tipo=b[5],pos=idx(et),gates={};
    ETAPAS.slice(0,pos).forEach(e=>gatesDe(e,tipo).forEach(g=>gates[g.id]=true));
    const gAtual=gatesDe(ETAPAS[pos],tipo);
    if(pos>0)gAtual.forEach((g,j)=>{if(j<gAtual.length-1)gates[g.id]=true});
    const toq={};(ETAPAS[pos].cad||[]).forEach((t,j)=>{if(addD(d(b[6]),t.d)<d(1))toq[et+'-'+j]={em:addD(d(b[6]),t.d),r:'ok'}});
    const l={id:novoId('L'),nome:b[0],cidade:b[1],uf:b[2],origem:b[3],etapa:et,tipo,lojaRef:b[8],
      desdeEm:d(b[6]),criadoEm:d(b[6]+14+i*3),capital:b[7],investimento:b[7],tel:'',cpf:'',email:'',regiao:'',
      alcancou:ETAPAS.slice(0,pos+1).map(e=>e.id),gates,toques:toq,semResp:0,status:'ativo',notas:''};
    if(pos>=idx('cof'))l.cofEm=d(b[6]+(et==='cof'?0:12));
    if(pos>=idx('ponto'))l.pontoEm=d(b[6]+2);
    if(pos>=idx('taxa'))l.taxaEm=d(b[6]+4);
    if(pos>=idx('inauguracao'))l.inauguradoEm=d(b[6]);
    estado.leads.push(l);
  });
  [['Tiago Moraes','Planaltina','DF','Capital insuficiente','qualificacao','nova'],
   ['Simone Dias','Formosa','GO','Sem ponto viável na praça','ponto','nova'],
   ['Alex Barreto','Gama','DF','Passivo da loja inviabilizou','ponto','conversao']].forEach((p,i)=>{
    estado.leads.push({id:novoId('L'),nome:p[0],cidade:p[1],uf:p[2],origem:'Portal de franquias',
      etapa:p[4],tipo:p[5],criadoEm:d(60+i*5),desdeEm:d(30),alcancou:ETAPAS.slice(0,idx(p[4])+1).map(e=>e.id),
      gates:{},toques:{},semResp:3,status:'perdido',motivo:p[3],perdidoEm:d(28),capital:'',investimento:'',notas:''});
  });
  estado.leads.filter(l=>l.tipo==='repasse').forEach((l,i)=>{
    if(i===0&&estado.lojas[0]){l.lojaId=estado.lojas[0].id;l.lojaRef=rotuloLoja(estado.lojas[0]);estado.lojas[0].status='negociacao';}
  });
  salvar();desenhar();
}
